<!doctype html><html><head>
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>¿Quién quiere mejorar su nota?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Línea gráfica Interacción Digital: navy, azul eléctrico, violeta y cian.
   Layout: escenario de concurso — columna principal (comodines, cronómetro, pregunta en barra hexagonal, opciones) y escalera de 5 niveles a la derecha */
:root {
  color-scheme: dark;
  --bg-0: #0b1636;
  --bg-1: #172b5b;
  --panel: #1b3068;
  --panel-2: #22397a;
  --indigo: #2456a6;
  --violet: #4330bc;
  --deep: #172b5b;
  --petrol: #155e75;
  --cyan: #00a9d6;
  --cyan-soft: #5fd3f0;
  --lilac: #9a8cff;
  --fg: #f5f7ff;
  --fg-soft: #c7d0ee;
  --fg-muted: #8f9bcb;
  --line: rgba(95, 211, 240, 0.5);
  --hair: rgba(199, 208, 238, 0.16);
  --ok: #5ee0a0;
  --half: #ffcf70;
  --bad: #ff8f8f;
  --ink-on-cyan: #06112f;
  --font-display: 'Manrope', 'Segoe UI', Arial, sans-serif;
  --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg-0);
  background-image:
    radial-gradient(1100px 620px at 50% -12%, rgba(67, 48, 188, 0.55), transparent 62%),
    radial-gradient(900px 500px at 50% 115%, rgba(0, 169, 214, 0.16), transparent 60%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 40px); padding-block: 22px 48px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--cyan-soft); outline-offset: 3px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan-soft); margin: 0 0 18px; }
.brand::before { content: ""; width: 40px; height: 3px; border-radius: 2px; background: var(--cyan); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Botones ---------- */
.btn { border-radius: 12px; padding: 12px 20px; border: 1px solid var(--hair); background: rgba(255,255,255,0.06); cursor: pointer; font-weight: 600; font-size: 15px; }
.btn:hover { background: rgba(255,255,255,0.12); }
.btn.primary { background: linear-gradient(180deg, var(--cyan-soft), var(--cyan)); color: var(--ink-on-cyan); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.warn { color: var(--half); border-color: rgba(255, 207, 112, 0.5); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; filter: none; }
.btn.lg { padding: 16px 28px; font-size: 17px; border-radius: 14px; }

/* ---------- Hexágonos estilo concurso ---------- */
.hexrow { position: relative; display: block; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
.hexrow::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); opacity: 0.55; }
.hex { display: block; position: relative; margin-inline: clamp(8px, 2.6vw, 30px); padding: 2px; background: linear-gradient(90deg, var(--cyan-soft), var(--lilac) 50%, var(--cyan-soft));
  clip-path: polygon(22px 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 22px 100%, 0 50%); }
.hex-in { clip-path: polygon(21px 0, calc(100% - 21px) 0, 100% 50%, calc(100% - 21px) 100%, 21px 100%, 0 50%);
  background: linear-gradient(180deg, #23407e 0%, #122453 100%); padding: 14px 40px; display: flex; align-items: center; gap: 14px; min-height: 58px; }
.opt { cursor: pointer; }
.opt .letter { font-family: var(--font-display); font-weight: 800; color: var(--cyan-soft); min-width: 1.6em; }
.opt .txt { font-size: 16.5px; line-height: 1.35; }
.opt:hover .hex-in { background: linear-gradient(180deg, #2c4fa0 0%, #1a3270 100%); }
.opt[aria-pressed="true"] .hex { background: linear-gradient(90deg, #fff, var(--cyan-soft), #fff); }
.opt[aria-pressed="true"] .hex-in { background: linear-gradient(180deg, var(--cyan-soft) 0%, var(--cyan) 100%); color: var(--ink-on-cyan); }
.opt[aria-pressed="true"] .letter { color: var(--ink-on-cyan); }
.opt.gone { cursor: default; opacity: 0.22; }
.opt.gone .txt { visibility: hidden; }
.opt:focus-visible { outline: none; }
.opt:focus-visible .hex { background: linear-gradient(90deg, #fff, #fff); }

.qbar .hex-in { padding: 20px 46px; min-height: 96px; flex-direction: column; align-items: flex-start; gap: 6px; }
.qbar .tag { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--cyan-soft); }
.qbar .q { font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 2vw, 23px); line-height: 1.3; text-wrap: balance; margin: 0; }

/* ---------- Inicio ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(20px, 3vw, 40px); align-items: start; }
@media (max-width: 920px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.title { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 5vw, 62px); line-height: 1.02; letter-spacing: -0.02em; margin: 6px 0 12px; text-wrap: balance; }
.title em { font-style: normal; background: linear-gradient(90deg, var(--cyan-soft), var(--lilac)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { color: var(--fg-soft); font-size: 17px; max-width: 58ch; margin: 0 0 22px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.rule { background: rgba(27, 48, 104, 0.72); border: 1px solid var(--hair); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.rule h3 { margin: 0; font-family: var(--font-display); font-size: 17px; }
.rule p { margin: 0; color: var(--fg-soft); font-size: 14.5px; }
.rule .k { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan-soft); font-weight: 700; }
.timechips { display: flex; flex-direction: column; gap: 6px; }
.timechips span { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; color: var(--fg-soft); border-bottom: 1px dashed var(--hair); padding-bottom: 4px; }
.timechips b { color: var(--fg); font-variant-numeric: tabular-nums; }
.lifelist { display: flex; flex-direction: column; gap: 10px; }
.lifelist div { display: flex; gap: 12px; align-items: flex-start; }
.lifelist .mini { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--cyan-soft); display: grid; place-items: center; font: 800 11px var(--font-display); color: var(--cyan-soft); }
.lifelist .mini svg { width: 18px; height: 18px; }
.lifelist p { margin: 0; font-size: 14px; color: var(--fg-soft); }
.lifelist b { color: var(--fg); }

.card { background: rgba(27, 48, 104, 0.82); border: 1px solid var(--hair); border-radius: 20px; padding: clamp(18px, 2.4vw, 28px); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 50px rgba(3, 7, 30, 0.45); }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 22px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--fg-soft); font-weight: 500; }
input[type="text"], input[type="password"], select { font: 500 16px var(--font-body); color: var(--fg); background: rgba(255,255,255,0.07); border: 1px solid var(--hair); border-radius: 12px; padding: 13px 14px; width: 100%; }
select option { background: #1b3068; color: var(--fg); }
input::placeholder { color: var(--fg-muted); }
.err { color: var(--bad); font-size: 14px; margin: 0; }
.note { font-size: 13.5px; color: var(--fg-muted); margin: 0; }
.cap { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(0, 169, 214, 0.1); border: 1px solid rgba(95, 211, 240, 0.3); font-size: 14.5px; }
.cap b { font-variant-numeric: tabular-nums; }
.cap.empty { background: rgba(255, 207, 112, 0.1); border-color: rgba(255, 207, 112, 0.4); color: var(--half); }
.resume { border: 1px solid rgba(255, 207, 112, 0.45); background: rgba(255, 207, 112, 0.08); border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.resume p { margin: 0; }
.foot { display: flex; justify-content: flex-end; margin-top: 24px; }
.emblem { width: 100%; max-width: 120px; height: auto; margin-bottom: 4px; }

/* ---------- Juego ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; align-items: start; }
@media (max-width: 1000px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.player { display: flex; flex-direction: column; }
.player small { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); font-weight: 600; }
.player b { font-family: var(--font-display); font-size: 20px; }
.lifelines { display: flex; gap: 14px; }
.life { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; cursor: pointer; padding: 0; }
.life .orb { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--cyan-soft); background: radial-gradient(circle at 50% 35%, #2456a6, #122453); color: var(--fg); position: relative; box-shadow: 0 0 18px rgba(95, 211, 240, 0.25); }
.life .orb svg { width: 28px; height: 28px; }
.life .orb .ff { font: 800 16px var(--font-display); letter-spacing: -0.02em; }
.life .lab { font-size: 12px; color: var(--fg-soft); font-weight: 600; }
.life:hover:not([disabled]) .orb { box-shadow: 0 0 26px rgba(95, 211, 240, 0.55); }
.life[disabled] { cursor: not-allowed; }
.life[disabled] .orb { opacity: 0.35; box-shadow: none; }
.life.used .orb::after { content: ""; position: absolute; width: 74px; height: 3px; background: var(--bad); transform: rotate(-40deg); border-radius: 2px; }
.life.used .lab::after { content: " · usado"; color: var(--bad); }

.timer { position: relative; width: 92px; height: 92px; flex: none; }
.timer svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.timer .track { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
.timer .bar { fill: none; stroke: var(--cyan-soft); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear, stroke 0.3s; }
.timer.low .bar { stroke: var(--half); }
.timer .num { position: absolute; inset: 0; display: grid; place-items: center; font: 800 28px var(--font-display); font-variant-numeric: tabular-nums; }
.timer.low .num { color: var(--half); }

.casebox { border: 1px solid rgba(154, 140, 255, 0.4); background: linear-gradient(180deg, rgba(67, 48, 188, 0.28), rgba(23, 43, 91, 0.6)); border-radius: 16px; padding: 16px 20px; }
.casebox .k { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lilac); font-weight: 700; }
.casebox h3 { margin: 2px 0 6px; font-family: var(--font-display); font-size: 19px; }
.casebox p { margin: 0; color: var(--fg-soft); font-size: 15.5px; max-width: 95ch; }
.notice { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--hair); background: rgba(255,255,255,0.05); }
.pill.cyan { border-color: rgba(95, 211, 240, 0.5); color: var(--cyan-soft); }
.pill.gold { border-color: rgba(255, 207, 112, 0.5); color: var(--half); }
.audience { display: flex; gap: 14px; align-items: center; border-radius: 14px; padding: 12px 16px; background: rgba(0, 169, 214, 0.12); border: 1px solid rgba(95, 211, 240, 0.4); }
.audience svg { width: 30px; height: 30px; flex: none; color: var(--cyan-soft); }
.audience p { margin: 0; }
.opts { display: grid; gap: 12px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 640px) { .opts.two { grid-template-columns: minmax(0, 1fr); } }
.opts.two .hex-in { justify-content: center; min-height: 72px; }
.opts.two .txt { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 4px; }
.flash { font-size: 14px; color: var(--half); min-height: 1.4em; margin: 0; }

/* Ordenar */
.order { display: flex; flex-direction: column; gap: 10px; }
.oitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.oitem .slot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--cyan-soft); font: 800 17px var(--font-display); color: var(--cyan-soft); }
.oitem .hexrow { cursor: grab; }
.oitem .hexrow:active { cursor: grabbing; }
.oitem .hex-in { padding: 12px 38px; min-height: 54px; }
.oitem .grip { color: var(--fg-muted); flex: none; }
.oitem.drag .hex { opacity: 0.4; }
.oitem.over .hex { background: linear-gradient(90deg, #fff, var(--cyan-soft), #fff); }
.arrows { display: flex; flex-direction: column; gap: 4px; }
.arrows button { width: 38px; height: 26px; border-radius: 8px; border: 1px solid var(--hair); background: rgba(255,255,255,0.06); cursor: pointer; display: grid; place-items: center; padding: 0; }
.arrows button:hover:not([disabled]) { background: rgba(255,255,255,0.14); }
.arrows button[disabled] { opacity: 0.25; cursor: default; }
.arrows svg { width: 14px; height: 14px; }

/* Escalera */
.ladder { background: rgba(14, 27, 70, 0.85); border: 1px solid var(--hair); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.ladder h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-muted); font-weight: 700; }
.rung { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; font-size: 14px; color: var(--fg-soft); }
.rung .n { font: 800 14px var(--font-display); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.rung .pt { font-size: 12.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.rung.now { background: linear-gradient(90deg, var(--cyan-soft), var(--cyan)); color: var(--ink-on-cyan); font-weight: 700; }
.rung.now .n, .rung.now .pt { color: var(--ink-on-cyan); }
.rung.done { color: var(--fg); }
.rung.done .n::after { content: "✓"; color: var(--cyan-soft); margin-left: 2px; font-size: 11px; }
.ladder .tot { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--fg-muted); }
@media (max-width: 1000px) {
  .ladder { position: static; order: -1; flex-direction: row; flex-wrap: wrap; padding: 10px; }
  .ladder h3, .ladder .tot { display: none; }
  .rung { grid-template-columns: auto auto; padding: 6px 10px; }
  .rung .pt { display: none; }
}

/* Transición */
.veil { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6, 10, 36, 0.72); backdrop-filter: blur(4px); z-index: 20; padding: 16px; }
.veil .box { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.veil .big { font: 800 clamp(30px, 5vw, 52px)/1.1 var(--font-display); }
.veil .sub { color: var(--fg-soft); font-size: 17px; }
.veil .big.time { color: var(--half); }

/* ---------- Resumen ---------- */
.sumhead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 24px; }
@media (max-width: 640px) { .sumhead { grid-template-columns: minmax(0, 1fr); } }
.grade { width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 30%, #2456a6, #122453 70%); border: 3px solid var(--cyan-soft); box-shadow: 0 0 40px rgba(95, 211, 240, 0.35); }
.grade b { display: block; font: 800 64px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.grade span { font-size: 14px; color: var(--fg-soft); }
.sumhead h2 { font-family: var(--font-display); font-size: clamp(26px, 3.4vw, 40px); margin: 4px 0 8px; line-height: 1.1; }
.sumhead p { margin: 0; color: var(--fg-soft); max-width: 62ch; }
.reviews { display: flex; flex-direction: column; gap: 14px; }
.rev { background: rgba(27, 48, 104, 0.78); border: 1px solid var(--hair); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.rev header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.rev .k { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan-soft); font-weight: 700; }
.rev h3 { margin: 0; font-family: var(--font-display); font-size: 17.5px; line-height: 1.35; }
.rev .ctx { margin: 0; font-size: 14px; color: var(--fg-muted); }
.score { font: 800 14px var(--font-display); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.score.s1 { background: rgba(94, 224, 160, 0.16); color: var(--ok); border: 1px solid rgba(94, 224, 160, 0.45); }
.score.s05 { background: rgba(255, 207, 112, 0.14); color: var(--half); border: 1px solid rgba(255, 207, 112, 0.45); }
.score.s0 { background: rgba(255, 143, 143, 0.12); color: var(--bad); border: 1px solid rgba(255, 143, 143, 0.4); }
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .cmp { grid-template-columns: minmax(0, 1fr); } }
.cmp div { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px 14px; }
.cmp small { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); font-weight: 700; margin-bottom: 4px; }
.cmp ul, .cmp ol { margin: 0; padding-left: 20px; }
.cmp li { margin: 2px 0; }
.cmp p { margin: 0; }
.why { margin: 0; padding: 12px 14px; border-radius: 12px; background: rgba(0, 169, 214, 0.09); border-left: 3px solid var(--cyan); color: var(--fg); }
.why b { color: var(--cyan-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Panel docente ---------- */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(6, 10, 36, 0.78); backdrop-filter: blur(4px); display: grid; place-items: start center; overflow-y: auto; padding: 40px 16px; }
.modal .card { width: min(820px, 100%); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 14px; }
.stat small { display: block; font-size: 12px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.stat b { font: 800 24px var(--font-display); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; border: 1px solid var(--hair); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-muted); background: rgba(255,255,255,0.03); }
td.num { font-variant-numeric: tabular-nums; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14.5px; color: var(--fg-soft); }
.check input { width: 18px; height: 18px; accent-color: var(--cyan); }
.danger { border: 1px solid rgba(255, 207, 112, 0.35); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.danger h3 { margin: 0; font-size: 16px; font-family: var(--font-display); }


/* ---------- Revisión de preguntas (panel docente) ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--hair); padding-bottom: 10px; }
.tab { font: 700 14px var(--font-body); color: var(--fg-soft); background: transparent; border: 1px solid var(--hair); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--cyan); color: var(--ink-on-cyan); border-color: var(--cyan); }
.tab:focus-visible { outline: 2px solid var(--cyan-soft); outline-offset: 2px; }
.rvtools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.qrev header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

.ans { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }

.ans li .l { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 800 12px var(--font-display); border: 1px solid var(--hair); }

.ans li.ok .l { background: var(--ok); color: #06231a; border-color: var(--ok); }

<script>
(function () {
'use strict';

/* =================== CONFIGURACIÓN =================== */
var TIME = { tf: 30, mc: 90, ord: 90 };   // segundos por tipo de pregunta
var AUDIENCE_BONUS = 30;                    // segundos extra del comodín "Pregunta al público"
var KEY_FP = 'fd0d6456-d74ecf53';           // huella de la clave de reinicio
var STORE = 'quiz-recuperacion-netiqueta-v1';

/* =================== BANCO 1: VERDADERO O FALSO (20) =================== */
var TF = [
  { id: 'tf01', q: 'En el estudio de Kruger et al. (2005), quienes enviaban mensajes serios o sarcásticos por correo esperaban que su tono se entendiera cerca del 78 % de las veces.', a: true, why: 'Esa fue la expectativa de quienes escribían: 78 %. El acierto real por correo fue de 56 %, cerca del azar.' },
  { id: 'tf02', q: 'Según Kruger et al. (2005), el tono de un mensaje se acertó más por correo electrónico que cuando el mismo mensaje se oía por voz.', a: false, why: 'Fue al revés: por correo se acertó el 56 % y por voz el 73 %.' },
  { id: 'tf03', q: 'Los autores explican la brecha por egocentrismo: quien escribe escucha su propio tono y olvida que el receptor no lo oye.', a: true, why: 'Es la explicación de Kruger et al.: no es que la gente lea mal, sino que quien escribe asume que su tono viaja con el texto.' },
  { id: 'tf04', q: 'La cifra de que el 93 % de la comunicación es no verbal es una conclusión de Mehrabian que se puede aplicar a cualquier conversación.', a: false, why: 'Proviene de experimentos con palabras sueltas y el propio Mehrabian rechaza generalizarla. En clase se usó como ejemplo de evaluación de fuentes.' },
  { id: 'tf05', q: 'En la cadena de la comunicación vista en clase, el paso que no controlamos es lo que el otro interpreta.', a: true, why: 'Controlamos lo que escribimos, el canal y el momento, pero no la interpretación. Por eso muchos conflictos empiezan sin que nadie quisiera ofender.' },
  { id: 'tf06', q: 'Para la clase, la netiqueta es una lista fija de prohibiciones que se aplica igual en cualquier espacio digital.', a: false, why: 'La clase la presentó como criterios para decidir cuando no hay una regla escrita, no como una lista de prohibiciones.' },
  { id: 'tf07', q: 'Según Shea (1994), la primera regla de la netiqueta es recordar que hay un ser humano al otro lado de la pantalla.', a: true, why: 'Es la idea que da nombre a la clase: detrás de cada pantalla hay una persona.' },
  { id: 'tf08', q: 'El colapso de contexto ocurre cuando una publicación se borra antes de que la vea la audiencia a la que iba dirigida.', a: false, why: 'Según Marwick y boyd (2011), es cuando audiencias que en la vida presencial están separadas confluyen en un mismo espacio.' },
  { id: 'tf09', q: 'Para Nissenbaum (2010), la privacidad depende de si la información fluye según el contexto en que se compartió.', a: true, why: 'Es la integridad contextual: la privacidad no es solo secreto o público, sino si la información circula como se esperaba.' },
  { id: 'tf10', q: 'Reenviar la captura de un chat privado a un grupo de 180 personas no afecta la privacidad, porque el contenido sigue siendo el mismo.', a: false, why: 'El contenido es el mismo, pero el contexto cambió. Ese es el ejemplo de la clase de una ruptura de la integridad contextual.' },
  { id: 'tf11', q: 'Suler (2004) explica que la invisibilidad, la asincronía y la sensación de anonimato reducen los frenos que tenemos cara a cara.', a: true, why: 'Es el efecto de desinhibición en línea, que explica por qué los conflictos digitales escalan más rápido.' },
  { id: 'tf12', q: 'Llevar una discusión a un espacio público suele bajar la temperatura, porque más personas pueden ayudar a mediar.', a: false, why: 'En el termómetro, llevar el conflicto a lo público y sumar audiencia lo hace subir; lo privado o una llamada lo bajan.' },
  { id: 'tf13', q: 'Preguntar antes de suponer la intención del otro es una decisión que tiende a bajar la temperatura de una conversación.', a: true, why: 'Es una de las conclusiones del simulador: preguntar antes de suponer y usar un canal privado bajan la temperatura.' },
  { id: 'tf14', q: '«Siempre es lo mismo contigo» es una crítica legítima, porque se refiere a una conducta que se repite.', a: false, why: 'La clase la usó como ejemplo de ataque: no señala una acción concreta, generaliza y apunta a la persona.' },
  { id: 'tf15', q: 'Una crítica apunta a la acción, el argumento o la conducta; un ataque apunta a la persona y la descalifica.', a: true, why: 'Esa es la distinción de la clase: la crítica se puede responder; el ataque solo deja defenderse.' },
  { id: 'tf16', q: 'Según la clase, la cancelación es siempre una forma de castigo injusto que debería evitarse.', a: false, why: 'La clase la definió como rechazo colectivo o llamado a consecuencias que no es buena ni mala por definición.' },
  { id: 'tf17', q: 'Verificación, proporcionalidad y posibilidad de rectificar son los criterios para evaluar una cancelación.', a: true, why: 'Son los tres criterios de la clase: hechos comprobados, reacción proporcional a la falta y opción de responder o reparar.' },
  { id: 'tf18', q: 'Según Olweus (1993), basta con un solo mensaje ofensivo para que exista acoso.', a: false, why: 'Olweus define el acoso por intención de dañar, repetición y desequilibrio de poder. Un mensaje aislado puede ser solo un conflicto.' },
  { id: 'tf19', q: 'Según Smith et al. (2008), el acoso digital suma la difusión masiva, la persistencia, el posible anonimato y la falta de un lugar seguro.', a: true, why: 'Son los rasgos que lo digital agrega a los de Olweus.' },
  { id: 'tf20', q: 'Según la clase, si publicar algo es legal, también es ético y responsable hacerlo.', a: false, why: 'Lo legal, lo ético y lo responsable no siempre coinciden. Por eso las decisiones se analizan desde cinco lentes.' }
];

/* =================== BANCO 2: CASOS DE SELECCIÓN MÚLTIPLE (10 × 5) =================== */
var CASES = [
  { id: 'c01', title: 'Equipo Ámbar', text: 'Laura coordina el equipo Ámbar. A ocho horas de la entrega, le escribe a Mateo: «Necesitamos tu parte hoy antes de las 10 p. m.». A las 11:42 p. m., Mateo responde solo «Bueno.» y no sube nada. Laura siente que es una burla y está a punto de escribir en el grupo del equipo: «Siempre es lo mismo contigo, Mateo».',
    qs: [
      { id: 'c01q1', q: '¿Qué explica que Laura lea «Bueno.» como una burla? Marca 2.', o: [['En el mensaje escrito desaparecen el tono, los gestos y las pausas.', 1], ['Laura reconstruye cómo cree que fue dicho a partir de pistas mínimas.', 1], ['El punto final expresa enojo en cualquier mensaje y contexto.', 0], ['La palabra «Bueno» tiene un solo significado negativo en un chat.', 0], ['Los mensajes cortos se interpretan de la misma forma en todos los casos.', 0]], why: 'El receptor no recibe solo las palabras: reconstruye cómo cree que fueron dichas, sin tono ni gestos.' },
      { id: 'c01q2', q: '¿Qué pasaría si Laura envía ese mensaje al grupo? Marca 2.', o: [['Pasaría de cuestionar una conducta a atacar a la persona.', 1], ['Llevaría la discusión a un espacio con más audiencia.', 1], ['Bajaría la temperatura porque el problema quedaría claro para todos.', 0], ['Sería una crítica legítima, porque se refiere a algo que se repite.', 0], ['Solo afectaría a Mateo, no al resto del grupo.', 0]], why: '«Siempre es lo mismo contigo» es el ejemplo de ataque de la clase, y llevarlo al grupo suma audiencia: ambos factores suben la temperatura.' },
      { id: 'c01q3', q: '¿Qué respuestas tienden a bajar la temperatura? Marca 2.', o: [['Preguntarle en privado cómo va su parte, antes de suponer nada.', 1], ['Proponerle una llamada corta para resolverlo con voz.', 1], ['Responderle también «Bueno.» para no darle importancia.', 0], ['Escribirle «¿Estás molesto?» para que reconozca su emoción.', 0], ['Pedirle al grupo que opine sobre la actitud de Mateo.', 0]], why: 'Preguntar antes de suponer y usar un canal con voz bajan la temperatura. Otro «Bueno.» devuelve la ambigüedad y «¿Estás molesto?» supone una emoción.' },
      { id: 'c01q4', q: 'Según la cadena de la comunicación vista en clase, ¿qué es cierto en este caso? Marca 2.', o: [['Laura no controla cómo Mateo interpretará su respuesta.', 1], ['Laura sí controla lo que escribe, el canal y el momento.', 1], ['Si Mateo no quiso ofender, no hay conflicto.', 0], ['Lo que Mateo quiso decir llega intacto si se escribe en un chat.', 0], ['El paso que más controlamos es la interpretación que hace el otro.', 0]], why: 'El paso 3, lo que el otro interpreta, no lo controlamos. Sí controlamos lo que escribimos, el canal y el momento.' },
      { id: 'c01q5', q: 'Si Laura aplica PAUSA antes de responder, ¿qué debería hacer? Marca 3.', o: [['Parar antes de responder en caliente.', 1], ['Ubicar el contexto: la hora, la entrega y lo que sabe de Mateo.', 1], ['Seleccionar una respuesta y también el canal para enviarla.', 1], ['Publicar primero y analizar después si funcionó.', 0], ['Actuar de inmediato para no perder tiempo antes de la entrega.', 0]], why: 'PAUSA: para, analiza, ubica el contexto, selecciona respuesta y canal, y actúa. Actuar es el último paso, no el primero.' }
    ] },
  { id: 'c02', title: 'Daniela y la corrección', text: 'Daniela necesita pedir correcciones en dos chats. A Felipe, su compañero de equipo, le escribe por WhatsApp: «Necesito que corrijas esto.». A Ana Gómez, una profesional que conoció en LinkedIn y que aceptó revisar su portafolio, le envía exactamente el mismo mensaje. Felipe se molesta y Ana no responde. Daniela no entiende qué pasó, porque «solo pidió un favor».',
    qs: [
      { id: 'c02q1', q: '¿Por qué el mismo mensaje produjo reacciones negativas? Marca 2.', o: [['No tiene en cuenta a quién va dirigido ni en qué espacio.', 1], ['Sin saludo ni contexto, puede leerse como una orden.', 1], ['Los mensajes cortos siempre suenan groseros.', 0], ['Felipe y Ana leyeron mal un mensaje que era completamente claro.', 0], ['Pedir correcciones no debería hacerse nunca por un canal escrito.', 0]], why: 'El contenido casi no cambia; lo que cambia es la lectura según el receptor y el espacio. Sin contexto, la intención percibida puede ser la de una orden.' },
      { id: 'c02q2', q: '¿Qué cambios mejorarían el mensaje para Ana, en LinkedIn? Marca 3.', o: [['Saludar y recordar dónde se conocieron.', 1], ['Explicar el porqué de la solicitud y agradecer su tiempo.', 1], ['Agregar «cuando puedas» para no presionarla.', 1], ['Escribir en mayúsculas para que note la urgencia.', 0], ['Reenviar el mismo texto cada día hasta que responda.', 0]], why: 'En la reescritura de clase, lo que más cambió fue el saludo, el contexto, el «cuando puedas», el porqué y el agradecimiento.' },
      { id: 'c02q3', q: '¿Por qué el mensaje a Ana también es un asunto de networking? Marca 2.', o: [['Construye una primera impresión profesional ante alguien del sector.', 1], ['La forma de interactuar también hace parte de la marca personal.', 1], ['Los mensajes privados no los lee nadie, así que no cuentan.', 0], ['Solo lo publicado en el perfil cuenta para la marca personal.', 0], ['El networking depende ante todo del número de contactos que se tienen.', 0]], why: 'La versión para LinkedIn también es networking: así se construye una primera impresión, y la huella incluye cómo interactuamos.' },
      { id: 'c02q4', q: '¿Qué criterios de netiqueta están bien asociados con su pregunta? Marca 3.', o: [['Claridad: ¿puede leerse de una forma que no quise?', 1], ['Empatía: ¿cómo lo recibiría yo en su lugar?', 1], ['Contexto: ¿es adecuado para este espacio y esta audiencia?', 1], ['Privacidad: ¿cómo lo recibiría yo?', 0], ['Respeto: ¿la información circula como se esperaba al compartirla?', 0]], why: 'Son tres de los seis criterios de la clase. Las otras dos preguntas están cruzadas: la de empatía y la de privacidad.' },
      { id: 'c02q5', q: '¿Qué debería cambiar entre la versión para Felipe y la versión para Ana? Marca 2.', o: [['El tono y el nivel de formalidad del mensaje.', 1], ['El contexto que se le ofrece a quien lo recibe.', 1], ['La tarea que se le pide a cada uno.', 0], ['El número de emojis que exige cada una de las plataformas.', 0], ['Nada: un buen mensaje sirve igual en cualquier canal y audiencia.', 0]], why: 'En la reescritura cambian el tono, el contexto, la intención percibida y la disposición del receptor; el contenido es casi el mismo.' }
    ] },
  { id: 'c03', title: 'La práctica de Valentina', text: 'Valentina hace su práctica en una empresa. Publica en su cuenta abierta: «Otro lunes haciendo fotocopias. Cuatro meses aprendiendo… a usar la impresora», y recibe 248 me gusta. Semanas después, molesta, publica: «Mi jefe de práctica es un INÚTIL. No vayan, son unos estafadores». Su jefe comparte la publicación y en pocas horas suma 210 compartidos.',
    qs: [
      { id: 'c03q1', q: '¿Quiénes pueden leer la primera publicación? Marca 3.', o: [['Su familia y sus amigos.', 1], ['Su jefe de práctica.', 1], ['Un futuro reclutador.', 1], ['Solo sus amigos, porque la escribió en tono de humor.', 0], ['Solo quienes le dieron me gusta a la publicación.', 0]], why: 'Es una cuenta abierta: la familia, los amigos, el jefe y un futuro reclutador están en el mismo lugar.' },
      { id: 'c03q2', q: '¿Qué describe el colapso de contexto, según Marwick y boyd (2011)? Marca 2.', o: [['Audiencias separadas en la vida presencial confluyen en un mismo espacio.', 1], ['Una misma publicación llega a la vez a la familia, los amigos y el jefe.', 1], ['Una publicación pierde alcance cuando se comparte en otra plataforma.', 0], ['El contenido se borra solo cuando la audiencia lo reporta.', 0], ['Quien publica pierde el control técnico de su propia cuenta.', 0]], why: 'Colapso de contexto: audiencias que en la vida presencial están separadas confluyen en un mismo espacio.' },
      { id: 'c03q3', q: '¿Qué cambió en la segunda publicación? Marca 3.', o: [['Insulta a una persona identificable.', 1], ['Acusa sin pruebas a una empresa.', 1], ['Generaliza y alcanza a mucha más gente.', 1], ['Deja de ser una publicación pública.', 0], ['Mejora su marca personal al mostrar carácter.', 0]], why: 'La clase señaló el insulto, la generalización, la acusación sin pruebas contra una empresa y el alcance de 210 compartidos.' },
      { id: 'c03q4', q: '¿Cuál es el argumento clave de la clase sobre las dos publicaciones? Marca 2.', o: [['La diferencia entre ellas es de grado, no de tipo.', 1], ['Ambas son públicas y ambas pueden llegar al jefe.', 1], ['La primera era solo humor.', 0], ['Solo la segunda podía verla alguien de la empresa.', 0], ['La segunda es aceptable porque cuenta una experiencia real.', 0]], why: '«La primera ya tenía el problema; la segunda solo lo hace evidente.»' },
      { id: 'c03q5', q: '¿Qué consecuencias puede tener la segunda publicación? Marca 3.', o: [['Perder la práctica.', 1], ['Dañar su reputación y su marca personal.', 1], ['Afectar la honra del jefe o de la empresa.', 1], ['Ninguna, si la borra al día siguiente.', 0], ['Mejorar de inmediato las condiciones de su práctica.', 0]], why: 'La clase mencionó perder la práctica, el daño a la reputación, la posible afectación de la honra y una huella que no se borra.' }
    ] },
  { id: 'c04', title: 'La captura de Sofía', text: 'Sofía le cuenta a Juan, por chat privado, que perdió una materia y que pasa por un momento difícil en casa. Juan, preocupado, toma una captura y la reenvía al grupo del curso, de 180 personas, para pedir que la apoyen. En minutos varios compañeros comentan la captura y alguien la reenvía a otro grupo.',
    qs: [
      { id: 'c04q1', q: 'Según Nissenbaum (2010), ¿por qué se afectó la privacidad de Sofía? Marca 2.', o: [['La información salió del contexto en el que se compartió.', 1], ['El chat privado tenía sus propias normas entre dos personas.', 1], ['La información era secreta y dejó de serlo, sin importar el contexto.', 0], ['Juan usó una captura en lugar de copiar el texto del mensaje.', 0], ['No se afectó, porque la intención de Juan era ayudarla.', 0]], why: 'Integridad contextual: la privacidad no es solo secreto o público, sino si la información fluye según el contexto en que se compartió.' },
      { id: 'c04q2', q: '¿Qué criterios de netiqueta pasó por alto Juan? Marca 3.', o: [['Privacidad: si la información circula como se esperaba.', 1], ['Empatía: cómo lo recibiría él en el lugar de Sofía.', 1], ['Contexto: si era adecuado para ese espacio y esa audiencia.', 1], ['Claridad, porque la captura tenía errores de ortografía.', 0], ['Ninguno, porque lo hizo con la intención de ayudar.', 0]], why: 'Reenviar a 180 personas algo contado en privado rompe la privacidad, ignora el contexto y no considera cómo lo viviría Sofía.' },
      { id: 'c04q3', q: '¿Qué rasgos del entorno digital agravan lo que pasó? Marca 2.', o: [['La difusión: la captura llegó a otro grupo.', 1], ['La persistencia: lo reenviado sigue circulando.', 1], ['Que solo los miembros del curso pueden ver la captura.', 0], ['Que los chats privados se borran a las 24 horas.', 0], ['Que Sofía puede responder luego.', 0]], why: 'Difusión y persistencia: lo que se reenvía llega a otros espacios y no se puede recoger.' },
      { id: 'c04q4', q: '¿Qué habría sido una forma de apoyarla respetando la integridad contextual? Marca 2.', o: [['Preguntarle qué apoyo quiere y si se puede contar algo.', 1], ['Hablar con ella en privado u orientarla hacia Bienestar Universitario.', 1], ['Reenviar la captura tapando solo la hora y la fecha del mensaje.', 0], ['Contarlo sin su nombre, pero con detalles que la identifican.', 0], ['Contarlo en el grupo, porque así más personas pueden ayudar.', 0]], why: 'Respetar la integridad contextual es que la información siga las normas del espacio donde se compartió; ella decide qué se cuenta.' },
      { id: 'c04q5', q: '¿Qué es correcto sobre la huella digital en este caso? Marca 2.', o: [['La huella también se construye por cómo interactuamos.', 1], ['Reenviar contenido ajeno también dice algo de quien lo reenvía.', 1], ['Solo deja huella la persona que escribió el mensaje original.', 0], ['Reenviar no deja ningún rastro si se hace desde un chat.', 0], ['La huella solo incluye lo que se publica en el propio perfil.', 0]], why: 'Puente con la huella digital: también cuenta cómo interactuamos, no solo lo que publicamos.' }
    ] },
  { id: 'c05', title: 'El grupo de Cálculo 2', text: 'En el grupo de WhatsApp de Cálculo 2, de 60 estudiantes, Andrés escribe: «Qué raro que algunos siempre tengan las respuestas del taller…». Camila lo toma como una indirecta, responde en mayúsculas y etiqueta a Andrés. Otros se suman con stickers, alguien publica capturas en sus historias y, a la medianoche, ya hay insultos.',
    qs: [
      { id: 'c05q1', q: '¿Qué pasos de la cadena de escalamiento aparecen en el caso? Marca 3.', o: [['Un mensaje ambiguo y una interpretación negativa.', 1], ['Una respuesta emocional y además pública.', 1], ['Se suman otros, hay exposición y luego ataques.', 1], ['Una pausa antes de responder que evitó el conflicto.', 0], ['Una conversación privada que resolvió el malentendido.', 0]], why: 'La cadena de la clase: mensaje ambiguo, interpretación negativa, respuesta emocional, respuesta pública, más personas, exposición, ataques y conflicto abierto.' },
      { id: 'c05q2', q: 'Según Suler (2004), ¿qué facilita que la discusión escale en línea? Marca 3.', o: [['La invisibilidad: no se ve la cara del otro.', 1], ['La asincronía: se responde cuando se quiere.', 1], ['La sensación de anonimato.', 1], ['Que el grupo tenga más de 20 integrantes.', 0], ['Que todos los mensajes del grupo sean de texto.', 0]], why: 'Suler explica la desinhibición en línea por la invisibilidad, la asincronía y la sensación de anonimato.' },
      { id: 'c05q3', q: '¿Qué factores del termómetro hicieron subir la temperatura? Marca 3.', o: [['Canal: se llevó a lo público y a terceros.', 1], ['Audiencia: se sumaron más personas.', 1], ['Exposición y ataques: capturas e insultos.', 1], ['Ambigüedad: los mensajes fueron claros y concretos.', 0], ['Emocionalidad: todos hicieron una pausa antes de responder.', 0]], why: 'En la tabla de factores, lo público, sumar audiencia, las capturas y los apodos suben el termómetro.' },
      { id: 'c05q4', q: '¿Qué habría bajado la temperatura en el primer momento? Marca 2.', o: [['Que Camila le preguntara a Andrés qué quiso decir.', 1], ['Pasar la conversación a lo privado o a una llamada.', 1], ['Responder con sarcasmo.', 0], ['Pedir a los demás que tomaran partido en el grupo.', 0], ['Hacer capturas para tener pruebas en sus historias.', 0]], why: 'Preguntar antes de suponer y usar lo privado o una llamada bajan la temperatura; el sarcasmo, lo público y sumar personas la suben.' },
      { id: 'c05q5', q: '¿En qué momento dejó de ser una discusión entre dos? Marca 2.', o: [['Cuando otros se sumaron con stickers.', 1], ['Cuando las capturas llegaron a las historias.', 1], ['Cuando Andrés escribió su primer mensaje.', 0], ['Cuando Camila lo leyó.', 0], ['Nunca: siempre fue solo entre Andrés y Camila.', 0]], why: 'Involucrar a más personas cambia la naturaleza del conflicto: deja de ser entre dos cuando otros se suman y cuando hay exposición.' }
    ] },
  { id: 'c06', title: 'El artículo de Sebastián', text: 'Sebastián publica en LinkedIn su primer artículo sobre diseño de apps y recibe tres comentarios. Lucía: «No comparto tu conclusión sobre la accesibilidad; te dejo un estudio que dice otra cosa». Pedro: «Eres un improvisado y todo el curso lo sabe». Marta: «Se nota que no investigaste; la fuente del segundo párrafo está desactualizada». Sebastián quiere responderles a los tres igual.',
    qs: [
      { id: 'c06q1', q: '¿Qué comentarios o partes de ellos son crítica o desacuerdo? Marca 2.', o: [['El de Lucía, porque apunta al argumento.', 1], ['Lo que dice Marta sobre la fuente desactualizada.', 1], ['El de Pedro, porque señala un problema real del autor.', 0], ['Ninguno: toda crítica pública es un ataque.', 0], ['Todos, porque los tres hablan sobre el artículo.', 0]], why: 'La crítica apunta a la acción, el argumento o la conducta, y se puede responder.' },
      { id: 'c06q2', q: '¿Por qué el comentario de Pedro es un ataque? Marca 2.', o: [['Apunta a la persona y no al argumento.', 1], ['Descalifica a Sebastián y lo expone ante otros.', 1], ['No cita ninguna fuente.', 0], ['Lo escribió en LinkedIn y no en un chat privado.', 0], ['No es un ataque: es una opinión válida sobre su trabajo.', 0]], why: 'El ataque apunta a la persona: descalifica, insulta o humilla, y solo deja defenderse.' },
      { id: 'c06q3', q: 'Sobre el comentario de Marta, ¿qué es cierto? Marca 2.', o: [['Mezcla una descalificación con una observación útil.', 1], ['Lo de la fuente se puede responder con argumentos.', 1], ['Es cyberbullying porque se publicó en un espacio público.', 0], ['Es un ataque y se ignora.', 0], ['Es una crítica perfecta porque menciona una fuente.', 0]], why: '«Se nota que no investigaste» apunta a la persona; la fuente desactualizada es una crítica que se puede atender.' },
      { id: 'c06q4', q: '¿Cómo debería responder Sebastián? Marca 2.', o: [['Agradecer a Lucía y discutir el estudio con argumentos.', 1], ['Revisar la fuente que señala Marta y corregir si hace falta.', 1], ['Responder a Pedro con un insulto equivalente para equilibrar.', 0], ['Responder igual a los tres.', 0], ['Borrar el artículo para evitar que lleguen más comentarios.', 0]], why: 'La crítica se responde con argumentos; distinguirla del ataque evita escalar el conflicto en un espacio profesional.' },
      { id: 'c06q5', q: '¿Por qué su forma de responder afecta su marca personal? Marca 2.', o: [['En una red profesional las interacciones también se ven.', 1], ['Sus decisiones digitales también son éticas y reputacionales.', 1], ['LinkedIn borra solos los comentarios negativos de los artículos.', 0], ['Solo importa el contenido del artículo, no las respuestas.', 0], ['Responder a una crítica siempre debilita la reputación.', 0]], why: 'Cierre de la clase: nuestras decisiones digitales también son éticas y reputacionales, y en una red profesional eso es marca personal.' }
    ] },
  { id: 'c07', title: 'Café Raíz', text: 'Café Raíz, el emprendimiento de dos egresados, es acusado en un video viral de servir comida vencida a una clienta. En un día el video suma 50.000 vistas, miles de comentarios piden cerrar el local y algunos publican la dirección de la casa de los dueños. Al día siguiente aparece el recibo: la compra fue en otro local con un nombre parecido.',
    qs: [
      { id: 'c07q1', q: '¿Cómo definió la clase la cancelación? Marca 2.', o: [['Rechazo colectivo o llamado a consecuencias por acciones o declaraciones.', 1], ['Un fenómeno que no es bueno ni malo por definición.', 1], ['Una forma de justicia social que siempre resulta necesaria.', 0], ['Un castigo injusto en todos los casos, que debería prohibirse.', 0], ['Un fenómeno que se percibe igual en todas las culturas e ideologías.', 0]], why: 'La clase la definió así y, con Norris (2023), mostró que su percepción varía según la ideología y el contexto.' },
      { id: 'c07q2', q: '¿Qué falló primero en este caso? Marca 2.', o: [['La verificación: los hechos no estaban comprobados ni completos.', 1], ['Se reaccionó antes de confirmar en qué local ocurrió la compra.', 1], ['La proporcionalidad, porque la falta sí estaba comprobada.', 0], ['La rectificación, porque los dueños respondieron antes del video.', 0], ['Nada: un video viral ya es una prueba suficiente de los hechos.', 0]], why: 'El primer criterio es la verificación: ¿los hechos están comprobados y completos? Aquí no lo estaban.' },
      { id: 'c07q3', q: '¿Qué reacciones fueron desproporcionadas? Marca 2.', o: [['Pedir masivamente el cierre del local.', 1], ['Publicar la dirección de la casa de los dueños.', 1], ['Preguntar a la clienta en qué local fue la compra.', 0], ['Esperar la respuesta del local antes de opinar.', 0], ['Compartir el recibo.', 0]], why: 'Proporcionalidad: la reacción debe guardar relación con la falta. Exponer datos de los dueños no la guarda en ningún caso.' },
      { id: 'c07q4', q: '¿Qué significa aquí la posibilidad de rectificar? Marca 2.', o: [['Que los dueños puedan responder, explicar o reparar.', 1], ['Que quienes difundieron el video corrijan lo publicado.', 1], ['Que el caso se cierre sin que nadie diga nada más.', 0], ['Que la clienta deba disculparse antes que nadie.', 0], ['Que las plataformas borren todos los comentarios.', 0]], why: 'Rectificación: ¿la persona puede responder, explicar o reparar? También aplica a quien publicó un dato falso.' },
      { id: 'c07q5', q: '¿Qué ilustra el caso, en la línea de Ronson (2015)? Marca 2.', o: [['Una sola publicación puede traer consecuencias desproporcionadas.', 1], ['La exposición pública puede dañar a alguien antes de verificar.', 1], ['Las redes corrigen sus errores en pocas horas y sin daño.', 0], ['El escarnio público solo afecta a personas muy famosas.', 0], ['Que un video sea viral garantiza que lo que muestra es verdad.', 0]], why: 'Ronson documenta consecuencias desproporcionadas por una sola publicación.' }
    ] },
  { id: 'c08', title: 'Los memes de Tomás', text: 'Desde hace dos meses, en el grupo «Ingeniería 2026», varios compañeros publican casi a diario memes con fotos de Tomás, que tartamudea al exponer. Él pidió una vez que pararan, pero convirtieron su foto en sticker y lo compartieron en otros grupos. Uno de los autores es el representante del curso. Tomás dejó de asistir a las exposiciones.',
    qs: [
      { id: 'c08q1', q: '¿Qué rasgos del acoso, según Olweus (1993), aparecen? Marca 3.', o: [['Intención de dañar: siguieron después de que pidió parar.', 1], ['Repetición: los memes se publican casi a diario.', 1], ['Desequilibrio de poder: son varios y está el representante.', 1], ['Anonimato total de todas las personas que publican.', 0], ['Un único mensaje ofensivo publicado de forma aislada.', 0]], why: 'Olweus define el acoso por intención de dañar, repetición y desequilibrio de poder. Los tres aparecen en el caso.' },
      { id: 'c08q2', q: '¿Qué agrega el entorno digital, según Smith et al. (2008)? Marca 3.', o: [['Difusión masiva: el sticker llegó a otros grupos.', 1], ['Persistencia: los memes siguen circulando.', 1], ['Ningún lugar seguro: lo sigue fuera de clase.', 1], ['Menos impacto, porque ocurre solo en el celular.', 0], ['Que el acoso termina cuando él sale del grupo.', 0]], why: 'Lo digital suma difusión masiva, persistencia, posible anonimato y que no hay un lugar seguro.' },
      { id: 'c08q3', q: '¿Por qué esto no es un simple conflicto? Marca 2.', o: [['Hay humillación repetida a una persona.', 1], ['Se moviliza a otros y se expone a la víctima.', 1], ['Tomás nunca respondió a ninguno de los memes.', 0], ['Los memes son humor.', 0], ['Ocurrió dentro de un grupo de un curso académico.', 0]], why: 'Un conflicto adquiere rasgos de acoso cuando alguien humilla repetidamente, moviliza a otros, expone o persiste sabiendo que causa daño.' },
      { id: 'c08q4', q: 'Si eres parte del grupo, ¿qué decisiones son coherentes con la clase? Marca 2.', o: [['No reenviar ni reaccionar a los memes.', 1], ['Apoyar a Tomás en privado y orientarlo hacia Bienestar Universitario.', 1], ['Compartir el sticker solo con amigos de confianza.', 0], ['Esperar a que Tomás lo resuelva solo, porque no te corresponde.', 0], ['Responder con memes de los autores para equilibrar la situación.', 0]], why: 'Reenviar o reaccionar suma difusión y audiencia. Ante el acoso, la clase orienta hacia el apoyo y Bienestar Universitario.' },
      { id: 'c08q5', q: '¿Qué criterios de netiqueta se rompieron? Marca 3.', o: [['Respeto: tratar a una persona, no a un perfil.', 1], ['Empatía: cómo lo recibiría yo en su lugar.', 1], ['Responsabilidad: qué consecuencias puede tener.', 1], ['Claridad, porque los memes no tenían ningún texto.', 0], ['Ninguno, porque era un grupo informal de amigos.', 0]], why: 'Se rompen el respeto, la empatía y la responsabilidad: Tomás dejó de asistir a las exposiciones.' }
    ] },
  { id: 'c09', title: 'La foto de la fiesta', text: 'Mariana tiene una entrevista de práctica el lunes. Su amigo Kevin quiere publicar en su cuenta abierta una foto de la fiesta del viernes en la que ella aparece haciendo gestos con una bebida en la mano. Kevin dice que no hay problema: «es mi cuenta, la foto es mía y no tiene nada ilegal». La empresa de la entrevista sigue la cuenta de Kevin.',
    qs: [
      { id: 'c09q1', q: '¿Desde qué lentes se analiza una decisión digital en la clase? Marca 2.', o: [['Legal, ética y responsable.', 1], ['Relacional y marca personal.', 1], ['Técnica y estética.', 0], ['Popularidad, alcance y viralidad.', 0], ['Solo la legal, porque es la que obliga.', 0]], why: 'Las cinco lentes de la clase son legal, ética, responsable, relacional y marca personal.' },
      { id: 'c09q2', q: 'Sobre el argumento de Kevin, ¿qué es correcto? Marca 2.', o: [['Que sea legal no significa que sea ético o responsable.', 1], ['Que pueda publicarla no significa que deba hacerlo así.', 1], ['Si es su cuenta, solo importa la lente legal.', 0], ['Como la foto es suya, Mariana no tiene nada que proteger.', 0], ['Si no es ilegal, tampoco afecta su relación con Mariana.', 0]], why: 'Idea central: que podamos publicar algo no significa que debamos hacerlo de cualquier manera; lo legal y lo ético no siempre coinciden.' },
      { id: 'c09q3', q: '¿Qué analizan la lente relacional y la de marca personal? Marca 2.', o: [['Relacional: cómo afecta la confianza entre Kevin y Mariana.', 1], ['Marca personal: la imagen profesional que la empresa ve de ella.', 1], ['Relacional: cuántos seguidores ganará la cuenta de Kevin.', 0], ['Marca personal: solo la de Kevin, porque él es quien publica.', 0], ['Ambas: si la foto cumple la ley de protección de datos.', 0]], why: 'La lente relacional mira el vínculo entre las personas; la de marca personal, la imagen profesional que se construye.' },
      { id: 'c09q4', q: '¿Qué decisiones serían coherentes con la clase? Marca 2.', o: [['Preguntarle a Mariana antes de publicar la foto.', 1], ['No publicarla, o elegir otra con la que ella esté de acuerdo.', 1], ['Publicarla y borrarla después si alguien se queja.', 0], ['Publicarla, porque el humor siempre suma en la marca personal.', 0], ['Publicarla y etiquetar a la empresa.', 0]], why: 'Empatía y responsabilidad: preguntar antes y considerar las consecuencias. Borrar después no recoge lo que ya circuló.' },
      { id: 'c09q5', q: '¿Qué conceptos explican el riesgo para Mariana? Marca 2.', o: [['Colapso de contexto: la empresa y los amigos ven lo mismo.', 1], ['Integridad contextual: la foto se tomó en un contexto y circula en otro.', 1], ['Egocentrismo: Mariana no sabe escribir mensajes claros.', 0], ['Desinhibición: la empresa se volverá agresiva con ella.', 0], ['Cancelación: la empresa ya decidió no contratarla.', 0]], why: 'La foto mezcla audiencias (colapso de contexto) y sale del contexto en el que se tomó (integridad contextual).' }
    ] },
  { id: 'c10', title: 'La página «Profes sin filtro»', text: 'Un grupo de estudiantes crea la página anónima «Profes sin filtro». Publican fotos de docentes tomadas en clase sin permiso, capturas de correos con su número de celular y comentarios como «este es un ladrón». Dicen que no hacen nada malo porque tienen libertad de expresión y la página es de humor. Un docente afectado pide que la retiren.',
    qs: [
      { id: 'c10q1', q: '¿Qué derechos protegidos por la Constitución están en juego? Marca 3.', o: [['La intimidad y el habeas data (art. 15).', 1], ['La libertad de expresión (art. 20).', 1], ['La honra (art. 21).', 1], ['El derecho a la popularidad en las redes.', 0], ['El derecho al anonimato absoluto en internet.', 0]], why: 'La nota legal de la clase: la Constitución protege la intimidad y el habeas data (art. 15), la libertad de expresión (art. 20) y la honra (art. 21).' },
      { id: 'c10q2', q: '¿Qué publicaciones de la página tocan datos personales? Marca 2.', o: [['Las fotos de los docentes tomadas sin permiso.', 1], ['Las capturas con su número de celular.', 1], ['Una opinión argumentada sobre la metodología de una clase.', 0], ['El nombre de la página.', 0], ['Los comentarios positivos sobre un docente.', 0]], why: 'La imagen y el número de celular de una persona son datos personales, regulados por la Ley 1581 de 2012.' },
      { id: 'c10q3', q: 'Sobre el comentario «este es un ladrón», ¿qué es correcto? Marca 2.', o: [['Es un ataque a la persona, no una crítica a una conducta.', 1], ['Puede afectar la honra y acercarse a la injuria o la calumnia.', 1], ['Está protegido siempre, porque la página es de humor.', 0], ['Es una crítica legítima porque se refiere a un docente.', 0], ['No tiene consecuencias, porque la página es anónima.', 0]], why: 'Acusar sin pruebas ataca a la persona y puede afectar su honra; la injuria y la calumnia son delitos (Código Penal, arts. 220 y 221).' },
      { id: 'c10q4', q: '¿Qué normas mencionó la clase para situaciones como esta? Marca 3.', o: [['La Ley 1581 de 2012, sobre datos personales.', 1], ['La Ley 1273 de 2009, que tipifica la violación de datos personales.', 1], ['La Sentencia SU-420 de 2019, sobre retirar publicaciones que afectan la honra.', 1], ['Una ley que prohíbe cualquier crítica a los docentes.', 0], ['Una norma que permite publicar datos si la cuenta es anónima.', 0]], why: 'Son las normas de la nota legal: Ley 1581 de 2012, Ley 1273 de 2009 (art. 269F) y la SU-420 de 2019 de la Corte Constitucional.' },
      { id: 'c10q5', q: '¿Qué ideas de la clase resumen mejor el caso? Marca 2.', o: [['Lo legal, lo ético y lo responsable no siempre coinciden.', 1], ['Poder publicar algo no significa deber hacerlo de cualquier manera.', 1], ['Si la intención es el humor, no hay consecuencias humanas.', 0], ['La libertad de expresión permite publicar sin ningún límite.', 0], ['Solo lo ilegal tiene consecuencias para la reputación.', 0]], why: 'Idea central de la clase: la interacción digital tiene consecuencias humanas, y lo legal, lo ético y lo responsable no siempre coinciden.' }
    ] }
];

function rnd(n) {
  try { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); }
}
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fp(s) { var a = 0x811c9dc5, b = 0x9e3779b1; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); a ^= c; a = Math.imul(a, 16777619) >>> 0; b = Math.imul(b ^ c, 0x5bd1e995) >>> 0; b = (b ^ (b >>> 15)) >>> 0; } return a.toString(16) + '-' + b.toString(16); }
function fmtPts(p) { return (Math.round(p * 10) / 10).toFixed(1).replace('.', ','); }

}

/* ---------- Juego ---------- */
function cur() { var g = S.current; return g ? g.qs[g.idx] : null; }
function qOf(a) { return a.type === 'tf' ? TFMAP[a.id] : a.type === 'mc' ? MCMAP[a.id].q : ORDMAP[a.id]; }
function needOf(q) { return q.o.filter(function (o) { return o[1]; }).length; }

function renderGame() {
  var g = S.current, a = cur(), q = qOf(a);
  var life = g.life;
  var swapAvail = swapPool(a).length > 0;
  var fiftyOk = a.type === 'mc' && !life.fifty;
  var lifeBtn = function (key, inner, label, enabled, title) {
    var used = life[key];
    return '<button class="life' + (used ? ' used' : '') + '" data-act="life" data-k="' + key + '"' + (!used && enabled ? '' : ' disabled') + ' title="' + esc(title) + '"><span class="orb">' + inner + '</span><span class="lab">' + label + '</span></button>';
  };
  var lifelines = '<div class="lifelines" role="group" aria-label="Comodines">' +
    lifeBtn('audience', ICON.people, 'Público', true, 'Pregunta al público: +' + AUDIENCE_BONUS + ' segundos para que tus compañeros te ayuden') +
    lifeBtn('fifty', '<span class="ff">50:50</span>', '50:50', fiftyOk, a.type === 'mc' ? 'Elimina la mitad de las opciones incorrectas; la pregunta vale 0,5' : 'Solo disponible en preguntas de caso') +
    lifeBtn('swap', ICON.swap, 'Cambiar', swapAvail, swapAvail ? 'Cambia por otra pregunta del mismo tipo' : 'No quedan preguntas disponibles de este tipo') +
    '</div>';
  var total = a.total;
  var timer = '<div class="timer" id="timer" role="timer" aria-label="Tiempo restante"><svg viewBox="0 0 92 92"><circle class="track" cx="46" cy="46" r="40"/><circle class="bar" id="ring" cx="46" cy="46" r="40" stroke-dasharray="251.33" stroke-dashoffset="0"/></svg><span class="num" id="secs">' + total + '</span></div>';
  var head = '<div class="topbar"><div class="player"><small>Jugador</small><b>' + esc(g.name) + '</b></div>' + lifelines + timer + '</div>';

  var caseBox = '';
  if (a.type === 'mc') { var c = MCMAP[a.id].c; caseBox = '<section class="casebox" aria-label="Caso"><span class="k">Caso</span><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p></section>'; }

  var qText = a.type === 'ord' ? q.sit : q.q;
  var tag = 'Pregunta ' + (g.idx + 1) + ' de 5 · ' + TYPE_LABEL[a.type] + (a.type === 'mc' ? ' · selecciona ' + needOf(q) : '') + (a.type === 'ord' ? ' · del primero al último' : '');
  var qbar = '<div class="hexrow qbar"><div class="hex"><div class="hex-in"><span class="tag">' + tag + '</span><p class="q">' + esc(qText) + '</p></div></div></div>';

  var notes = [];
  if (a.audience) notes.push('<div class="audience" role="status">' + ICON.people + '<p><b>El público tiene la palabra.</b> Tus compañeros pueden ayudarte: sumaste ' + AUDIENCE_BONUS + ' segundos.</p></div>');
  var pills = [];
  if (a.fifty) pills.push('<span class="pill gold">50:50 usado · esta pregunta vale 0,5</span>');
  if (a.swapped) pills.push('<span class="pill cyan">Pregunta cambiada</span>');
  if (a.type === 'mc') pills.push('<span class="pill">Debes marcar ' + needOf(q) + ' respuestas</span>');
  if (a.type === 'ord') pills.push('<span class="pill">Arrastra las tarjetas o usa las flechas</span>');
  var noteHtml = notes.join('') + (pills.length ? '<div class="notice">' + pills.join('') + '</div>' : '');

  var body = '';
  if (a.type === 'tf') {
    body = '<div class="opts two" role="group" aria-label="Respuestas">' + [['true', 'Verdadero', 'A'], ['false', 'Falso', 'B']].map(function (o) {
