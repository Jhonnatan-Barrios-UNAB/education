<!doctype html><html><head>
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>¿Quién quiere mejorar su nota?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Línea gráfica Interacción Digital: navy, azul eléctrico, violeta y cian.
   Layout: escenario de concurso — columna principal (comodines, cronómetro, pregunta en barra hexagonal, opciones) y escalera de 5 niveles a la derecha */
:root {
  color-scheme: dark;
  --bg-0: #0b1636;
  --bg-1: #172b5b;
  --panel: #1b3068;
  --panel-2: #22397a;
  --indigo: #2456a6;
  --violet: #4330bc;
  --deep: #172b5b;
  --petrol: #155e75;
  --cyan: #00a9d6;
  --cyan-soft: #5fd3f0;
  --lilac: #9a8cff;
  --fg: #f5f7ff;
  --fg-soft: #c7d0ee;
  --fg-muted: #8f9bcb;
  --line: rgba(95, 211, 240, 0.5);
  --hair: rgba(199, 208, 238, 0.16);
  --ok: #5ee0a0;
  --half: #ffcf70;
  --bad: #ff8f8f;
  --ink-on-cyan: #06112f;
  --font-display: 'Manrope', 'Segoe UI', Arial, sans-serif;
  --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg-0);
  background-image:
    radial-gradient(1100px 620px at 50% -12%, rgba(67, 48, 188, 0.55), transparent 62%),
    radial-gradient(900px 500px at 50% 115%, rgba(0, 169, 214, 0.16), transparent 60%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 40px); padding-block: 22px 48px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--cyan-soft); outline-offset: 3px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan-soft); margin: 0 0 18px; }
.brand::before { content: ""; width: 40px; height: 3px; border-radius: 2px; background: var(--cyan); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Botones ---------- */
.btn { border-radius: 12px; padding: 12px 20px; border: 1px solid var(--hair); background: rgba(255,255,255,0.06); cursor: pointer; font-weight: 600; font-size: 15px; }
.btn:hover { background: rgba(255,255,255,0.12); }
.btn.primary { background: linear-gradient(180deg, var(--cyan-soft), var(--cyan)); color: var(--ink-on-cyan); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.warn { color: var(--half); border-color: rgba(255, 207, 112, 0.5); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; filter: none; }
.btn.lg { padding: 16px 28px; font-size: 17px; border-radius: 14px; }

/* ---------- Hexágonos estilo concurso ---------- */
.hexrow { position: relative; display: block; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
.hexrow::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); opacity: 0.55; }
.hex { display: block; position: relative; margin-inline: clamp(8px, 2.6vw, 30px); padding: 2px; background: linear-gradient(90deg, var(--cyan-soft), var(--lilac) 50%, var(--cyan-soft));
  clip-path: polygon(22px 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 22px 100%, 0 50%); }
.hex-in { clip-path: polygon(21px 0, calc(100% - 21px) 0, 100% 50%, calc(100% - 21px) 100%, 21px 100%, 0 50%);
  background: linear-gradient(180deg, #23407e 0%, #122453 100%); padding: 14px 40px; display: flex; align-items: center; gap: 14px; min-height: 58px; }
.opt { cursor: pointer; }
.opt .letter { font-family: var(--font-display); font-weight: 800; color: var(--cyan-soft); min-width: 1.6em; }
.opt .txt { font-size: 16.5px; line-height: 1.35; }
.opt:hover .hex-in { background: linear-gradient(180deg, #2c4fa0 0%, #1a3270 100%); }
.opt[aria-pressed="true"] .hex { background: linear-gradient(90deg, #fff, var(--cyan-soft), #fff); }
.opt[aria-pressed="true"] .hex-in { background: linear-gradient(180deg, var(--cyan-soft) 0%, var(--cyan) 100%); color: var(--ink-on-cyan); }
.opt[aria-pressed="true"] .letter { color: var(--ink-on-cyan); }
.opt.gone { cursor: default; opacity: 0.22; }
.opt.gone .txt { visibility: hidden; }
.opt:focus-visible { outline: none; }
.opt:focus-visible .hex { background: linear-gradient(90deg, #fff, #fff); }

.qbar .hex-in { padding: 20px 46px; min-height: 96px; flex-direction: column; align-items: flex-start; gap: 6px; }
.qbar .tag { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--cyan-soft); }
.qbar .q { font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 2vw, 23px); line-height: 1.3; text-wrap: balance; margin: 0; }

/* ---------- Inicio ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(20px, 3vw, 40px); align-items: start; }
@media (max-width: 920px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.title { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 5vw, 62px); line-height: 1.02; letter-spacing: -0.02em; margin: 6px 0 12px; text-wrap: balance; }
.title em { font-style: normal; background: linear-gradient(90deg, var(--cyan-soft), var(--lilac)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { color: var(--fg-soft); font-size: 17px; max-width: 58ch; margin: 0 0 22px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.rule { background: rgba(27, 48, 104, 0.72); border: 1px solid var(--hair); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.rule h3 { margin: 0; font-family: var(--font-display); font-size: 17px; }
.rule p { margin: 0; color: var(--fg-soft); font-size: 14.5px; }
.rule .k { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan-soft); font-weight: 700; }
.timechips { display: flex; flex-direction: column; gap: 6px; }
.timechips span { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; color: var(--fg-soft); border-bottom: 1px dashed var(--hair); padding-bottom: 4px; }
.timechips b { color: var(--fg); font-variant-numeric: tabular-nums; }
.lifelist { display: flex; flex-direction: column; gap: 10px; }
.lifelist div { display: flex; gap: 12px; align-items: flex-start; }
.lifelist .mini { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--cyan-soft); display: grid; place-items: center; font: 800 11px var(--font-display); color: var(--cyan-soft); }
.lifelist .mini svg { width: 18px; height: 18px; }
.lifelist p { margin: 0; font-size: 14px; color: var(--fg-soft); }
.lifelist b { color: var(--fg); }

.card { background: rgba(27, 48, 104, 0.82); border: 1px solid var(--hair); border-radius: 20px; padding: clamp(18px, 2.4vw, 28px); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 50px rgba(3, 7, 30, 0.45); }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 22px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--fg-soft); font-weight: 500; }
input[type="text"], input[type="password"], select { font: 500 16px var(--font-body); color: var(--fg); background: rgba(255,255,255,0.07); border: 1px solid var(--hair); border-radius: 12px; padding: 13px 14px; width: 100%; }
select option { background: #1b3068; color: var(--fg); }
input::placeholder { color: var(--fg-muted); }
.err { color: var(--bad); font-size: 14px; margin: 0; }
.note { font-size: 13.5px; color: var(--fg-muted); margin: 0; }
.cap { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(0, 169, 214, 0.1); border: 1px solid rgba(95, 211, 240, 0.3); font-size: 14.5px; }
.cap b { font-variant-numeric: tabular-nums; }
.cap.empty { background: rgba(255, 207, 112, 0.1); border-color: rgba(255, 207, 112, 0.4); color: var(--half); }
.resume { border: 1px solid rgba(255, 207, 112, 0.45); background: rgba(255, 207, 112, 0.08); border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.resume p { margin: 0; }
.foot { display: flex; justify-content: flex-end; margin-top: 24px; }
.emblem { width: 100%; max-width: 120px; height: auto; margin-bottom: 4px; }

/* ---------- Juego ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; align-items: start; }
@media (max-width: 1000px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.player { display: flex; flex-direction: column; }
.player small { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); font-weight: 600; }
.player b { font-family: var(--font-display); font-size: 20px; }
.lifelines { display: flex; gap: 14px; }
.life { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; cursor: pointer; padding: 0; }
.life .orb { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--cyan-soft); background: radial-gradient(circle at 50% 35%, #2456a6, #122453); color: var(--fg); position: relative; box-shadow: 0 0 18px rgba(95, 211, 240, 0.25); }
.life .orb svg { width: 28px; height: 28px; }
.life .orb .ff { font: 800 16px var(--font-display); letter-spacing: -0.02em; }
.life .lab { font-size: 12px; color: var(--fg-soft); font-weight: 600; }
.life:hover:not([disabled]) .orb { box-shadow: 0 0 26px rgba(95, 211, 240, 0.55); }
.life[disabled] { cursor: not-allowed; }
.life[disabled] .orb { opacity: 0.35; box-shadow: none; }
.life.used .orb::after { content: ""; position: absolute; width: 74px; height: 3px; background: var(--bad); transform: rotate(-40deg); border-radius: 2px; }
.life.used .lab::after { content: " · usado"; color: var(--bad); }

.timer { position: relative; width: 92px; height: 92px; flex: none; }
.timer svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.timer .track { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
.timer .bar { fill: none; stroke: var(--cyan-soft); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear, stroke 0.3s; }
.timer.low .bar { stroke: var(--half); }
.timer .num { position: absolute; inset: 0; display: grid; place-items: center; font: 800 28px var(--font-display); font-variant-numeric: tabular-nums; }
.timer.low .num { color: var(--half); }

.casebox { border: 1px solid rgba(154, 140, 255, 0.4); background: linear-gradient(180deg, rgba(67, 48, 188, 0.28), rgba(23, 43, 91, 0.6)); border-radius: 16px; padding: 16px 20px; }
.casebox .k { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lilac); font-weight: 700; }
.casebox h3 { margin: 2px 0 6px; font-family: var(--font-display); font-size: 19px; }
.casebox p { margin: 0; color: var(--fg-soft); font-size: 15.5px; max-width: 95ch; }
.notice { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--hair); background: rgba(255,255,255,0.05); }
.pill.cyan { border-color: rgba(95, 211, 240, 0.5); color: var(--cyan-soft); }
.pill.gold { border-color: rgba(255, 207, 112, 0.5); color: var(--half); }
.audience { display: flex; gap: 14px; align-items: center; border-radius: 14px; padding: 12px 16px; background: rgba(0, 169, 214, 0.12); border: 1px solid rgba(95, 211, 240, 0.4); }
.audience svg { width: 30px; height: 30px; flex: none; color: var(--cyan-soft); }
.audience p { margin: 0; }
.opts { display: grid; gap: 12px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 640px) { .opts.two { grid-template-columns: minmax(0, 1fr); } }
.opts.two .hex-in { justify-content: center; min-height: 72px; }
.opts.two .txt { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 4px; }
.flash { font-size: 14px; color: var(--half); min-height: 1.4em; margin: 0; }

/* Ordenar */
.order { display: flex; flex-direction: column; gap: 10px; }
.oitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.oitem .slot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--cyan-soft); font: 800 17px var(--font-display); color: var(--cyan-soft); }
.oitem .hexrow { cursor: grab; }
.oitem .hexrow:active { cursor: grabbing; }
.oitem .hex-in { padding: 12px 38px; min-height: 54px; }
.oitem .grip { color: var(--fg-muted); flex: none; }
.oitem.drag .hex { opacity: 0.4; }
.oitem.over .hex { background: linear-gradient(90deg, #fff, var(--cyan-soft), #fff); }
.arrows { display: flex; flex-direction: column; gap: 4px; }
.arrows button { width: 38px; height: 26px; border-radius: 8px; border: 1px solid var(--hair); background: rgba(255,255,255,0.06); cursor: pointer; display: grid; place-items: center; padding: 0; }
.arrows button:hover:not([disabled]) { background: rgba(255,255,255,0.14); }
.arrows button[disabled] { opacity: 0.25; cursor: default; }
.arrows svg { width: 14px; height: 14px; }

/* Escalera */
.ladder { background: rgba(14, 27, 70, 0.85); border: 1px solid var(--hair); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.ladder h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-muted); font-weight: 700; }
.rung { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; font-size: 14px; color: var(--fg-soft); }
.rung .n { font: 800 14px var(--font-display); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.rung .pt { font-size: 12.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.rung.now { background: linear-gradient(90deg, var(--cyan-soft), var(--cyan)); color: var(--ink-on-cyan); font-weight: 700; }
.rung.now .n, .rung.now .pt { color: var(--ink-on-cyan); }
.rung.done { color: var(--fg); }
.rung.done .n::after { content: "✓"; color: var(--cyan-soft); margin-left: 2px; font-size: 11px; }
.ladder .tot { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--fg-muted); }
@media (max-width: 1000px) {
  .ladder { position: static; order: -1; flex-direction: row; flex-wrap: wrap; padding: 10px; }
  .ladder h3, .ladder .tot { display: none; }
  .rung { grid-template-columns: auto auto; padding: 6px 10px; }
  .rung .pt { display: none; }
}

/* Transición */
.veil { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6, 10, 36, 0.72); backdrop-filter: blur(4px); z-index: 20; padding: 16px; }
.veil .box { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.veil .big { font: 800 clamp(30px, 5vw, 52px)/1.1 var(--font-display); }
.veil .sub { color: var(--fg-soft); font-size: 17px; }
.veil .big.time { color: var(--half); }

/* ---------- Resumen ---------- */
.sumhead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 24px; }
@media (max-width: 640px) { .sumhead { grid-template-columns: minmax(0, 1fr); } }
.grade { width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 30%, #2456a6, #122453 70%); border: 3px solid var(--cyan-soft); box-shadow: 0 0 40px rgba(95, 211, 240, 0.35); }
.grade b { display: block; font: 800 64px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.grade span { font-size: 14px; color: var(--fg-soft); }
.sumhead h2 { font-family: var(--font-display); font-size: clamp(26px, 3.4vw, 40px); margin: 4px 0 8px; line-height: 1.1; }
.sumhead p { margin: 0; color: var(--fg-soft); max-width: 62ch; }
.reviews { display: flex; flex-direction: column; gap: 14px; }
.rev { background: rgba(27, 48, 104, 0.78); border: 1px solid var(--hair); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.rev header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.rev .k { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan-soft); font-weight: 700; }
.rev h3 { margin: 0; font-family: var(--font-display); font-size: 17.5px; line-height: 1.35; }
.rev .ctx { margin: 0; font-size: 14px; color: var(--fg-muted); }
.score { font: 800 14px var(--font-display); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.score.s1 { background: rgba(94, 224, 160, 0.16); color: var(--ok); border: 1px solid rgba(94, 224, 160, 0.45); }
.score.s05 { background: rgba(255, 207, 112, 0.14); color: var(--half); border: 1px solid rgba(255, 207, 112, 0.45); }
.score.s0 { background: rgba(255, 143, 143, 0.12); color: var(--bad); border: 1px solid rgba(255, 143, 143, 0.4); }
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .cmp { grid-template-columns: minmax(0, 1fr); } }
.cmp div { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px 14px; }
.cmp small { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); font-weight: 700; margin-bottom: 4px; }
.cmp ul, .cmp ol { margin: 0; padding-left: 20px; }
.cmp li { margin: 2px 0; }
.cmp p { margin: 0; }
.why { margin: 0; padding: 12px 14px; border-radius: 12px; background: rgba(0, 169, 214, 0.09); border-left: 3px solid var(--cyan); color: var(--fg); }
.why b { color: var(--cyan-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Panel docente ---------- */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(6, 10, 36, 0.78); backdrop-filter: blur(4px); display: grid; place-items: start center; overflow-y: auto; padding: 40px 16px; }
.modal .card { width: min(820px, 100%); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 14px; }
.stat small { display: block; font-size: 12px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.stat b { font: 800 24px var(--font-display); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; border: 1px solid var(--hair); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-muted); background: rgba(255,255,255,0.03); }
td.num { font-variant-numeric: tabular-nums; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14.5px; color: var(--fg-soft); }
.check input { width: 18px; height: 18px; accent-color: var(--cyan); }
.danger { border: 1px solid rgba(255, 207, 112, 0.35); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.danger h3 { margin: 0; font-size: 16px; font-family: var(--font-display); }


/* ---------- Revisión de preguntas (panel docente) ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--hair); padding-bottom: 10px; }
.tab { font: 700 14px var(--font-body); color: var(--fg-soft); background: transparent; border: 1px solid var(--hair); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--cyan); color: var(--ink-on-cyan); border-color: var(--cyan); }
.tab:focus-visible { outline: 2px solid var(--cyan-soft); outline-offset: 2px; }
.rvtools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rvtools input[type=search] { flex: 1 1 220px; min-width: 0; font: 15px var(--font-body); color: var(--fg); background: rgba(255,255,255,0.06); border: 1px solid var(--hair); border-radius: 10px; padding: 9px 12px; }
.rvtools input[type=search]:focus { outline: 2px solid var(--cyan); outline-offset: 1px; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress .track { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
.progress .fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--lilac)); border-radius: 99px; }
.audit { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.audit li { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--fg-soft); border-left: 3px solid var(--ok); }
.audit li.warn { border-left-color: var(--half); }
.audit li b { display: block; color: var(--fg); font-size: 13px; margin-bottom: 2px; }
.rvlist { display: flex; flex-direction: column; gap: 12px; }
.qcase { border: 1px solid var(--hair); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: rgba(36, 86, 166, 0.12); }
.qcase h4 { margin: 0; font: 800 16px var(--font-display); }
.qcase > p { margin: 0; font-size: 14.5px; color: var(--fg-soft); line-height: 1.5; }
.qrev { background: rgba(27, 48, 104, 0.78); border: 1px solid var(--hair); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.qrev.done { border-color: rgba(94, 224, 160, 0.45); }
.qrev header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.qrev .k { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan-soft); font-weight: 700; }
.qrev h5 { margin: 0; font: 700 16px/1.4 var(--font-display); }
.qrev .used { font-size: 12px; color: var(--fg-muted); }
.ans { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.ans li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.04); font-size: 14.5px; color: var(--fg-soft); }
.ans li .l { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 800 12px var(--font-display); border: 1px solid var(--hair); }
.ans li.ok { background: rgba(94, 224, 160, 0.12); color: var(--fg); }
.ans li.ok .l { background: var(--ok); color: #06231a; border-color: var(--ok); }
.ans li .tag { margin-left: auto; flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--ok); }
.ans li span.t { min-width: 0; }
ol.ans { counter-reset: st; }
.tfans { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; color: var(--ok); }
.rvempty { color: var(--fg-muted); margin: 0; }

@media (prefers-reduced-motion: reduce) { .timer .bar { transition: none; } .veil { backdrop-filter: none; } }

<script>
(function () {
'use strict';

/* =================== CONFIGURACIÓN =================== */
var TIME = { tf: 30, mc: 90, ord: 90 };   // segundos por tipo de pregunta
var AUDIENCE_BONUS = 30;                    // segundos extra del comodín "Pregunta al público"
var KEY_FP = 'fd0d6456-d74ecf53';           // huella de la clave de reinicio
var STORE = 'quiz-recuperacion-seguridad-derechos-v1';

/* =================== BANCO 1: VERDADERO O FALSO (20) =================== */
var TF = [
  { id: 'tf01', q: 'La seguridad digital comprende las prácticas, herramientas y medidas que protegen dispositivos, cuentas, información y actividades en entornos digitales.', a: true, why: 'Es la definición de la clase: no se limita a la contraseña, abarca dispositivos, cuentas, información y actividades.' },
  { id: 'tf02', q: 'Según la clase, la seguridad digital es una responsabilidad que recae principalmente en los expertos en informática.', a: false, why: 'La clase insiste en lo contrario: depende tanto de la tecnología como de los hábitos y decisiones de cada persona.' },
  { id: 'tf03', q: 'El principio de integridad busca que la información no sea modificada de manera no autorizada.', a: true, why: 'Integridad: nadie altera tu información sin permiso. En el ejemplo, nadie modifica tu trabajo final.' },
  { id: 'tf04', q: 'Que los sistemas y la información estén accesibles cuando se necesitan corresponde al principio de confidencialidad.', a: false, why: 'Eso es disponibilidad. La confidencialidad es que solo las personas autorizadas accedan a la información.' },
  { id: 'tf05', q: 'Una cuenta con contraseña larga y verificación en dos pasos puede, aun así, estar exponiendo demasiada información personal.', a: true, why: 'La seguridad protege el acceso; la privacidad decide qué compartimos, con quién y para qué. Son cosas relacionadas pero distintas.' },
  { id: 'tf06', q: 'La universidad, el programa y los horarios de una persona no se consideran datos personales porque no incluyen su número de documento.', a: false, why: 'La tabla de la clase los incluye como datos académicos: también permiten identificar o hacer identificable a una persona.' },
  { id: 'tf07', q: 'Datos que parecen inofensivos por separado pueden, al combinarse, revelar patrones de comportamiento de una persona.', a: true, why: 'Universidad, horarios, lugar de entrenamiento y viajes juntos muestran dónde estás y cuándo no estás.' },
  { id: 'tf08', q: 'Pedir dos contraseñas distintas, una después de la otra, cumple con la autenticación multifactor.', a: false, why: 'Son dos factores del mismo tipo, «algo que sabes». La MFA combina factores de tipos diferentes.' },
  { id: 'tf09', q: 'La huella dactilar y el reconocimiento facial corresponden al factor de autenticación «algo que eres».', a: true, why: 'Los tres factores son algo que sabes (contraseña o PIN), algo que tienes (teléfono, llave) y algo que eres (biometría).' },
  { id: 'tf10', q: 'En el phishing, el atacante necesita vulnerar técnicamente un sistema para conseguir las credenciales de la víctima.', a: false, why: 'El phishing manipula a la persona: a veces el atacante consigue que la propia víctima le entregue la contraseña o el código.' },
  { id: 'tf11', q: 'Un mensaje que exige actuar en pocos minutos para evitar el bloqueo de una cuenta muestra una señal de alerta de phishing.', a: true, why: 'La urgencia es la primera de las siete señales de alerta vistas en clase.' },
  { id: 'tf12', q: 'Las cookies son programas maliciosos que los sitios web instalan para espiar la actividad del usuario.', a: false, why: 'Son pequeños datos que el sitio guarda en el navegador. No todas son maliciosas: algunas permiten funciones esenciales.' },
  { id: 'tf13', q: 'Los permisos de una aplicación deben revisarse según la funcionalidad que realmente ofrece la aplicación.', a: true, why: 'Por eso una linterna no debería pedir contactos ni ubicación. Los permisos se pueden cambiar en la configuración.' },
  { id: 'tf14', q: 'Copyright es una licencia universal que permite usar libremente una obra siempre que se mencione a su autor.', a: false, why: 'Copyright es el término anglosajón para los derechos de autor. No es una licencia ni un permiso libre.' },
  { id: 'tf15', q: 'La propiedad industrial protege creaciones con aplicación industrial y comercial, como patentes, diseños industriales y marcas.', a: true, why: 'Es la segunda rama de la propiedad intelectual; la primera son los derechos de autor.' },
  { id: 'tf16', q: 'Una fotografía publicada en internet sin el símbolo © puede usarse libremente porque no está protegida.', a: false, why: 'El símbolo no es necesario para que una obra esté protegida, y estar publicada en internet no le quita la protección.' },
  { id: 'tf17', q: 'En las licencias Creative Commons, la condición ND impide compartir adaptaciones de la obra.', a: true, why: 'ND significa sin obras derivadas: la obra se puede compartir, pero no versiones modificadas.' },
  { id: 'tf18', q: 'Una imagen con licencia CC BY-NC puede incorporarse a una campaña comercial si se atribuye correctamente a su autor.', a: false, why: 'NC prohíbe el uso comercial bajo esa licencia; la atribución no cambia esa condición.' },
  { id: 'tf19', q: 'CC0 es una herramienta con la que el titular dedica la obra al dominio público en la medida que lo permite la ley.', a: true, why: 'Con CC0 el titular renuncia a sus derechos hasta donde la ley lo permite: se puede compartir, adaptar y usar comercialmente.' },
  { id: 'tf20', q: 'Si se cita correctamente al autor de una obra, cualquier uso que se haga de ella queda autorizado.', a: false, why: 'Dar crédito no reemplaza la autorización: se puede atribuir bien y aun así usar la obra de una forma que la licencia no permite.' }
];

/* =================== BANCO 2: CASOS (10 x 5) =================== */
var CASES = [
  { id: 'c01', title: 'La nube de Valentina', text: 'Valentina, estudiante de Comunicación, guarda su trabajo de grado en una cuenta de almacenamiento en la nube y comparte el enlace con su asesor. Un compañero que también tenía el enlace editó por error la sección de resultados. Días después, el día de la entrega, el servicio falla y ella no logra abrir el documento. Revisando, descubre que el enlace estaba abierto para cualquier persona que lo tuviera.',
    qs: [
      { id: 'c01q1', q: '¿Qué afirmaciones describen bien lo que pasó con la sección de resultados? Marca 2.', o: [['Se afectó la integridad: la información se modificó sin autorización.', 1], ['El problema vino de un permiso de edición que no debía estar abierto.', 1], ['Se afectó la disponibilidad, porque el texto cambió de contenido.', 0], ['No es un problema de seguridad, porque el compañero no quiso hacer daño.', 0], ['Se afectó la confidencialidad, porque el texto quedó con errores.', 0]], why: 'Integridad es que la información no se modifique sin autorización, haya o no mala intención. Aquí el origen fue un permiso de edición mal configurado.' },
      { id: 'c01q2', q: '¿Qué es correcto sobre lo que ocurrió el día de la entrega? Marca 2.', o: [['Se afectó la disponibilidad: no pudo abrir el documento cuando lo necesitaba.', 1], ['Muestra que la seguridad también incluye que la información esté accesible.', 1], ['Se afectó la integridad, porque el servicio estaba caído justo el día de la entrega.', 0], ['Se afectó la confidencialidad, porque nadie más podía abrirlo.', 0], ['No tiene relación con la seguridad, solo con la plataforma.', 0]], why: 'Disponibilidad: que sistemas e información estén accesibles cuando se necesitan. La seguridad no es solo la contraseña.' },
      { id: 'c01q3', q: '¿Qué implica que el enlace estuviera abierto para cualquiera? Marca 2.', o: [['Pone en riesgo la confidencialidad del trabajo de grado.', 1], ['Permite que personas no autorizadas accedan al documento.', 1], ['Solo afecta la disponibilidad del archivo en la nube.', 0], ['No importa mientras ella no publique el enlace en sus redes.', 0], ['Mejora la integridad, porque más personas pueden revisarlo.', 0]], why: 'Confidencialidad es que solo las personas autorizadas accedan. Un enlace abierto deja ese control en manos de quien lo reciba.' },
      { id: 'c01q4', q: '¿Qué acciones mejorarían la seguridad del trabajo de Valentina? Marca 3.', o: [['Limitar el acceso al documento a las personas autorizadas.', 1], ['Dar permiso de edición solo a quien realmente debe editar.', 1], ['Activar un segundo factor de autenticación en la cuenta.', 1], ['Compartir su contraseña con el asesor para que revise más rápido.', 0], ['Dejar el enlace abierto para no depender de permisos.', 0]], why: 'Controlar quién accede y quién edita protege confidencialidad e integridad; el segundo factor protege la cuenta. La contraseña no se comparte.' },
      { id: 'c01q5', q: '¿Qué conclusiones sobre los tres principios son correctas? Marca 2.', o: [['Un mismo incidente puede afectar más de un principio a la vez.', 1], ['Incluyen confidencialidad, integridad y disponibilidad, no solo la clave.', 1], ['Los tres principios aplican a empresas, pero no a estudiantes.', 0], ['Con una contraseña fuerte y larga, los tres principios quedan garantizados por completo.', 0], ['La disponibilidad depende solo del comportamiento del usuario.', 0]], why: 'La clase mostró que los tres se conectan: perder una cuenta afecta la disponibilidad y, si otro la toma, también la confidencialidad y la integridad.' }
    ] },
  { id: 'c02', title: 'El perfil de Andrés', text: 'Andrés, estudiante de Ingeniería, protege su cuenta con una contraseña larga y verificación en dos pasos. En su perfil público aparecen su universidad y su programa, fotos en el gimnasio donde entrena los martes y jueves a las 6 p. m., su correo personal y una historia que anuncia que viaja este fin de semana. Cuando un amigo le advierte, responde: «Mi cuenta es segura, así que mi información está protegida».',
    qs: [
      { id: 'c02q1', q: '¿Qué problema tiene la respuesta de Andrés? Marca 2.', o: [['Confunde seguridad con privacidad: proteger el acceso no controla lo que expone.', 1], ['Una cuenta muy segura puede estar exponiendo demasiada información.', 1], ['Ninguno: la verificación en dos pasos protege también lo que publica.', 0], ['Que su contraseña necesita más caracteres para proteger su privacidad.', 0], ['Que la privacidad depende de la plataforma, no de lo que él publique.', 0]], why: 'La seguridad protege el acceso; la privacidad decide qué compartimos, con quién y para qué.' },
      { id: 'c02q2', q: '¿Qué información de su perfil son datos personales? Marca 3.', o: [['Su universidad y su programa académico.', 1], ['El gimnasio que frecuenta y su horario.', 1], ['Su correo electrónico personal.', 1], ['Ninguna, porque no publicó su número de documento.', 0], ['Solo el correo, porque los demás datos ya son públicos.', 0]], why: 'Según la tabla de la clase son datos académicos, de ubicación y de contacto: identifican o permiten identificar a una persona.' },
      { id: 'c02q3', q: '¿Qué podría inferir alguien combinando sus publicaciones? Marca 2.', o: [['Dónde estará y a qué hora los martes y jueves.', 1], ['En qué momento su vivienda podría quedar sola.', 1], ['Su contraseña, porque se ve en las fotos del gimnasio.', 0], ['Nada: cada dato por separado es inofensivo.', 0], ['Solo su información académica, que no implica riesgo.', 0]], why: 'Datos inofensivos por separado, juntos revelan un patrón de comportamiento: dónde estás y cuándo no estás.' },
      { id: 'c02q4', q: '¿Qué afirmaciones sobre la exposición digital de Andrés son correctas? Marca 2.', o: [['Es la cantidad y el tipo de información que deja disponible.', 1], ['Aumenta cuando publica su ubicación y sus rutinas.', 1], ['Desaparece si activa la verificación en dos pasos.', 0], ['Solo existe cuando un atacante ya entró a su cuenta.', 0], ['Es otra forma de llamar a la integridad de sus datos.', 0]], why: 'La exposición digital es la cantidad y tipo de información que dejamos disponible en plataformas y servicios, no depende de la contraseña.' },
      { id: 'c02q5', q: '¿Qué decisiones mejorarían su privacidad? Marca 3.', o: [['Revisar quién puede ver sus publicaciones.', 1], ['Evitar anunciar sus viajes mientras ocurren.', 1], ['No publicar sus rutinas con el lugar y la hora.', 1], ['Cambiar su contraseña una vez por semana.', 0], ['Publicar lo mismo, pero solo en las historias que duran un día.', 0]], why: 'La privacidad es controlar cómo se expone la información. Cambiar la contraseña protege el acceso, no lo que ya está publicado.' }
    ] },
  { id: 'c03', title: 'La clave de Mariana', text: 'Mariana usa la contraseña «Luna2005», el nombre de su perra y su año de nacimiento, para el correo institucional, su red social y una tienda en línea. Un día la tienda anuncia que sufrió una filtración de datos. Su hermano le sugiere agregar una segunda contraseña al ingresar; una amiga le recomienda activar una aplicación autenticadora en el celular. Mariana no sabe a quién hacerle caso.',
    qs: [
      { id: 'c03q1', q: '¿Qué problemas tiene la contraseña de Mariana? Marca 3.', o: [['Usa datos personales evidentes, como el nombre de su mascota.', 1], ['Es corta y fácil de adivinar para alguien que la conozca.', 1], ['La reutiliza en varios servicios diferentes.', 1], ['Mezcla letras y números, lo que la vuelve más débil.', 0], ['Empieza con mayúscula, lo que facilita adivinarla.', 0]], why: 'Las buenas prácticas piden contraseñas largas, sin datos personales evidentes y distintas para cada servicio.' },
      { id: 'c03q2', q: '¿Qué riesgo le trae la filtración de la tienda? Marca 2.', o: [['Que usen esa contraseña para intentar entrar a su correo y a su red.', 1], ['Que caigan varias cuentas, porque la clave es la misma en todas.', 1], ['Ninguno, porque la filtración solo afecta a la tienda en línea.', 0], ['Que la universidad borre su cuenta institucional de inmediato por seguridad.', 0], ['Solo que empiece a recibir más publicidad de esa tienda.', 0]], why: 'Una contraseña distinta por servicio evita que, si una se filtra, caigan todas.' },
      { id: 'c03q3', q: '¿Qué es correcto sobre la sugerencia del hermano? Marca 2.', o: [['Dos contraseñas son dos factores del mismo tipo: no es MFA.', 1], ['Ambas contraseñas pertenecen al factor «algo que sabes».', 1], ['Es MFA, porque exige dos comprobaciones al ingresar.', 0], ['Es más segura que usar una aplicación autenticadora en el celular.', 0], ['Corresponde al factor «algo que tienes».', 0]], why: 'La MFA exige factores de tipos diferentes. Dos contraseñas son el mismo tipo: algo que sabes.' },
      { id: 'c03q4', q: '¿Qué es correcto sobre la aplicación autenticadora? Marca 2.', o: [['Corresponde al factor «algo que tienes».', 1], ['Con la contraseña, combina dos tipos de factores.', 1], ['Reemplaza por completo la necesidad de una contraseña.', 0], ['Corresponde al factor «algo que eres».', 0], ['Solo funciona si usa la misma clave en todo.', 0]], why: 'La aplicación vive en el teléfono (algo que tienes) y se suma a la contraseña (algo que sabes): eso es MFA.' },
      { id: 'c03q5', q: '¿Qué prácticas debería adoptar Mariana? Marca 3.', o: [['Tener una contraseña distinta para cada servicio.', 1], ['Guardarlas en un administrador de contraseñas confiable.', 1], ['Preferir una frase larga en lugar de una palabra.', 1], ['Compartir la clave con su hermano por si algún día la olvida.', 0], ['Mantener la misma clave para no confundirse.', 0]], why: 'Son buenas prácticas de la clase: larga (mejor una frase), distinta por servicio, sin compartir y en un administrador confiable.' }
    ] },
  { id: 'c04', title: 'El mensaje de Camilo', text: 'Camilo recibe un SMS firmado por «Soporte Tecnológico»: su cuenta institucional será bloqueada en 30 minutos y debe responder con el código que acaba de llegar a su celular. Minutos después le llega un correo que anuncia que ganó una tableta y que debe abrir un archivo adjunto para reclamarla. El remitente usa una dirección parecida a la de la universidad, pero con una letra cambiada.',
    qs: [
      { id: 'c04q1', q: '¿Qué emociones busca provocar el SMS? Marca 2.', o: [['Miedo a perder el acceso a su cuenta institucional.', 1], ['Urgencia, por el plazo de solo 30 minutos.', 1], ['Tranquilidad, porque el mensaje viene del área de soporte.', 0], ['Indiferencia, para que lo lea sin prestar atención.', 0], ['Gratitud hacia la universidad.', 0]], why: 'La ingeniería social aprovecha la confianza, el miedo, la urgencia, la curiosidad o la distracción. Aquí: miedo y urgencia.' },
      { id: 'c04q2', q: '¿Qué intenta obtener el atacante con el SMS? Marca 2.', o: [['El código del segundo factor de autenticación.', 1], ['El acceso a la cuenta institucional de Camilo.', 1], ['Solo confirmar que el número de celular existe.', 0], ['Que Camilo actualice la aplicación del celular.', 0], ['Información sobre sus horarios y sus clases.', 0]], why: 'Ese código es su segundo factor: con él, el atacante entra a la cuenta. Ningún servicio legítimo pide dictarlo.' },
      { id: 'c04q3', q: '¿Qué señales de alerta aparecen en los dos mensajes? Marca 3.', o: [['Urgencia por un bloqueo que ocurrirá en minutos.', 1], ['Una dirección de remitente sospechosa.', 1], ['Un premio atractivo con un adjunto inesperado.', 1], ['Que el mensaje esté escrito en español.', 0], ['Que haya llegado en horario de oficina.', 0]], why: 'Urgencia, remitente sospechoso, premios demasiado buenos y adjuntos inesperados están entre las siete señales de la clase.' },
      { id: 'c04q4', q: '¿Cómo debería verificar si los mensajes son auténticos? Marca 2.', o: [['Entrando al portal oficial sin usar los enlaces recibidos.', 1], ['Llamando a la mesa de ayuda al número publicado por la universidad.', 1], ['Respondiendo el mismo SMS para preguntar si de verdad lo envió la universidad.', 0], ['Abriendo el adjunto para revisar si es legítimo.', 0], ['Reenviando el código a un amigo para que lo valide.', 0]], why: 'Ante la duda, se verifica por otro canal oficial, nunca respondiendo al mensaje ni abriendo lo que envía.' },
      { id: 'c04q5', q: 'Si Camilo ya compartió el código, ¿qué debe hacer? Marca 3.', o: [['Cambiar la contraseña de la cuenta.', 1], ['Avisar al área de soporte de la universidad.', 1], ['Reportar el mensaje que recibió.', 1], ['Esperar a ver si la cuenta se bloquea.', 0], ['Borrar el mensaje y no comentarlo con nadie.', 0]], why: 'Es la respuesta del caso analizado en clase: cambiar la contraseña, avisar a soporte y reportar el mensaje.' }
    ] },
  { id: 'c05', title: 'Las aplicaciones de Laura', text: 'Laura instala una aplicación de linterna que le pide acceso a sus contactos, su ubicación y su micrófono. Después entra a una tienda virtual a mirar unos audífonos y acepta todas las cookies sin leer. Al día siguiente ve anuncios de esos mismos audífonos en otras páginas y en sus redes. Un amigo le dice que todas las cookies son espías y que la única solución es bloquearlas todas.',
    qs: [
      { id: 'c05q1', q: '¿Qué es correcto sobre los permisos que pide la linterna? Marca 2.', o: [['No corresponden a la función real de la aplicación.', 1], ['Laura puede revisarlos y cambiarlos en la configuración.', 1], ['Son normales: cualquier aplicación necesita los contactos.', 0], ['Una vez concedidos, ya no se pueden modificar.', 0], ['Solo deberían preocuparle si la aplicación fuera de pago.', 0]], why: 'Los permisos se revisan según lo que la aplicación realmente necesita y se pueden cambiar desde la configuración del dispositivo.' },
      { id: 'c05q2', q: '¿Qué explica los anuncios de los audífonos? Marca 2.', o: [['Es un ejemplo de rastreo digital de su actividad.', 1], ['Se relaciona con cookies publicitarias o de seguimiento.', 1], ['Demuestra que alguien entró a su celular sin permiso mientras dormía.', 0], ['Lo causan las cookies necesarias de la tienda.', 0], ['Es una falla de integridad en la tienda virtual.', 0]], why: 'Es el ejemplo de la clase: el rastreo recopila y analiza la actividad, y las cookies de seguimiento personalizan anuncios.' },
      { id: 'c05q3', q: '¿Qué es correcto frente a lo que dice el amigo? Marca 2.', o: [['No todas las cookies son maliciosas.', 1], ['Algunas permiten funciones esenciales del sitio.', 1], ['Tiene razón: todas espían.', 0], ['Las cookies son programas que se instalan en el celular.', 0], ['Las cookies de preferencias venden sus datos.', 0]], why: 'Las cookies son pequeños datos guardados en el navegador; hay necesarias, de preferencias, analíticas y publicitarias.' },
      { id: 'c05q4', q: '¿Qué descripciones de los tipos de cookies son correctas? Marca 3.', o: [['Las de preferencias recuerdan la configuración del usuario.', 1], ['Las analíticas ayudan a entender cómo se usa un sitio.', 1], ['Las necesarias permiten funciones esenciales del sitio.', 1], ['Las necesarias sirven para mostrar anuncios personalizados.', 0], ['Las analíticas recuerdan el idioma que eligió el usuario.', 0]], why: 'Son las categorías de la clase. Los anuncios corresponden a las publicitarias y la configuración a las de preferencias.' },
      { id: 'c05q5', q: 'Según la clase, ¿qué es lo importante que Laura comprenda? Marca 2.', o: [['Qué información se recopila y para qué se utiliza.', 1], ['Qué controles tiene para decidir sobre esa recopilación.', 1], ['Que lo correcto es rechazar todo servicio gratuito.', 0], ['Que aceptar cookies no tiene ninguna consecuencia.', 0], ['Que el rastreo solo ocurre en aplicaciones de pago.', 0]], why: 'La clase no propone rechazar todo, sino entender qué se recopila, para qué se usa y qué controles tenemos.' }
    ] },
  { id: 'c06', title: 'Café Montaña', text: 'Sara coordina la campaña de lanzamiento de Café Montaña, una marca nueva. El equipo registró el nombre y el logo; un fotógrafo tomó las fotos de la campaña, y un compañero propuso la idea de un video sobre caficultores, que todavía no se ha grabado. Sara encontró en internet una foto sin el símbolo © y quiere usarla porque, según ella, «si no tiene copyright, es libre».',
    qs: [
      { id: 'c06q1', q: '¿Qué elementos protege la propiedad industrial? Marca 2.', o: [['El nombre de la marca Café Montaña.', 1], ['El logo, como signo distintivo de la marca.', 1], ['Las fotografías que tomó el fotógrafo.', 0], ['La idea del video sobre caficultores.', 0], ['La foto que Sara encontró en internet.', 0]], why: 'La propiedad industrial protege marcas y signos distintivos, patentes y diseños industriales.' },
      { id: 'c06q2', q: '¿Qué está protegido por derechos de autor? Marca 2.', o: [['Las fotografías que tomó el fotógrafo.', 1], ['El video, una vez grabado y editado.', 1], ['La idea del video, aunque no se haya grabado.', 0], ['El nombre comercial de la marca.', 0], ['El logo, registrado como marca.', 0]], why: 'Se protege la obra, no la idea en abstracto: la idea del video no está protegida; el video grabado y editado, sí.' },
      { id: 'c06q3', q: '¿Qué es correcto sobre la foto sin el símbolo ©? Marca 2.', o: [['El símbolo no es necesario para que una obra esté protegida.', 1], ['Que esté publicada en internet no le quita la protección.', 1], ['Si no tiene el símbolo, la foto pasa a ser de dominio público.', 0], ['Copyright es una licencia que permite usarla libremente.', 0], ['Basta con que aparezca en un buscador para poder usarla.', 0]], why: 'Es un error frecuente creer que sin © la obra es libre. Estar en internet no significa dejar de estar protegida.' },
      { id: 'c06q4', q: '¿Qué afirmaciones sobre el copyright son correctas? Marca 2.', o: [['Es el término anglosajón para los derechos de autor.', 1], ['No equivale a un permiso libre para usar la obra.', 1], ['Es una de las ramas de la propiedad industrial.', 0], ['Es una licencia universal que cubre todas las obras publicadas.', 0], ['Solo aplica a las obras publicadas en inglés.', 0]], why: 'Copyright es la expresión de la tradición anglosajona para los derechos de autor; no es una licencia ni un permiso libre.' },
      { id: 'c06q5', q: '¿Qué afirmaciones sobre la propiedad intelectual son correctas en este caso? Marca 2.', o: [['Es el concepto general de los derechos sobre las creaciones del intelecto.', 1], ['Abarca tanto las fotos de la campaña como la marca y su logo.', 1], ['Solo protege obras literarias y artísticas, no las marcas ni los logos comerciales.', 0], ['Es otro nombre para el copyright de la tradición anglosajona.', 0], ['Deja de aplicar cuando la obra se publica en internet.', 0]], why: 'La propiedad intelectual es el concepto general y tiene dos ramas: los derechos de autor (las fotos) y la propiedad industrial (la marca y el logo).' }
    ] },
  { id: 'c07', title: 'El video de Tomás', text: 'Tomás encontró una canción en una plataforma de música y una ilustración en un blog; puede escucharlas y descargarlas sin pagar. Quiere usar la canción en un video para la marca de ropa de su tía y modificar la ilustración para ponerla en los empaques. La ilustración tiene licencia CC BY-ND y la canción no indica ninguna licencia. Tomás piensa que, si algo se descarga gratis, se puede usar.',
    qs: [
      { id: 'c07q1', q: '¿Qué es correcto sobre lo que piensa Tomás? Marca 2.', o: [['Poder acceder o descargar no autoriza a usar comercialmente.', 1], ['Cada acción sobre una obra puede tener sus propias condiciones.', 1], ['Si se descarga gratis, se puede usar en cualquier contexto o proyecto.', 0], ['Descargar y distribuir tienen las mismas condiciones.', 0], ['Escuchar la canción le da derecho a ponerla en su video.', 0]], why: 'Acceder, descargar, compartir, reproducir, modificar, distribuir y usar comercialmente no tienen las mismas condiciones.' },
      { id: 'c07q2', q: '¿Qué exige la licencia CC BY-ND de la ilustración? Marca 2.', o: [['Atribuir la autoría de la ilustración.', 1], ['No compartir una versión modificada de la obra.', 1], ['Nada más que citar al autor para poder modificarla.', 0], ['No usarla con fines comerciales.', 0], ['Nada, porque ND no exige reconocer al autor.', 0]], why: 'BY pide atribución y ND prohíbe compartir adaptaciones. CC BY-ND sí permite uso comercial sin modificar la obra.' },
      { id: 'c07q3', q: '¿Qué es correcto sobre la canción sin licencia? Marca 2.', o: [['No puede asumir que la canción está libre para usarla.', 1], ['Necesita autorización del titular para el video de la marca.', 1], ['Puede usarla si escribe «no soy dueño de esta música».', 0], ['Puede usarla porque la plataforma no cobra por escucharla.', 0], ['Basta con nombrar al artista en la descripción del video.', 0]], why: 'Dar crédito no reemplaza la autorización. Frases como «no soy dueño de esta música» no dan ningún permiso.' },
      { id: 'c07q4', q: '¿Qué acciones sobre una obra son las que regulan las licencias? Marca 3.', o: [['Modificarla y compartir la versión modificada.', 1], ['Distribuirla a otras personas.', 1], ['Usarla con fines comerciales.', 1], ['Tener una idea parecida sin copiar la obra.', 0], ['Mirarla en el sitio donde fue publicada.', 0]], why: 'Cuanto más se aleja del simple acceso, más condiciones aparecen: modificar, distribuir y usar comercialmente es lo que regulan las licencias.' },
      { id: 'c07q5', q: '¿Con qué licencia podría modificar la ilustración y usarla en los empaques? Marca 2.', o: [['CC BY, atribuyendo al autor.', 1], ['CC BY-SA, compartiendo la adaptación con la misma licencia.', 1], ['CC BY-NC, atribuyendo al autor.', 0], ['CC BY-NC-ND, sin cambiar la obra.', 0], ['CC BY-ND, si cita bien al autor.', 0]], why: 'Para adaptar y usar comercialmente sirven CC BY y CC BY-SA. NC impide el uso comercial y ND impide adaptar.' }
    ] },
  { id: 'c08', title: 'Revista Raíces', text: 'Un semillero universitario publica Raíces, una revista digital gratuita, y también una edición impresa que venderá en una feria. Para ambas recopiló cinco recursos: una foto CC BY-NC, una ilustración CC BY-SA, un mapa CC BY-NC-ND, un ícono CC0 y una infografía CC BY. El equipo de diseño quiere adaptar varios de esos recursos para unificar el estilo gráfico de la revista en las dos versiones.',
    qs: [
      { id: 'c08q1', q: '¿Qué recursos pueden adaptar y usar en la edición impresa que se vende? Marca 3.', o: [['La ilustración CC BY-SA, con la misma licencia en la adaptación.', 1], ['El ícono CC0.', 1], ['La infografía CC BY, con atribución.', 1], ['La foto CC BY-NC, si la atribuyen.', 0], ['El mapa CC BY-NC-ND, sin modificarlo.', 0]], why: 'La venta es un uso comercial: lo permiten CC BY, CC BY-SA y CC0. NC no lo permite, y el mapa además prohíbe adaptar.' },
      { id: 'c08q2', q: '¿Qué pueden hacer con el mapa CC BY-NC-ND en la revista gratuita? Marca 2.', o: [['Compartirlo sin modificarlo y con atribución.', 1], ['Usarlo, pero no cambiarle el estilo gráfico.', 1], ['Adaptarlo, porque la revista digital es gratuita.', 0], ['Usarlo sin atribución, porque no hay venta.', 0], ['Venderlo también en la edición impresa.', 0]], why: 'CC BY-NC-ND permite compartir sin modificar, sin fines comerciales y con atribución.' },
      { id: 'c08q3', q: '¿Qué deben cumplir si adaptan la ilustración CC BY-SA? Marca 2.', o: [['Compartir la adaptación con la misma licencia o una compatible.', 1], ['Atribuir la obra a su autor original.', 1], ['Ponerle a la adaptación una licencia más restrictiva.', 0], ['Nada, si la modifican lo suficiente para que sea otra.', 0], ['No adaptarla, porque SA prohíbe las obras derivadas.', 0]], why: 'SA (compartir igual) pide que las adaptaciones se compartan con la misma licencia o una compatible, y BY pide atribución.' },
      { id: 'c08q4', q: '¿Qué es correcto sobre el ícono CC0? Marca 2.', o: [['El titular lo dedicó al dominio público en la medida que permite la ley.', 1], ['Permite compartirlo, adaptarlo y usarlo comercialmente.', 1], ['Solo permite usarlo en la revista gratuita, nunca en la edición que se vende.', 0], ['Prohíbe modificar el ícono original.', 0], ['Exige compartir igual cualquier adaptación.', 0]], why: 'Con CC0 el titular renuncia a sus derechos en la medida que la ley lo permite: compartir, adaptar y uso comercial.' },
      { id: 'c08q5', q: '¿Qué afirmaciones sobre la construcción de las licencias son correctas? Marca 2.', o: [['Todas las licencias Creative Commons incluyen la condición BY.', 1], ['SA y ND no aparecen juntas: SA regula adaptaciones y ND las prohíbe.', 1], ['NC y SA no pueden aparecer en la misma licencia.', 0], ['CC0 es una combinación de las condiciones BY y NC.', 0], ['Todas las licencias Creative Commons permiten el uso comercial.', 0]], why: 'BY está en todas; SA y ND son incompatibles. CC BY-NC-SA existe, y NC impide el uso comercial.' }
    ] },
  { id: 'c09', title: 'La infografía de Daniela', text: 'Daniela prepara una infografía para la página web de una fundación. Usa una foto con licencia CC BY 4.0, a la que recorta y le agrega texto, y una gráfica tomada de un blog que no muestra ninguna licencia. Al pie escribe: «Imágenes tomadas de internet. Créditos a sus autores». Sobre la gráfica piensa que, si menciona al autor, ya queda autorizada para usarla.',
    qs: [
      { id: 'c09q1', q: '¿Qué problemas tiene el pie de imagen de Daniela? Marca 2.', o: [['No indica el título, el autor, la fuente ni la licencia de cada recurso.', 1], ['No dice que la foto fue recortada y que se le añadió texto.', 1], ['Debió omitir los créditos, porque la foto es CC BY.', 0], ['Ninguno: basta con mencionar internet como la fuente.', 0], ['Que el crédito general debería ir al inicio de la infografía y no al pie.', 0]], why: 'Una buena atribución tiene título, autor, fuente y licencia, y si el recurso se modificó, se dice.' },
      { id: 'c09q2', q: '¿Qué datos debe incluir la atribución de la foto? Marca 3.', o: [['El título de la obra.', 1], ['El nombre del autor, como pide ser citado.', 1], ['La licencia y, si se puede, su enlace.', 1], ['La fecha exacta en que Daniela la descargó.', 0], ['El número de visitas que tiene la foto.', 0]], why: 'Son cuatro datos: título, autor, fuente con enlace y licencia.' },
      { id: 'c09q3', q: '¿Qué es correcto sobre la gráfica del blog? Marca 2.', o: [['Dar crédito no reemplaza la autorización.', 1], ['Sin licencia visible, primero debe saber si puede usarla.', 1], ['Si menciona al autor, el uso queda autorizado.', 0], ['Puede usarla porque la fundación no tiene ánimo de lucro.', 0], ['Puede usarla si la modifica hasta que se vea distinta.', 0]], why: 'Se puede atribuir correctamente y aun así usar la obra de una forma no permitida. La primera pregunta es: ¿puedo usarla?' },
      { id: 'c09q4', q: '¿Cuáles de las cuatro preguntas de la clase debe hacerse antes de usar un recurso? Marca 3.', o: [['¿Puedo usarla para lo que quiero?', 1], ['¿Puedo modificarla?', 1], ['¿Debo atribuirla?', 1], ['¿Es popular en las redes sociales?', 0], ['¿Aparece en la primera página del buscador?', 0]], why: 'Las cuatro preguntas son: ¿puedo usarla?, ¿puedo modificarla?, ¿puedo usarla comercialmente? y ¿debo atribuirla?' },
      { id: 'c09q5', q: '¿Qué es correcto sobre la foto CC BY que recortó? Marca 2.', o: [['Puede adaptarla y usarla, incluso con fines comerciales.', 1], ['En la atribución debe indicar los cambios que hizo.', 1], ['No puede modificarla, porque CC BY lo prohíbe.', 0], ['Debe publicar la infografía con licencia CC BY-SA.', 0], ['Ya no necesita atribuir, porque la modificó.', 0]], why: 'CC BY permite compartir y adaptar, incluso comercialmente, con atribución; si el recurso se modificó, se indica.' }
    ] },
  { id: 'c10', title: 'La exposición de Julián', text: 'Julián prepara una exposición para clase con un video educativo, fragmentos de un libro y un recurso que encontró en OER Commons. En una diapositiva copia tres páginas completas del libro y en otra pega un párrafo escrito por un compañero sin decir de quién es. Como la exposición le quedó bien, ahora quiere publicar la misma presentación en sus redes sociales para mostrar su trabajo.',

      { id: 'c10q1', q: '¿Qué es correcto sobre publicar la presentación en redes? Marca 2.', o: [['Usar recursos en una clase no es lo mismo que poder publicarlos.', 1], ['Antes de publicar debe verificar las condiciones de cada recurso.', 1], ['Si sirvió en clase, puede publicarse sin revisar nada más.', 0], ['Publicar en sus redes personales no cuenta como distribuir la obra de otros.', 0], ['El uso académico autoriza cualquier distribución posterior.', 0]], why: 'Una presentación proyectada en clase y otra publicada en redes no tienen las mismas condiciones: hay que verificar antes de publicar o distribuir.' },
      { id: 'c10q2', q: '¿Qué es correcto sobre las tres páginas del libro? Marca 2.', o: [['Una cita académica no es lo mismo que reproducir la obra completa.', 1], ['Debe citar la fuente de los fragmentos que use.', 1], ['Copiar páginas completas es una cita si pone el autor.', 0], ['Los libros académicos no tienen derechos de autor.', 0], ['Puede copiar lo que quiera porque es para una clase.', 0]], why: 'En lo académico hay que citar las fuentes y distinguir una cita de la reproducción completa de una obra.' },

      { id: 'c10q4', q: '¿Qué es correcto sobre el recurso de OER Commons? Marca 2.', o: [['Es un recurso en dominio público o con licencia abierta.', 1], ['Aun así, debe revisar la licencia de ese recurso.', 1], ['Todos los recursos abiertos tienen la misma licencia.', 0], ['Los recursos educativos abiertos no requieren atribución.', 0], ['Solo sirven si se descargan en PDF.', 0]], why: 'Los REA están en dominio público o tienen licencias abiertas, pero no todos tienen la misma: hay que leer la licencia de cada uno.' },
      { id: 'c10q5', q: '¿En qué sitios vistos en clase puede buscar recursos abiertos? Marca 3.', o: [['Openverse, un buscador de imágenes y audio abiertos.', 1], ['Wikimedia Commons, con la licencia en cada ficha.', 1], ['OER Commons, repositorio de recursos educativos.', 1], ['El primer resultado del buscador de imágenes.', 0], ['Cualquier perfil de redes con muchas descargas.', 0]], why: 'La clase presentó Openverse, Wikimedia Commons y OER Commons como lugares para buscar recursos abiertos.' }

function rnd(n) {
  try { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); }
}
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fp(s) { var a = 0x811c9dc5, b = 0x9e3779b1; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); a ^= c; a = Math.imul(a, 16777619) >>> 0; b = Math.imul(b ^ c, 0x5bd1e995) >>> 0; b = (b ^ (b >>> 15)) >>> 0; } return a.toString(16) + '-' + b.toString(16); }
function fmtPts(p) { return (Math.round(p * 10) / 10).toFixed(1).replace('.', ','); }

}

function render() {
  if (view === 'game' && S.current) renderGame();
  else if (view === 'summary' && lastGame) renderSummary();

}
