<style>
/* Proyección en aula: ruleta de estaciones con 10 fotos (3 planos, 2 ángulos, 5 técnicas) por equipo */
:root {
  color-scheme: dark;
  --bg: #121c45; --bg-2: #172554;
  --line: rgba(199, 208, 238, 0.18);
  --fg: #f5f7ff; --fg-soft: #c7d0ee; --fg-muted: #93a0cf;
  --indigo: #303f9f; --violet: #4330bc; --cyan: #00bcd4; --cyan-soft: #67e0ee;
  --ok: #5ee0a0; --warn: #ffcf70;
  --c-plano: #67e0ee; --c-angulo: #ffcf70; --c-tecnica: #b39cff;
  --font-display: 'Manrope', 'Segoe UI', Arial, sans-serif;
  --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 700px at 85% -10%, rgba(67, 48, 188, 0.45), transparent 60%), linear-gradient(160deg, var(--bg-2) 0%, var(--bg) 70%);
  background-color: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
}
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 40px); padding-block: 28px 48px; display: flex; flex-direction: column; gap: 24px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.eyebrow { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan-soft); margin: 0; }
.eyebrow::before { content: ""; width: 40px; height: 3px; border-radius: 2px; background: var(--cyan); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 4.2vw, 52px); line-height: 1.05; letter-spacing: -0.02em; margin: 8px 0 0; text-wrap: balance; }
.pill { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg-soft); font-size: 15px; background: rgba(255,255,255,0.04); }
.pill b { color: var(--fg); }
nav.steps { display: flex; flex-wrap: wrap; gap: 8px; }
nav.steps button { font: 600 15px/1 var(--font-body); color: var(--fg-soft); background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 999px; padding: 11px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
nav.steps button .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.1); font-size: 12px; }
nav.steps button[aria-current="step"] { background: var(--fg); color: var(--bg-2); border-color: var(--fg); }
nav.steps button[aria-current="step"] .n { background: var(--indigo); color: var(--fg); }
nav.steps button .done { color: var(--ok); font-size: 13px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--cyan-soft); outline-offset: 3px; }
.panel { background: rgba(29, 44, 102, 0.72); border: 1px solid var(--line); border-radius: 20px; padding: clamp(18px, 2.4vw, 32px); display: flex; flex-direction: column; gap: 20px; }
.panel h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.lead { color: var(--fg-soft); margin: 0; max-width: 78ch; font-size: 17px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { font: 600 15px/1 var(--font-body); border-radius: 12px; padding: 12px 18px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--fg); cursor: pointer; }
.btn:hover { background: rgba(255,255,255,0.12); }
.btn.primary { background: var(--cyan); color: #0b1435; border-color: var(--cyan); }
.btn.primary:hover { background: var(--cyan-soft); }
.btn.danger { border-color: rgba(255, 207, 112, 0.5); color: var(--warn); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.hint { font-size: 14px; color: var(--fg-muted); margin: 0; }
.counter { display: flex; align-items: center; gap: 14px; }
.counter output { font-family: var(--font-display); font-size: 44px; font-weight: 800; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.teamchip { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); }
.badge { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; background: linear-gradient(135deg, var(--indigo), var(--violet)); color: var(--fg); flex: none; }
.toggle { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; color: var(--fg-soft); cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--cyan); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--fg-soft); padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* Ruleta */
.spin { display: grid; grid-template-columns: minmax(0, 500px) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 1000px) { .spin { grid-template-columns: minmax(0, 1fr); } }
.wheelbox { position: relative; width: 100%; max-width: 500px; aspect-ratio: 1; margin-inline: auto; }
.wheelbox svg.wheel { width: 100%; height: 100%; display: block; transition: transform 4.6s cubic-bezier(.12,.72,.12,1); filter: drop-shadow(0 18px 40px rgba(5,10,40,0.45)); }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 34px solid var(--warn); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); z-index: 2; }
.hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 104px; height: 104px; border-radius: 50%; border: 4px solid var(--fg); background: linear-gradient(135deg, var(--indigo), var(--violet)); color: var(--fg); font: 800 18px/1.1 var(--font-display); cursor: pointer; box-shadow: 0 8px 24px rgba(5,10,40,0.5); z-index: 2; }
.hub:hover:not([disabled]) { background: var(--cyan); color: #0b1435; }
.hub[disabled] { cursor: not-allowed; opacity: 0.7; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.side > h3 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); margin: 0; font-weight: 600; }
.turnlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }
.turn { font: 800 22px/1 var(--font-display); height: 52px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--fg); cursor: pointer; position: relative; }
.turn[aria-pressed="true"] { background: var(--fg); color: var(--bg-2); border-color: var(--fg); }
.turn.has { color: var(--fg-muted); background: transparent; border-style: dashed; }
.turn.has::after { content: "✓"; position: absolute; top: 4px; right: 7px; font-size: 12px; color: var(--ok); }
.status { padding: 14px 16px; border-radius: 14px; background: rgba(0, 188, 212, 0.12); border: 1px solid rgba(103, 224, 238, 0.35); font-size: 15px; }
.status.ok { background: rgba(94, 224, 160, 0.12); border-color: rgba(94, 224, 160, 0.4); }
input.text { font: 500 16px var(--font-body); color: var(--fg); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; }

/* Tarjeta de estación */
.reto { display: flex; flex-direction: column; gap: 14px; padding: clamp(18px, 2.4vw, 26px); border-radius: 18px; background: var(--fg); color: #172554; border-top: 8px solid var(--cyan); }
.reto.empty { background: rgba(255,255,255,0.05); color: var(--fg-soft); border: 1px dashed var(--line); }
.reto .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 14px; color: #4b5563; }
.reto .num { font: 800 14px var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: #303f9f; }
.reto h3 { font: 800 clamp(24px, 2.6vw, 32px)/1.1 var(--font-display); margin: 0; }
.shots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.shot { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #eef1f9; border-left: 5px solid var(--sc); }
.shot .k { font: 800 15px/1 var(--font-display); color: #303f9f; min-width: 22px; padding-top: 3px; }
.shot .cat { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4b5563; }
.shot .nm { display: block; font-weight: 700; font-size: 16px; line-height: 1.3; }
.shot .how { display: block; font-size: 14px; color: #4b5563; line-height: 1.35; }
.reto .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: #4b5563; border-top: 1px solid #e1e5f0; padding-top: 12px; }
.reto .actions button { font: 600 14px var(--font-body); border-radius: 10px; padding: 8px 12px; border: 0; cursor: pointer; background: #eef1f9; color: #303f9f; }
.reto .actions button.yes { background: #303f9f; color: #fff; }

/* Reto y socialización */
.timer { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 20px 24px; border-radius: 18px; background: rgba(5, 10, 40, 0.35); border: 1px solid var(--line); }
.timer output { font: 800 clamp(48px, 7vw, 84px)/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 4.4ch; }
.timer.end output { color: var(--warn); }
.timer .presets { display: flex; flex-wrap: wrap; gap: 8px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.rule { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.rule .k { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan-soft); }
.rule h3 { font-family: var(--font-display); font-size: 21px; margin: 0; line-height: 1.2; }
.rule p, .rule li { margin: 0; color: var(--fg-soft); }
.rule ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-left: 5px solid var(--sc); }
.check .k { font: 800 18px/1 var(--font-display); color: var(--fg-muted); min-width: 24px; }
.check .txt { flex: 1; min-width: 0; }
.check .cat { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sc); }
.check .nm { display: block; font-weight: 600; }
.check .nm.hidden { color: var(--fg-muted); font-style: italic; font-weight: 500; }
.check button { font: 600 13px var(--font-body); border-radius: 10px; padding: 8px 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--fg); cursor: pointer; white-space: nowrap; }
.check button[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #0b1435; }
.check.on { background: rgba(94, 224, 160, 0.10); }
.check.off { background: rgba(255, 207, 112, 0.08); }
.check .yn { display: flex; gap: 6px; }
.check button.no[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #0b1435; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button { font: 700 16px/1 var(--font-display); border-radius: 12px; padding: 10px 14px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--fg); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg-2); }
.tabs button[disabled] { opacity: 0.4; cursor: not-allowed; }
.score { display: flex; flex-wrap: wrap; gap: 12px; }
.score div { padding: 12px 16px; border-radius: 14px; background: rgba(5, 10, 40, 0.35); border: 1px solid var(--line); }
.score b { font: 800 28px/1 var(--font-display); display: block; font-variant-numeric: tabular-nums; }
.score span { font-size: 13px; color: var(--fg-muted); }
.prompt { padding: 16px 18px; border-radius: 14px; background: var(--fg); color: #172554; font-size: 16px; }
.prompt b { color: #303f9f; }

/* Resumen */
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.tcard { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.tcard header { display: flex; align-items: center; gap: 12px; }
.tcard header h3 { margin: 0; font-family: var(--font-display); font-size: 20px; }
.tcard .grp { font-size: 14px; color: var(--fg-soft); margin: 0; }
.tcard .grp b { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; display: block; }
.tcard .nums { font-size: 14px; color: var(--fg-muted); }
.tcard .empty { color: var(--fg-muted); font-style: italic; }
.preview { display: flex; flex-direction: column; gap: 10px; }
.preview img { width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--line); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
@media (prefers-reduced-motion: reduce) { .wheelbox svg.wheel { transition-duration: 0.01s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Creación de Contenidos Digitales · Reto fotográfico</p>
      <h1>Ruleta de retos fotográficos</h1>
    </div>
    <span class="pill">Equipos de 3 · <b>10 fotos</b> por estación · 3 planos · 2 ángulos · 5 técnicas · <b>30 min</b></span>
  </header>

</div>

<script>
(function () {
  var CAT = {
    p: { label: 'Plano', color: '#67e0ee' },
    a: { label: 'Ángulo', color: '#ffcf70' },
    t: { label: 'Técnica', color: '#b39cff' }
  };
  var PLANOS = [
    { n: 'Gran plano general', h: 'La persona es pequeña frente a un gran espacio del campus.' },
    { n: 'Plano general', h: 'Cuerpo completo y el entorno que lo rodea.' },
    { n: 'Plano americano', h: 'Desde la cabeza hasta las rodillas.' },
    { n: 'Plano medio', h: 'Desde la cabeza hasta la cintura.' },
    { n: 'Primer plano', h: 'Rostro y hombros.' },
    { n: 'Primerísimo primer plano', h: 'Solo el rostro llena el cuadro.' },
    { n: 'Plano detalle', h: 'Un objeto o una parte del cuerpo: manos, ojos, un útil.' }
  ];
  var ANGULOS = [
    { n: 'Normal', h: 'Cámara a la altura de los ojos del sujeto.' },
    { n: 'Picado', h: 'Cámara por encima, mirando hacia abajo.' },
    { n: 'Contrapicado', h: 'Cámara por debajo, mirando hacia arriba.' },
    { n: 'Cenital', h: 'Cámara totalmente encima, paralela al suelo.' },
    { n: 'Nadir', h: 'Cámara en el suelo, mirando justo hacia arriba.' },
    { n: 'Holandés', h: 'Cámara inclinada: el horizonte queda torcido a propósito.' }
  ];
  var TECNICAS = [
    { n: 'Regla de tercios', h: 'Protagonista sobre una línea o un cruce de la cuadrícula.' },
    { n: 'Simetría', h: 'Un eje en el centro: fachada, escalera, reflejo.' },
    { n: 'Aislar un elemento', h: 'Un solo sujeto sobre un fondo limpio.' },
    { n: 'Líneas y punto de fuga', h: 'Pasillos, escaleras o andenes que llevan la mirada.' },
    { n: 'Componer desde una esquina', h: 'Un camino o una línea que entra por una esquina.' },
    { n: 'Figura humana y escala', h: 'Una persona pequeña que muestre lo grande del lugar.' },
    { n: 'Enmarcar', h: 'Una puerta, un arco, una ventana o ramas como marco.' },
    { n: 'Patrón (o romperlo)', h: 'Sillas, ventanas o bicicletas repetidas; o una que rompa.' },
    { n: 'Primer plano complementario', h: 'Algo desenfocado cerca del lente y el sujeto al fondo.' },
    { n: 'Panorámica', h: 'Modo panorámico de una vista amplia del campus.' }
  ];
  var NST = 10, SEG = 360 / NST;
  var COLORS = ['#303f9f', '#155e75', '#4330bc', '#173b7a'];
  var DOTS = ['#67e0ee', '#ffcf70', '#b39cff', '#5ee0a0', '#ff9fc0'];
  var STEPS = [{ id: 'equipos', label: 'Equipos' }, { id: 'ruleta', label: 'Ruleta' }, { id: 'reto', label: 'Al campus · 30 min' }, { id: 'social', label: 'Socialización' }, { id: 'resumen', label: 'Resumen' }];
  var LETTERS = 'ABCDEFGHIJKL'.split('');
  var KEY = 'ruleta-estaciones-fotograficas-v3';

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // Reparte cada lista de forma pareja: baraja la lista varias veces seguidas y cada estación toma k elementos distintos en orden.
  function deal(len, k) {
    var range = Array.from({ length: len }, function (_, i) { return i; }), pool = [], out = [];
    while (pool.length < NST * k) pool = pool.concat(shuffle(range));
    for (var s = 0; s < NST; s++) {
      var g = [];
      while (g.length < k) { var idx = 0; while (g.indexOf(pool[idx]) >= 0) idx++; g.push(pool.splice(idx, 1)[0]); }
      out.push(g);
    }
    return out;
  }
  function distinct(g) { var seen = {}; return g.every(function (x) { var key = x.slice().sort().join(','); if (seen[key]) return false; seen[key] = 1; return true; }); }
  // Repite el reparto hasta que ninguna estación tenga los mismos planos, ángulos o técnicas que otra.
  function makeStations() {
    var p, a, t, tries = 0;
    do { p = deal(PLANOS.length, 3); tries++; } while (!distinct(p) && tries < 500);
    tries = 0; do { a = deal(ANGULOS.length, 2); tries++; } while (!distinct(a) && tries < 500);
    tries = 0; do { t = deal(TECNICAS.length, 5); tries++; } while (!distinct(t) && tries < 500);
    return p.map(function (_, s) { return { p: p[s], a: a[s], t: t[s] }; });
  }
  function fresh() { return { step: 'equipos', teams: 8, stations: makeStations(), picks: {}, sel: 'A', rot: 0, noRepeat: true, last: null, confirm: null, taken: {}, ident: {}, view: 'A', showList: false, shown: {} }; }
  var state = null;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !Array.isArray(state.stations) || state.stations.length !== NST) state = fresh();
  ['taken', 'ident', 'shown', 'picks'].forEach(function (k) { if (!state[k] || typeof state[k] !== 'object') state[k] = {}; });
  state.confirm = null;
  var who = '', spinning = false;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function teams() { return LETTERS.slice(0, state.teams); }
  function pickOf(t) { return state.picks[t] || null; }
  function used(i) { return teams().some(function (t) { return state.picks[t] && state.picks[t].i === i; }); }
  function nextPending() { var ts = teams(); for (var i = 0; i < ts.length; i++) if (!pickOf(ts[i])) return ts[i]; return null; }
  function allDone() { return teams().every(function (t) { return pickOf(t); }); }
  function available() { var a = []; for (var i = 0; i < NST; i++) if (!state.noRepeat || !used(i)) a.push(i); return a; }
  // Las 10 fotos de una estación, en orden: 3 planos, 2 ángulos, 5 técnicas.
  function shots(i) {
    var S = state.stations[i], out = [];
    S.p.forEach(function (x) { out.push({ c: 'p', n: PLANOS[x].n, h: PLANOS[x].h }); });
    S.a.forEach(function (x) { out.push({ c: 'a', n: ANGULOS[x].n, h: ANGULOS[x].h }); });
    S.t.forEach(function (x) { out.push({ c: 't', n: TECNICAS[x].n, h: TECNICAS[x].h }); });
    return out;
  }

          if (e && e.code === 'declined') { msgEl.textContent = 'Descarga cancelada.'; return; }
          if (e && e.code === 'rate_limited') { msgEl.textContent = 'Hay una descarga pendiente; intenten de nuevo en un momento.'; return; }
          msgEl.textContent = ''; showPreview('No se pudo descargar aquí. Clic derecho (o mantener presionado) sobre la imagen y «Guardar imagen como…».');
        });
      });
    }, 'image/png');
  }

  function render() {
    renderSteps();
    if (state.step === 'equipos') renderEquipos();
    else if (state.step === 'ruleta') renderRuleta();
    else if (state.step === 'reto') renderReto();
    else if (state.step === 'social') renderSocial();
    else renderResumen();
    var i = STEPS.findIndex(function (s) { return s.id === state.step; });
    document.getElementById('prev').disabled = i === 0;
    var nx = document.getElementById('next');
    nx.disabled = i === STEPS.length - 1;
    nx.textContent = i < STEPS.length - 1 ? STEPS[i + 1].label + ' →' : 'Fin';
    save();
  }
  function go(step) { if (spinning) return; state.step = step; state.confirm = null; state.last = null; who = ''; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  stepsNav.addEventListener('click', function (e) { var b = e.target.closest('button[data-step]'); if (b) go(b.dataset.step); });
  document.getElementById('prev').addEventListener('click', function () { var i = STEPS.findIndex(function (s) { return s.id === state.step; }); if (i > 0) go(STEPS[i - 1].id); });
  document.getElementById('next').addEventListener('click', function () { var i = STEPS.findIndex(function (s) { return s.id === state.step; }); if (i < STEPS.length - 1) go(STEPS[i + 1].id); });

  view.addEventListener('change', function (e) {
    if (e.target.id === 'norep') { state.noRepeat = e.target.checked; render(); }
  });
  view.addEventListener('input', function (e) { if (e.target.id === 'who') who = e.target.value; });
  view.addEventListener('click', function (e) {
    var t = e.target.closest('button') || e.target;
    if (spinning) return;
    if (t.id === 'plus' && state.teams < 12) { state.teams++; render(); return; }
    if (t.id === 'minus' && state.teams > 2) { state.teams--; var gone = LETTERS[state.teams]; delete state.picks[gone]; delete state.taken[gone]; delete state.ident[gone]; delete state.shown[gone]; render(); return; }
    if (t.id === 'reset') { state.confirm = 'reset'; render(); return; }
    if (t.id === 'resetNo') { state.confirm = null; render(); return; }
    if (t.id === 'resetYes') { var n = state.teams, nr = state.noRepeat; state = fresh(); state.teams = n; state.noRepeat = nr; render(); return; }
    if (t.id === 'spin') { spin(); return; }
    if (t.dataset.ask) { state.confirm = t.dataset.ask; state.last = t.dataset.ask; render(); return; }
    if (t.dataset.release) { var r = t.dataset.release; delete state.picks[r]; delete state.taken[r]; delete state.ident[r]; delete state.shown[r]; state.sel = r; state.last = null; state.confirm = null; render(); return; }
    if (t.dataset.cancel) { state.confirm = null; render(); return; }
    if (t.classList.contains('turn')) { var tm = t.dataset.team; if (pickOf(tm)) { state.last = tm; } else { state.sel = tm; state.last = null; } var w = document.getElementById('who'); who = w ? w.value : ''; render(); return; }
    if (t.dataset.view) { state.view = t.dataset.view; render(); return; }
    if (t.dataset.take) { setFlag(state.taken, state.view, t.dataset.take, !flag(state.taken, state.view, t.dataset.take)); render(); return; }
    if (t.id === 'toggleList') { state.showList = !state.showList; render(); return; }
    if (t.dataset.ident) { var want = t.dataset.v === '1', curV = state.ident[state.view] ? state.ident[state.view][t.dataset.ident] : undefined; setFlag(state.ident, state.view, t.dataset.ident, curV === want ? undefined : want); render(); return; }
    if (t.id === 'copy') {
      var msg = document.getElementById('copyMsg');
      try { navigator.clipboard.writeText(summaryText()).then(function () { msg.textContent = 'Resumen copiado.'; }, function () { msg.textContent = 'No se pudo copiar; usen la imagen.'; }); } catch (err) { msg.textContent = 'No se pudo copiar; usen la imagen.'; }
      return;
    }
    if (t.id === 'png') {
      var items = teams().map(function (tm) {
        var p = pickOf(tm);
        if (!p) return { badge: tm, name: 'Equipo ' + tm, tag: 'Pendiente de girar', color: '#93a0cf', groups: [] };
        return { badge: tm, name: 'Equipo ' + tm, tag: 'Estación ' + (p.i + 1), color: DOTS[p.i % 5],
          groups: [{ label: 'Planos', color: CAT.p.color, text: names(p.i, 'p') }, { label: 'Ángulos', color: CAT.a.color, text: names(p.i, 'a') }, { label: 'Técnicas', color: CAT.t.color, text: names(p.i, 't') }],
          who: p.who ? 'Giró: ' + p.who : 'Giró: (sin nombre)',
          foot: 'Tomadas ' + count(state.taken, tm) + '/10 · Identificadas ' + count(state.ident, tm) + '/10' };
      });
      var goImg = function () { offerImage(drawSummary('Ruleta de retos fotográficos', 'Las 10 fotos de cada equipo', items), 'resumen-retos-fotograficos.png', document.getElementById('copyMsg'), document.getElementById('preview')); };
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(goImg); else goImg();
      return;
    }
    if (t.dataset.preset) { clearInterval(timer.id); timer.id = null; timer.total = timer.left = +t.dataset.preset; render(); return; }
    if (t.id === 'play') {
      if (timer.id) { clearInterval(timer.id); timer.id = null; t.textContent = 'Iniciar'; }
      else { if (timer.left === 0) timer.left = timer.total; timer.id = setInterval(tick, 1000); t.textContent = 'Pausar'; var bx = document.getElementById('timerBox'); if (bx) bx.classList.remove('end'); }
      return;
    }
    if (t.id === 'restart') { clearInterval(timer.id); timer.id = null; timer.left = timer.total; render(); return; }
  });

  render();
})();
</script>

</body></html>
