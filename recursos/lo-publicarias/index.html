<!doctype html><html><head>
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>¿Lo publicarías?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: tablero de aula — barra de pasos arriba, una sola escena grande por paso, navegación abajo; legible a 4 metros.
   Línea gráfica del curso: fondo blanco, navy estructural, azul eléctrico, violeta de acento y cyan para conexiones. Un solo tema claro, deliberado, para proyección. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --ink:#172B5B; --muted:#334155; --line:#DCE3EE;
  --accent:#4330BC; --accent-ink:#FFFFFF; --accent-soft:#ECE9FB;
  --navy:#172B5B; --navy-ink:#FFFFFF; --blue:#2456A6; --cyan:#00A9D6;
  --good:#0E7A5F; --good-soft:#E2F4EE; --warn:#8A5A00; --warn-soft:#FBF0D6; --bad:#B0215F; --bad-soft:#FBE7EF;
  --display:'Manrope','Segoe UI',Arial,sans-serif;
  --body:'Source Sans 3','Segoe UI',Arial,sans-serif;
  --page:#FFFFFF; --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;padding-inline:clamp(16px,3vw,40px);padding-block:0}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{max-width:1400px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column;gap:24px;padding-block:20px 28px}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:flex;flex-direction:column}
.brand small{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand h1{font-size:clamp(28px,3.4vw,44px);font-weight:800}
.brand h1 span{color:var(--accent)}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.steps button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px 8px 8px;font-size:15px;font-weight:700;color:var(--muted)}
.steps button b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--bg);font-size:14px;font-variant-numeric:tabular-nums}
.steps button[aria-current="step"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.steps button[aria-current="step"] b{background:var(--cyan);color:var(--navy)}
.steps button.done b{background:var(--good-soft);color:var(--good)}

.scene{flex:1;display:flex;flex-direction:column;gap:24px;min-width:0}
.scene-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.scene-head h2{font-size:clamp(30px,4vw,56px);font-weight:800}
.lead{font-size:clamp(18px,1.6vw,22px);color:var(--muted);max-width:62ch}

.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:18px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.on-dark{background:rgba(255,255,255,.12);color:#FFFFFF;border-color:rgba(255,255,255,.4)}
.btn.on-dark:hover{background:rgba(255,255,255,.2)}
.btn.on-dark.primary{background:var(--cyan);color:var(--navy);border-color:var(--cyan)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:8px 14px;font-size:15px;border-radius:10px}

/* paso 1 */
.setup{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h3{font-size:22px}
.counter{display:flex;align-items:center;gap:16px}
.counter button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:40px;font-weight:700;line-height:1}
.counter output{font-family:var(--display);font-size:120px;font-weight:800;line-height:1;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.check{display:flex;gap:12px;align-items:flex-start;font-size:17px}
.check input{width:24px;height:24px;accent-color:var(--accent);margin-top:2px}
.note{font-size:15px;color:var(--muted)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.names label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.names input{font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}

/* paso 2 */
.turn{background:var(--navy);color:var(--navy-ink);border-radius:var(--r);padding:18px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.turn p{font-size:clamp(20px,2.2vw,30px)}
.turn strong{font-family:var(--display);color:var(--cyan)}
.turn-actions{display:flex;gap:8px;flex-wrap:wrap}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{perspective:1200px;min-height:196px;min-width:0;border:0;padding:0;background:none;text-align:left}
.card-inner{position:relative;height:100%;min-height:196px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r);backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:14px;display:flex;flex-direction:column;overflow:hidden}
.front{background:var(--navy);color:var(--navy-ink);justify-content:space-between;overflow:hidden}
.front{background:linear-gradient(135deg,#172B5B 0%,#2456A6 60%,#4330BC 100%)}
.front::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1.2px,transparent 1.4px);background-size:16px 16px;-webkit-mask-image:linear-gradient(200deg,#000 0%,transparent 55%);mask-image:linear-gradient(200deg,#000 0%,transparent 55%)}
.front::after{content:"";position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;border:2px solid #00A9D6;box-shadow:0 0 0 14px rgba(0,169,214,.12)}
.front .num{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.8}
.front .q{font-family:var(--display);font-size:64px;font-weight:800;line-height:1;position:relative;z-index:1}
.back{background:var(--surface);border:2px solid var(--accent);transform:rotateY(180deg);gap:8px}
.back .num{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.back h3{font-size:18px;line-height:1.15}
.back p{font-size:14px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.back .who{margin-top:auto;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:6px 12px;align-self:flex-start}
.card:disabled{cursor:default}
.card.taken:not(.flipped) .front{opacity:.35}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.chip.on{background:var(--good-soft);border-color:var(--good-soft);color:var(--good)}

/* paso 3 */
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.rowtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.team{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.row h3{font-size:clamp(24px,2.2vw,30px)}
.row .sit{font-size:18px;color:var(--muted)}
.row ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:17px}
.row ol li{display:flex;gap:10px}
.row ol li b{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--bg);font-size:15px}
.row .q{font-size:17px;font-weight:700;border-top:1px dashed var(--line);padding-top:10px}

/* paso 4 */
.guide{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.role h3{font-size:24px}
.role .ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px}
.role p{color:var(--muted);font-size:17px}
.extra{font-size:16px;color:var(--muted);grid-column:1/-1}
.steps-list{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps-list li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px}
.steps-list li::before{content:counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--navy-ink);font-family:var(--display);font-weight:800;font-size:22px}
.steps-list b{display:block;font-size:19px}
.timer{background:var(--navy);color:var(--navy-ink);border-radius:var(--r);padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.timer .clock{font-family:var(--display);font-size:clamp(56px,7vw,96px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.timer .phase{font-size:20px;font-weight:700}
.timer .phase small{display:block;font-weight:400;opacity:.8;font-size:16px}
.timer .ctrl{display:flex;gap:8px;flex-wrap:wrap}
.timer .btn{background:transparent;color:var(--navy-ink);border-color:rgba(255,255,255,.3)}
.timer .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{flex-basis:100%;height:10px;border-radius:999px;background:rgba(255,255,255,.15);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cyan),#7C6CF0);border-radius:999px;width:0}

.timer.alert{outline:4px solid var(--cyan)}

/* paso 5 */
.twists{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px}
.twist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.reveal{background:var(--accent-soft);border-radius:14px;padding:16px;font-size:20px;line-height:1.4}
.reveal b{display:block;color:var(--accent);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}

/* paso 6 */
.social{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
.big-case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px}
.big-case h3{font-size:clamp(28px,3vw,40px)}
.big-case .sit{font-size:20px;color:var(--muted)}
.vote{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vote div{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:15px;min-width:0}
.vote div b{font-family:var(--display);font-size:28px}
.prompt{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:16px 18px;font-size:19px;line-height:1.5}
.matrix{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}
.lens{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lens:last-child{border-bottom:0}
.lens b{font-size:19px}
.lens small{display:block;color:var(--muted);font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].si{background:var(--good-soft);color:var(--good)}
.seg button[aria-pressed="true"].no{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].dep{background:var(--warn-soft);color:var(--warn)}
.mini{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:12px 14px}
.mini .clock{font-family:var(--display);font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;min-width:3.2ch}
.mini.alert .clock{color:var(--accent)}
.teamnav{display:flex;flex-wrap:wrap;gap:6px}
.teamnav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px}
.teamnav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:16px;min-width:720px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.v{font-weight:700;text-align:center}
td.v.si{color:var(--good)} td.v.no{color:var(--bad)} td.v.dep{color:var(--warn)}
.empty{color:var(--muted);font-size:18px;padding:24px;border:2px dashed var(--line);border-radius:var(--r);text-align:center}

/* retroalimentación */
tr.open td{background:var(--accent-soft)}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.fbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fbl{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.fbl.ok{border-color:var(--good);box-shadow:0 0 0 2px var(--good-soft)}
.fbn{font-family:var(--display);font-weight:800;color:var(--blue);font-size:17px}
.fbbest{font-size:15px;color:var(--muted)}
.fbbest b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--navy);color:var(--navy-ink);font-family:var(--display);font-size:16px;margin-left:4px}
.fbopt{font-family:var(--display);font-weight:700;color:var(--navy);font-size:16px;line-height:1.3}
.fbwhy{font-size:15px;color:var(--muted);border-left:3px solid var(--cyan);padding-left:10px}
.fbtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.fbgiro{background:var(--accent-soft);border-radius:12px;padding:12px 16px;font-size:17px}
.fbgiro b{display:block;color:var(--accent);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}

/* elección, giro, voto popular */
.choose{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.choose>span{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg.big{align-self:flex-start}
.seg.big button{padding:10px 18px;font-size:18px;font-family:var(--display);color:var(--navy)}
.seg.big button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.head-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.count-pill{font-weight:700;font-size:15px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 14px}
.initial{font-size:16px;color:var(--muted)}
.initial b{color:var(--navy)}
.keeprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.keepbtn[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.status{font-weight:700;font-size:16px}
.status.keep{color:var(--good)}
.status.change{color:var(--accent)}
.reveal.small{font-size:17px;padding:12px 14px}
.popbox{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pophead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.pophead b{font-family:var(--display);color:var(--navy)}
.popgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pv{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0;border:2px solid transparent}
.pv.lead{border-color:var(--accent);background:var(--accent-soft)}
.pv b{font-family:var(--display);font-size:24px;color:var(--navy)}
.pv span{flex:1}
.votes{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.votes button{border:0;background:var(--bg);width:34px;height:32px;font-size:18px;font-weight:700;color:var(--navy)}
.votes output{flex:1;text-align:center;font-family:var(--display);font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.votes input{flex:1;min-width:0;width:100%;border:0;border-inline:1px solid var(--line);height:32px;text-align:center;font-family:var(--display);font-weight:800;font-size:17px;color:var(--navy);background:var(--surface);-moz-appearance:textfield;appearance:textfield}
.votes input::-webkit-outer-spin-button,.votes input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.decide{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.decide h3{font-size:clamp(24px,2.4vw,32px)}
.decide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:10px}
.drow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:12px;padding:10px 14px}
.dname{display:flex;flex-direction:column;min-width:0}
.dname b{font-family:var(--display);color:var(--navy);font-size:17px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tri div{background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:10px 14px;min-width:0}
.tri small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.tri b{font-family:var(--display);font-size:30px}
td.v.chg{color:var(--accent)}
td small{color:var(--muted);font-weight:400}
.cmps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cmp{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cmp small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cmp b{font-family:var(--display);color:var(--navy);font-size:16px;line-height:1.3}
.cmp span{font-size:14px;color:var(--blue);font-weight:700}
.fbtag{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--muted)}
.fbtag.ok{background:var(--good-soft);color:var(--good)}
.fb h3{font-size:clamp(24px,2.4vw,32px)}
@media (max-width:640px){
  .deck{grid-template-columns:repeat(2,minmax(0,1fr))}
  .front .q{font-size:48px}
  .popgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tri b{font-size:24px}
}

  o:["Borrar la publicación.","Responder en público reconociendo su aporte y editar para etiquetarla.","Escribirle en privado una disculpa sin cambiar el post.","Responder: “Fue sin querer, no es para tanto”."],
  g:"Otros comentan que en ese equipo siempre se olvidan de las mujeres.", q:"¿Cómo se reconoce un error en público?",
  fb:{legal:[1,"Ninguna opción tiene riesgo legal; reconocer la autoría es lo más correcto."],etica:[1,"Da crédito a quien lo merece donde todos pueden verlo."],resp:[1,"Corrige el error en el mismo espacio donde ocurrió."],rel:[2,"Una disculpa personal y directa repara el vínculo; idealmente, junto con la B."],marca:[1,"Reconocer un error en público y corregirlo fortalece tu reputación."]},
  gn:"El giro amplía la discusión: el reconocimiento público (B) es aún más necesario."},
 {t:"El documento compartido", s:"En el documento compartido del equipo, un compañero borra dos de tus secciones sin avisar. La entrega es mañana.", short:"Un compañero borró tus secciones en el documento compartido.",
  o:["Reclamarle en el grupo de WhatsApp.","Restaurar desde el historial y dejar un comentario en el documento preguntando qué pasó.","Restaurar sin decir nada.","Contarle al docente."],
  g:"El historial muestra que lo borró al pegar por error una versión antigua.", q:"¿Qué herramientas digitales ayudan a no suponer?",
  fb:{legal:[1,"Ninguna opción tiene riesgo legal; el historial te permite actuar con evidencia."],etica:[1,"Recupera tu trabajo sin suponer mala intención."],resp:[1,"Resuelve el problema y deja registro para que no se repita."],rel:[1,"Pregunta en el lugar del trabajo, sin exponerlo en el chat."],marca:[1,"Usar las herramientas colaborativas con criterio es una competencia profesional."]},
  gn:"El giro confirma que fue un error: suponer sabotaje habría escalado el conflicto sin razón."}
];
const LENSES=[["legal","Legal","¿Lo permiten las normas?"],["etica","Ética","¿Respeta dignidad, privacidad, no daño?"],["resp","Responsable","¿Consideré las consecuencias?"],["rel","Relacional","¿Resuelve o amplifica?"],["marca","Marca personal","¿Coherente con quien quiero ser?"]];
const STEPS=["Equipos","Sorteo","Resumen","Análisis y decisión","Giro","Socialización"];
const L="ABCD", L5="ABCD";
const KEY="lo-publicarias-v3";
const T_ANALYSIS=540, T_AFTER=300;

function fresh(){return{step:0,count:8,names:[],allowRepeat:false,picks:[],flipped:null,twists:{},matrix:{},soc:0,init:{},after:{},pop:{},shown:{},fbOpen:null,full:true,decide:false}}
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw))}catch(e){}
S.flipped=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const has=v=>v!==undefined&&v!==null;
const teamName=i=>(S.names[i]&&S.names[i].trim())||("Equipo "+(i+1));
const optText=(c,v)=>`${L[v]} · ${c.o[v]}`;
function sync(){S.picks.length=S.count;for(let i=0;i<S.count;i++)if(S.picks[i]===undefined)S.picks[i]=null}
const allPicked=()=>S.picks.slice(0,S.count).every(p=>p!==null);
const nextTurn=()=>{const i=S.picks.findIndex(p=>p===null);return i<0?S.count:i};
const afterOf=k=>has(S.after[k])?S.after[k]:S.init[k];
function popular(k){const a=(S.pop[k]||[0,0,0,0]).slice(0,4);const tot=a.reduce((x,y)=>x+y,0);const max=Math.max(...a);const leaders=max>0?a.map((v,i)=>v===max?i:-1).filter(i=>i>=0):[];return{a,tot,leaders,one:leaders.length===1?leaders[0]:null}}

/* ---------- temporizadores ---------- */
const timers={};
function makeTimer(id,secs,onTick,onEnd){stopTimer(id);timers[id]={left:secs,total:secs,running:false,iv:null,onTick,onEnd};onTick(timers[id])}
function toggleTimer(id){
  const t=timers[id];if(!t)return;
  if(t.running){clearInterval(t.iv);t.running=false;t.onTick(t);return}
  if(t.left<=0)return;
  t.running=true;t.onTick(t);
  t.iv=setInterval(()=>{t.left--;t.onTick(t);if(t.left<=0){clearInterval(t.iv);t.running=false;t.onTick(t);t.onEnd&&t.onEnd(t)}},1000);
}
function stopTimer(id){const t=timers[id];if(t){clearInterval(t.iv);delete timers[id]}}
const mmss=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const KEEP=new Set(["work","post"]);

/* ---------- render ---------- */
function renderSteps(){$("#steps").innerHTML=STEPS.map((n,i)=>`<li><button type="button" data-go="${i}" ${i===S.step?'aria-current="step"':''} class="${i<S.step?'done':''}"><b>${i+1}</b>${n}</button></li>`).join("")}
const after={};
function render(){
  sync();renderSteps();
  Object.keys(timers).forEach(k=>{if(!KEEP.has(k))stopTimer(k)});
  $("#scene").innerHTML=[s1,s2,s3,s4,s5,s6][S.step]();
  after[S.step]&&after[S.step]();
  $("#prev").disabled=S.step===0;
  const block=S.step===1&&!allPicked();
  $("#next").disabled=S.step===STEPS.length-1||block;
  $("#next").textContent=block?"Faltan equipos por elegir":"Siguiente →";
  save();
}
function keepMini(fn){const keep={vote:timers.vote&&{...timers.vote},talk:timers.talk&&{...timers.talk}};fn();render();["vote","talk"].forEach(id=>{const k=keep[id];if(!k||!timers[id])return;const t=timers[id];t.left=k.left;t.onTick(t);if(k.running)toggleTimer(id)})}
function seg(attr,k,cur,labels){return `<div class="seg big" role="group">${labels.map((x,v)=>`<button type="button" ${attr}="${k}:${v}" aria-pressed="${cur===v}">${x}</button>`).join("")}</div>`}

/* paso 1 */
function s1(){
  const inputs=Array.from({length:S.count},(_,i)=>`<label for="n${i}">Equipo ${i+1}<input id="n${i}" data-name="${i}" value="${esc(S.names[i]||"")}" placeholder="Equipo ${i+1}" maxlength="24"></label>`).join("");
  const auto=S.count>CASES.length;
  return `<div class="scene-head"><div><h2>¿Cuántos equipos se formaron?</h2><p class="lead">Ajusta el número y, si quieren, escriban un nombre para cada equipo. Hay ${CASES.length} casos disponibles.</p></div></div>

    <div class="panel">
      <h3>Número de equipos</h3>
      <div class="counter"><button type="button" data-count="-1" aria-label="Quitar un equipo">−</button><output id="count" aria-live="polite">${S.count}</output><button type="button" data-count="1" aria-label="Agregar un equipo">+</button></div>
      <label class="check" for="rep"><input type="checkbox" id="rep" ${S.allowRepeat||auto?"checked":""} ${auto?"disabled":""}><span>Permitir que dos equipos tengan el mismo caso<br><span class="note">${auto?"Se activa sola porque hay más equipos que casos.":"Útil para contrastar decisiones en la socialización."}</span></span></label>
    </div>
    <div class="panel"><h3>Nombres (opcional)</h3><div class="names">${inputs}</div></div>
  </div>`;
}

/* paso 2 */
let lastIdx=null;
function s2(){
  const t=nextTurn(); const done=t>=S.count; const rep=S.allowRepeat||S.count>CASES.length;
  const takenBy={}; S.picks.forEach((p,i)=>{if(p!==null)(takenBy[p]=takenBy[p]||[]).push(i)});
  const cards=CASES.map((c,i)=>{
    const who=takenBy[i]; const taken=!!who; const flipped=S.flipped===i;
    const disabled=done||(taken&&!rep)||S.flipped!==null;
    return `<button type="button" class="card ${flipped?'flipped':''} ${taken&&!flipped?'taken':''}" data-card="${i}" ${disabled?'disabled':''} aria-label="${flipped||taken?esc(c.t):'Card '+(i+1)+' boca abajo'}">
      <div class="card-inner">
        <div class="face front"><span class="num">Card ${i+1}</span><span class="q">${taken?'✓':'?'}</span><span class="num">${taken?esc(who.map(teamName).join(', ')):'Toca para elegir'}</span></div>
        <div class="face back"><span class="num">Caso ${i+1}</span><h3>${esc(c.t)}</h3><p>${esc(c.short)}</p>${who?`<span class="who">${esc(who.map(teamName).join(' · '))}</span>`:''}</div>
      </div></button>`}).join("");
  const chips=Array.from({length:S.count},(_,i)=>`<span class="chip ${S.picks[i]!==null?'on':''}">${esc(teamName(i))}${S.picks[i]!==null?' · Caso '+(S.picks[i]+1):''}</span>`).join("");
  let bar;
  if(done) bar=`<p>Todos los equipos tienen caso. <strong>Pasemos a la elección inicial.</strong></p>`;
  else if(S.flipped!==null) bar=`<p><strong>${esc(teamName(lastIdx??0))}</strong> eligió: ${esc(CASES[S.flipped].t)}</p><button class="btn on-dark primary" type="button" id="cont">Siguiente equipo →</button>`;
  else bar=`<p>Turno de <strong>${esc(teamName(t))}</strong>: pasa un integrante y toca una card.</p><div class="turn-actions"><button class="btn small on-dark" type="button" id="rand">Asignar al azar a los que faltan</button>${S.picks.some(p=>p!==null)?'<button class="btn small on-dark" type="button" id="undo">Deshacer la última</button>':''}</div>`;
  return `<div class="turn">${bar}</div><div class="deck">${cards}</div><div class="picks" aria-label="Estado de los equipos">${chips}</div>`;
}

/* paso 3 */
function s3(){
  const rows=Array.from({length:S.count},(_,i)=>{
    const c=CASES[S.picks[i]];
    return `<article class="row"><div class="rowtop"><span class="team">${esc(teamName(i))}</span><span class="chip">Caso ${S.picks[i]+1}</span></div><h3>${esc(c.t)}</h3><p class="sit">${esc(S.full?c.s:c.short)}</p>
    ${S.full?`<ol>${c.o.map((o,k)=>`<li><b>${L[k]}</b><span>${esc(o)}</span></li>`).join("")}</ol>`:''}</article>`}).join("");

  <div class="summary">${rows}</div>`;
}

/* paso 4 */
function s4(){
  const roles=[["M","Moderador/a","Lleva el tiempo, da la palabra y asegura que todos opinen."],["R","Relator/a","Registra la decisión y expone en la socialización."],["D","Abogado/a del diablo","Defiende la opción que el equipo está descartando."],["V","Verificador/a","Separa hechos de supuestos y pregunta qué información falta."]];

    <div class="decide-grid">${Array.from({length:S.count},(_,i)=>{const c=CASES[S.picks[i]];return `<div class="drow"><div class="dname"><span class="team">${esc(teamName(i))}</span><b>${esc(c.t)}</b></div>${seg("data-init",i,S.init[i],L5.split(""))}</div>`}).join("")}</div></section>`

  ${S.decide?decide:''}
  <div class="timer" id="workBox"><div class="phase" id="workPhase"></div><div class="clock" id="workClock">9:00</div><div class="ctrl"><button class="btn primary" type="button" id="workGo">Iniciar</button><button class="btn" type="button" id="workReset">Reiniciar</button></div><div class="bar"><i id="workBar"></i></div></div>
  <div class="guide">
    <div class="roles">${roles.map(r=>`<div class="role"><span class="ico" aria-hidden="true">${r[0]}</span><h3>${r[1]}</h3><p>${r[2]}</p></div>`).join("")}<p class="extra">¿Equipo de 5? El quinto integrante es <b>estratega de marca</b>: evalúa qué dice la decisión de cada uno como profesional.</p></div>
    <ol class="steps-list">${guide.map(g=>`<li><span><b>${g[0]}</b>${g[1]}</span></li>`).join("")}</ol>

function paintWork(t){

after[3]=()=>{if(!timers.work)makeTimer("work",T_ANALYSIS,paintWork,workEnd);else{timers.work.onTick=paintWork;timers.work.onEnd=workEnd;paintWork(timers.work)}};

/* paso 5 */
function s5(){
  const cards=Array.from({length:S.count},(_,i)=>{
    const c=CASES[S.picks[i]]; const on=S.twists[i]; const ini=S.init[i]; const aft=S.after[i];

    return `<article class="twist"><div class="rowtop"><span class="team">${esc(teamName(i))}</span><span class="chip">Caso ${S.picks[i]+1}</span></div><h3 style="font-size:24px">${esc(c.t)}</h3>
    <p class="initial">Respuesta inicial: <b>${has(ini)?esc(optText(c,ini)):"sin registrar"}</b></p>

      <div class="choose"><span>¿Mantienen o cambian?</span><div class="keeprow">${has(ini)?`<button type="button" class="btn small keepbtn" data-keep="${i}" aria-pressed="${has(aft)&&aft===ini}">Mantener ${L5[ini]}</button>`:''}${seg("data-after",i,aft,L5.split(""))}</div></div>${status}`
      :`<button class="btn primary" type="button" data-twist="${i}">Revelar giro</button>`}</article>`}).join("");
  return `<div class="scene-head"><div><h2>Llegó el giro</h2><p class="lead">Revela el dato nuevo de cada equipo. Con él, cada equipo decide si mantiene su respuesta o la cambia. Tienen 5 minutos.</p></div><button class="btn dark" type="button" id="revealAll">Revelar todos</button></div>
  <div class="timer" id="postBox"><div class="phase" id="postPhase"></div><div class="clock" id="postClock">5:00</div><div class="ctrl"><button class="btn primary" type="button" id="postGo">Iniciar</button><button class="btn" type="button" id="postReset">Reiniciar</button></div><div class="bar"><i id="postBar"></i></div></div>

/* paso 6 */
function s6(){
  const i=Math.min(S.soc,S.count-1); const c=CASES[S.picks[i]]; const m=S.matrix[i]||{};

  const rows=Array.from({length:S.count},(_,k)=>{const mm=S.matrix[k]||{};const pk=popular(k);const a=afterOf(k);const ch=has(S.init[k])&&has(a)&&a!==S.init[k];
    return `<tr class="${S.fbOpen===k?'open':''}"><td><b>${esc(teamName(k))}</b></td><td>${esc(CASES[S.picks[k]].t)}</td><td class="v">${has(S.init[k])?L5[S.init[k]]:"·"}</td><td class="v ${ch?'chg':''}">${has(a)?L5[a]+(ch?" ↺":""):"·"}</td><td class="v">${pk.one!==null?`${L5[pk.one]} <small>${pk.a[pk.one]}/${pk.tot}</small>`:pk.tot?"Empate":"·"}</td>${LENSES.map(([id])=>{const v=mm[id];return `<td class="v ${v||''}">${v==="si"?"Sí":v==="no"?"No":v==="dep"?"Depende":"·"}</td>`}).join("")}<td><button class="btn small" type="button" data-fbteam="${k}">${S.fbOpen===k?"Ocultar":"Ver"}</button></td></tr>`}).join("");
  return `<div class="scene-head"><div><h2>Socialización</h2><p class="lead">Por equipo: primero vota la clase, luego se revela la decisión del equipo, expone y se llena la matriz.</p></div><div class="teamnav" aria-label="Equipo que expone">${nav}</div></div>
  <div class="social">

    </div>
    <div class="matrix"><h3 style="font-size:24px">Matriz de cinco lentes del equipo</h3>${lenses}<p class="note">“Depende” obliga a nombrar la información que falta.</p><button class="btn primary" type="button" data-fbteam="${i}">${S.fbOpen===i?"Ocultar retroalimentación":"Ver retroalimentación del caso"}</button></div>
  </div>
  ${S.fbOpen===i?fbCard(i):""}
  <div class="scene-head"><div><h3 style="font-size:26px">Resumen comparado</h3><p class="lead" style="font-size:17px">Respuesta inicial, respuesta tras el giro y voto popular de cada caso. Toca “Ver” para la retroalimentación por lente.</p></div></div>

  ${has(S.fbOpen)&&S.fbOpen!==i&&S.fbOpen<S.count?fbCard(S.fbOpen):""}`;
}
const VAL={si:"Sí",no:"No",dep:"Depende"};
function fbCard(k){
  const c=CASES[S.picks[k]]; const m=S.matrix[k]||{};
  const P=popular(k);
  const three=[["Inicial",S.init[k]],["Tras el giro",afterOf(k)],["Voto popular",P.one]];
  const hits=v=>has(v)?LENSES.filter(([id])=>c.fb[id][0]===v).length:null;
  const top=three.map(([n,v])=>`<div class="cmp"><small>${n}</small><b>${has(v)?esc(optText(c,v)):(n==="Voto popular"&&P.tot?"Empate":"Sin registrar")}</b>${has(v)?`<span>${hits(v)} de 5 lentes la señalan como la mejor</span>`:''}</div>`).join("");
  const cards=LENSES.map(([id,n])=>{const [b,why]=c.fb[id];
    const tags=three.filter(([,v])=>has(v)&&v===b).map(([nm])=>`<span class="fbtag ok">${nm} ✓</span>`).join("");
    return `<article class="fbl ${tags?'ok':''}"><span class="fbn">${n}</span><p class="fbbest">Mejor opción: <b>${L[b]}</b></p><p class="fbopt">${esc(c.o[b])}</p><p class="fbwhy">${esc(why)}</p><div class="fbtags">${tags}${m[id]?`<span class="fbtag">Matriz del equipo: ${VAL[m[id]]}</span>`:''}</div></article>`}).join("");
  return `<section class="fb" id="fbPanel" aria-label="Retroalimentación">
    <div><span class="team">Retroalimentación · ${esc(teamName(k))} · Caso ${S.picks[k]+1}</span><h3>${esc(c.t)}</h3></div>
    <div class="cmps">${top}</div>
    <div class="fbgrid">${cards}</div>
    <p class="fbgiro"><b>Con el giro</b>${esc(c.gn)}</p>
    <p class="note">No hay una única respuesta correcta: cada lente puede señalar una opción distinta. Lo importante es que cada decisión se pueda argumentar.</p>
  </section>`;
}
function paintMini(id){return t=>{const c=$("#"+id+"Clock");if(!c)return;c.textContent=mmss(t.left);const b=document.querySelector(`[data-t="${id}"]`);if(b)b.textContent=t.running?"Pausar":(t.left===0?"Tiempo":(t.left===t.total?(id==="vote"?"Iniciar voto":"Iniciar exposición"):"Continuar"));$("#"+id+"Box").classList.toggle("alert",t.left<=10)}}
after[5]=()=>{makeTimer("vote",15,paintMini("vote"));makeTimer("talk",90,paintMini("talk"))};

/* ---------- eventos ---------- */
const pair=s=>s.split(":").map(Number);
document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]"); if(go){const n=+go.dataset.go;S.step=(n>1&&!allPicked())?1:n;S.flipped=null;render();return}
  const cnt=e.target.closest("[data-count]"); if(cnt){S.count=Math.max(2,Math.min(24,S.count+ +cnt.dataset.count));S.picks=S.picks.slice(0,S.count);render();return}
  const card=e.target.closest("[data-card]"); if(card&&!card.disabled){const i=+card.dataset.card;const t=nextTurn();if(t<S.count){S.picks[t]=i;lastIdx=t;S.flipped=i;render()}return}
  if(e.target.closest("#cont")){S.flipped=null;render();return}
  if(e.target.closest("#undo")){let k=-1;for(let j=S.count-1;j>=0;j--)if(S.picks[j]!==null){k=j;break}if(k>=0)S.picks[k]=null;S.flipped=null;render();return}
  if(e.target.closest("#rand")){const rep=S.allowRepeat||S.count>CASES.length;for(let t=0;t<S.count;t++){if(S.picks[t]!==null)continue;const used=S.picks.filter(p=>p!==null);let pool=CASES.map((_,i)=>i).filter(i=>!used.includes(i));if(!pool.length&&rep)pool=CASES.map((_,i)=>i);if(!pool.length)break;S.picks[t]=pool[Math.floor(Math.random()*pool.length)]}S.flipped=null;render();return}
  if(e.target.closest("#openDecide")){S.decide=true;render();const d=document.getElementById("decide");if(d)d.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(e.target.closest("#toggleFull")){S.full=!S.full;render();return}
  const ini=e.target.closest("[data-init]"); if(ini){const [k,v]=pair(ini.dataset.init);S.init[k]=S.init[k]===v?null:v;render();return}
  const tw=e.target.closest("[data-twist]"); if(tw){S.twists[+tw.dataset.twist]=true;render();return}
  if(e.target.closest("#revealAll")){for(let i=0;i<S.count;i++)S.twists[i]=true;render();return}
  const kp=e.target.closest("[data-keep]"); if(kp){const k=+kp.dataset.keep;S.after[k]=S.init[k];render();return}
  const af=e.target.closest("[data-after]"); if(af){const [k,v]=pair(af.dataset.after);S.after[k]=S.after[k]===v?null:v;render();return}
  const so=e.target.closest("[data-soc]"); if(so){S.soc=+so.dataset.soc;render();return}
  const pp=e.target.closest("[data-pop]"); if(pp){const [k,v,d]=pair(pp.dataset.pop);keepMini(()=>{const a=S.pop[k]=S.pop[k]||[0,0,0,0];a[v]=Math.max(0,a[v]+d)});return}
  const sh=e.target.closest("[data-show]"); if(sh){keepMini(()=>{S.shown[+sh.dataset.show]=true});return}
  const fbt=e.target.closest("[data-fbteam]"); if(fbt){const k=+fbt.dataset.fbteam;keepMini(()=>{S.fbOpen=S.fbOpen===k?null:k});const el=document.getElementById("fbPanel");if(el&&has(S.fbOpen))el.scrollIntoView({behavior:"smooth",block:"start"});return}
  const ln=e.target.closest("[data-lens]"); if(ln){const i=Math.min(S.soc,S.count-1);keepMini(()=>{S.matrix[i]=S.matrix[i]||{};const cur=S.matrix[i][ln.dataset.lens];S.matrix[i][ln.dataset.lens]=cur===ln.dataset.val?null:ln.dataset.val});return}
  const tb=e.target.closest("[data-t]"); if(tb){toggleTimer(tb.dataset.t);return}
  if(e.target.closest("#workGo")){toggleTimer("work");return}
  if(e.target.closest("#workReset")){makeTimer("work",T_ANALYSIS,paintWork,workEnd);return}
  if(e.target.closest("#postGo")){toggleTimer("post");return}
  if(e.target.closest("#postReset")){makeTimer("post",T_AFTER,paintPost);return}
});
document.addEventListener("input",e=>{if(e.target.dataset.name!==undefined){S.names[+e.target.dataset.name]=e.target.value;save()}});
document.addEventListener("change",e=>{
  if(e.target.id==="rep"){S.allowRepeat=e.target.checked;save();return}
  const pi=e.target.dataset&&e.target.dataset.popin; if(pi){const [k,v]=pair(pi);const n=Math.max(0,Math.min(999,parseInt(e.target.value,10)||0));keepMini(()=>{const a=S.pop[k]=S.pop[k]||[0,0,0,0];a[v]=n})}
});
document.addEventListener("focusin",e=>{if(e.target.dataset&&e.target.dataset.popin)e.target.select()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.popin)e.target.blur()});
$("#prev").onclick=()=>{if(S.step>0){S.step--;S.flipped=null;render()}};
$("#next").onclick=()=>{if(S.step<STEPS.length-1){if(S.step===1&&!allPicked())return;S.step++;S.flipped=null;render();window.scrollTo(0,0)}};
let armed=false;
$("#reset").onclick=()=>{const b=$("#reset");if(!armed){armed=true;b.textContent="Toca otra vez para borrar todo";b.classList.add("primary");setTimeout(()=>{armed=false;b.textContent="Reiniciar actividad";b.classList.remove("primary")},3000);return}armed=false;b.textContent="Reiniciar actividad";b.classList.remove("primary");Object.keys(timers).forEach(stopTimer);S=fresh();render()};
$("#fs").onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{$("#fs").textContent="No disponible aquí"})}catch(e){$("#fs").textContent="No disponible aquí"}};
render();
</script>

</body></html>
