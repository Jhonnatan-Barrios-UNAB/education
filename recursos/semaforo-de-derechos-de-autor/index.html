<style>
/* Tablero de competencia proyectado: barra superior navy con fases, área de trabajo amplia y riel derecho con la clasificación en vivo. */
:root{
  --navy:#172B5B; --blue:#2456A6; --violet:#4330BC; --cyan:#00A9D6;
  --ink:#334155; --muted:#64748B; --bg:#FFFFFF; --surface:#F5F7FB; --line:#DCE3EE; --lav:#ECE9FB; --sky:#E3F4FA;
  --ok:#17875A; --ok-bg:#E3F5EC; --warn:#A86F00; --warn-bg:#FFF4D6; --bad:#C2264B; --bad-bg:#FCE8EE;
  --f-display:'Manrope', 'Segoe UI', Arial, sans-serif;
  --f-body:'Source Sans 3', 'Segoe UI', Arial, sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);color:var(--navy);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.app{min-height:100%;display:flex;flex-direction:column}
.top{background:linear-gradient(120deg,var(--navy) 0%,#1F3F86 60%,var(--violet) 100%);color:#fff;position:relative;overflow:hidden}
.top-in{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top svg.net{position:absolute;right:0;top:0;height:100%;width:420px;opacity:.55;pointer-events:none}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#7FD8F0;font-weight:600}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.phases{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.phase{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.phase i{font-style:normal;font-variant-numeric:tabular-nums;color:#7FD8F0;font-size:13px}
.phase[aria-current="step"]{background:#fff;color:var(--navy);border-color:#fff}
.phase[aria-current="step"] i{color:var(--blue)}
.timer{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.18);border-radius:12px;padding:6px 8px}
.timer .t{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.timer.low .t{color:#FFB3C4}
.timer.done .t{color:#FFB3C4;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:5px 9px;font-size:14px;font-weight:600}
.tbtn:hover{background:rgba(255,255,255,.26)}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding-block:24px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:start}
@media (max-width:1100px){.body{grid-template-columns:minmax(0,1fr)}}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.rail h2{font-size:18px}
.rail .mini{display:flex;flex-direction:column;gap:6px}
.mini-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:16px}
.mini-row .pos{font-family:var(--f-display);font-weight:800;color:var(--muted);text-align:center}
.mini-row:nth-child(1) .pos{color:var(--violet)}
.mini-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--navy)}
.mini-row .pt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue)}
.eyebrow{font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);font-weight:700}
.lead{font-size:20px;color:var(--ink);max-width:70ch}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:10px 16px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--navy)}
.btn.violet{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#F1C6D6}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:15px;border-radius:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;color:var(--navy);font-size:16px}
.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;width:100%}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.names input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:16px;color:var(--navy);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.okc[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chip.vc[aria-pressed="true"]{background:var(--violet);border-color:var(--violet)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;background:var(--lav);color:var(--violet)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{border:0;background:var(--surface);width:38px;height:38px;font-size:22px;font-weight:700;color:var(--navy)}
.stepper button:hover{background:var(--line)}
.stepper span{min-width:44px;text-align:center;font-weight:800;font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--navy)}
table.score{width:100%;border-collapse:collapse;font-size:17px}
table.score th{text-align:left;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
table.score td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.score td.num{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.tablewrap{overflow-x:auto}
/* Clasificación */
.board{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:56px minmax(0,1.2fr) minmax(0,2fr) 90px 80px;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.brow.top1{border-color:var(--violet);box-shadow:0 0 0 2px var(--lav)}
.brow .rk{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--muted);text-align:center}
.brow.top1 .rk{color:var(--violet)}.brow.top2 .rk{color:var(--blue)}.brow.top3 .rk{color:var(--cyan)}
.brow .nm{font-family:var(--f-display);font-weight:800;color:var(--navy);font-size:20px;min-width:0;overflow-wrap:anywhere}
.brow .bd{font-size:14px;color:var(--muted);margin-top:2px}
.bar{height:14px;border-radius:999px;background:var(--surface);overflow:hidden}
.bar b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .5s ease}
.brow .pts{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--blue);text-align:right;font-variant-numeric:tabular-nums}
.brow .nota{font-family:var(--f-display);font-weight:800;font-size:22px;text-align:center;background:var(--lav);color:var(--violet);border-radius:10px;padding:6px 0;font-variant-numeric:tabular-nums}
@media (max-width:700px){.brow{grid-template-columns:40px minmax(0,1fr) 64px 60px}.brow .barcell{display:none}}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
.pod{border-radius:14px;padding:16px;text-align:center;color:#fff;display:flex;flex-direction:column;gap:4px}
.pod b{font-family:var(--f-display);font-size:22px;overflow-wrap:anywhere}
.pod span{font-size:15px;opacity:.85}
.pod.p1{background:var(--violet);min-height:190px;justify-content:flex-end}
.pod.p2{background:var(--blue);min-height:150px;justify-content:flex-end}
.pod.p3{background:var(--navy);min-height:120px;justify-content:flex-end}
.pod .big{font-family:var(--f-display);font-weight:800;font-size:34px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(23,43,91,.3);z-index:50}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bad-bg);border:1px solid #F1C6D6;border-radius:12px;padding:12px 16px}
.note{font-size:16px;color:var(--muted)}
.big-count{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums;text-align:center}
textarea.copy{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){.mgrid{grid-template-columns:minmax(0,1fr)!important}}

</style>

<script>
(function(){

};
var ORDER = ['verde', 'amarillo', 'rojo'];

var SITUACIONES = [
  { t: 'Descargas una fotografía de un buscador y la pones en tu presentación de clase sin citar al autor ni la fuente.', c: 'rojo', e: 'No conocemos su licencia y, además, se omite la autoría. Encontrar una imagen no es tener permiso: hay que buscar el origen, revisar la licencia y citar. Si nada lo permite, se usa otra imagen.' },
  { t: 'Usas una fotografía con licencia CC BY en tu presentación y la atribuyes con título, autor, fuente y licencia.', c: 'verde', e: 'CC BY permite compartir y adaptar la obra, incluso con fines comerciales, siempre que se reconozca la autoría.' },
  { t: 'Un blog dice que una imagen es "libre de derechos", pero no indica autor ni licencia. La quieres para un trabajo que vas a publicar.', c: 'amarillo', e: 'Falta información. "Libre de derechos" no es una licencia. Busca el origen (por ejemplo, con búsqueda inversa de imágenes) y la licencia real antes de usarla.' },
  { t: 'Modificas una imagen CC BY-ND (le cambias los colores y le agregas texto) y publicas la versión modificada en redes.', c: 'rojo', e: 'ND significa sin obras derivadas: se puede compartir la obra original con atribución, pero no publicar una versión modificada.' },
  { t: 'Descargas un grabado marcado como dominio público en el repositorio de una biblioteca reconocida y lo usas en un afiche.', c: 'verde', e: 'Las obras en dominio público se pueden usar libremente. Verifica que la fuente sea confiable y cita la procedencia como buena práctica.' },
  { t: 'Usas una ilustración CC BY-NC en una campaña publicitaria para una empresa.', c: 'rojo', e: 'NC excluye los usos comerciales bajo esa licencia. Para una campaña habría que pedir permiso al autor o buscar otro recurso.' },
  { t: 'Creas una imagen con una herramienta de inteligencia artificial cuyos términos de uso no has leído y la quieres usar en la campaña de un cliente.', c: 'amarillo', e: 'Hay que revisar condiciones: cada herramienta define en sus términos si permite el uso comercial y quién puede usar los resultados.' },
  { t: 'Compartes con tus compañeros un recurso educativo abierto con licencia CC BY-SA, con su atribución y la misma licencia.', c: 'verde', e: 'Los REA existen para reutilizarse. Respetar la atribución y la licencia es justamente lo que la licencia pide.' },
  { t: 'Pones de fondo una canción comercial en un video institucional que se publicará en redes.', c: 'rojo', e: 'Sin licencia o permiso del titular no está autorizado. Citar al artista no lo resuelve: se necesita música con licencia que permita ese uso.' },
  { t: 'Usas una fotografía CC0 en un afiche comercial sin mencionar al autor.', c: 'verde', e: 'Con CC0 el titular renunció a sus derechos en la medida que permite la ley. La atribución no es obligatoria, aunque sigue siendo una buena práctica.' },
  { t: 'Adaptas una infografía CC BY-SA y publicas tu versión con licencia CC BY-NC.', c: 'rojo', e: 'SA (compartir igual) exige que las adaptaciones se publiquen con la misma licencia o una compatible. Cambiarla a BY-NC no está permitido.' },
  { t: 'Una imagen tiene licencia CC BY-NC y la quieres usar en el video del semillero, que se publica en un canal de YouTube monetizado.', c: 'amarillo', e: 'Hay que revisar condiciones: la monetización puede convertir el uso en comercial. Lo prudente es pedir permiso al autor o elegir un recurso CC BY.' },
  { t: 'Citas en tu ensayo un fragmento breve de un libro, entre comillas y con referencia en APA.', c: 'verde', e: 'La cita breve con fines académicos y con reconocimiento de autoría es un uso aceptado. Es distinto de reproducir la obra completa.' },
  { t: 'Usas una canción famosa en un video para la cuenta de una marca y en la descripción das crédito al artista.', c: 'rojo', e: 'Dar crédito no reemplaza la autorización. Es posible atribuir correctamente y aun así usar la obra de una forma no permitida.' },
  { t: 'Adaptas una ilustración CC BY-NC-SA para el afiche de un evento académico gratuito y la compartes con la misma licencia y la atribución.', c: 'verde', e: 'Se cumplen las tres condiciones: reconocimiento (BY), uso no comercial (NC) y misma licencia para la adaptación (SA).' }
];

var RECURSOS = [
  { n: 'Atardecer en el cañón', tipo: 'Fotografía', autor: 'Lucía Prada', lic: 'CC BY 4.0' },
  { n: 'Cerebro en red', tipo: 'Ilustración', autor: 'Estudio Nodo', lic: 'CC BY-NC 4.0' },
  { n: 'Reciclar en casa', tipo: 'Infografía', autor: 'Colectivo Verde', lic: 'CC BY-ND 4.0' },
  { n: 'Ritmo de ciudad', tipo: 'Canción', autor: 'Sello Sonar Records', lic: 'Todos los derechos reservados' },
  { n: 'Mapa antiguo de la Nueva Granada', tipo: 'Grabado del siglo XIX', autor: 'Anónimo', lic: 'Dominio público (marcado en el repositorio de una biblioteca)' },
  { n: 'El ciclo del agua', tipo: 'Diagrama', autor: 'Andrés Gil', lic: 'CC BY-SA 4.0' },
  { n: 'Personaje con audífonos', tipo: 'Ilustración encontrada en Pinterest', autor: 'Desconocido', lic: 'Sin licencia visible' }
];

var V = 'verde', Y = 'amarillo', R = 'rojo';
var TXT = {
  byOk: 'Se puede usar con atribución (título, autor, fuente y licencia) e indicando si se modificó.',
  ncOk: 'Uso no comercial: se puede usar con atribución.',
  ncNo: 'Es un uso comercial y NC lo excluye. Habría que pedir permiso al autor.',
  ndNo: 'La misión adapta los recursos y ND no permite compartir versiones modificadas.',
  ndOk: 'Se proyecta sin modificar y con atribución: ND lo permite.',
  musNo: 'Sin licencia ni permiso del titular, no se puede incluir en una pieza que se publica.',
  musClase: 'Reproducirla en clase puede estar cubierto por excepciones educativas según la ley de cada país. Verifica y, si puedes, usa música con licencia abierta.',
  dp: 'Dominio público: uso libre. Citar la procedencia sigue siendo buena práctica.',
  saOk: 'Se puede adaptar con atribución, siempre que la adaptación se comparta con CC BY-SA.',
  saRev: 'El uso comercial está permitido, pero la adaptación tendría que publicarse con CC BY-SA. Revisa si quien encarga la pieza acepta esa condición.',
  unk: 'Sin autor ni licencia no hay permiso demostrado. Busca el origen y la licencia; si no las encuentras, no la uses.'
};
var MISIONES = [
  { n: 'Infografía académica', uso: 'Se recortan y combinan los recursos con texto propio. Se publica en el aula virtual del curso, sin fines comerciales.',
    r: [[V, TXT.byOk], [V, TXT.ncOk], [R, TXT.ndNo], [R, TXT.musNo], [V, TXT.dp], [V, TXT.saOk], [Y, TXT.unk]] },
  { n: 'Video educativo del semillero', uso: 'Se editan y combinan los recursos. Se publica en el canal de YouTube del semillero, que no está monetizado.',
    r: [[V, TXT.byOk], [V, TXT.ncOk], [R, TXT.ndNo], [R, TXT.musNo], [V, TXT.dp], [V, TXT.saOk], [Y, TXT.unk]] },
  { n: 'Campaña digital para una empresa', uso: 'Piezas para redes y pauta pagada. Los recursos se adaptan al estilo de la marca.',
    r: [[V, TXT.byOk], [R, TXT.ncNo], [R, TXT.ndNo], [R, TXT.musNo], [V, TXT.dp], [Y, TXT.saRev], [Y, TXT.unk]] },
  { n: 'Presentación en clase', uso: 'Se proyecta en el aula. Los recursos se usan sin modificarlos y la presentación no se publica.',
    r: [[V, TXT.byOk], [V, TXT.ncOk], [V, TXT.ndOk], [Y, TXT.musClase], [V, TXT.dp], [V, 'Se puede usar con atribución y la licencia indicada.'], [Y, TXT.unk]] },
  { n: 'Pieza para el emprendimiento de un amigo', uso: 'Publicación en redes para promocionar sus productos. Los recursos se adaptan.',
    r: [[V, TXT.byOk], [R, TXT.ncNo], [R, TXT.ndNo], [R, TXT.musNo], [V, TXT.dp], [Y, TXT.saRev], [Y, TXT.unk]] }
];

var h = function(){ return App.h.apply(null, arguments); };
function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function sortearMisiones(s){
  var pool = [];
  var order = shuffle(s.teams.map(function(t){ return t.id; }));
  var asg = {};
  order.forEach(function(id, i){ if (i % MISIONES.length === 0) pool = shuffle(MISIONES.map(function(_, k){ return k; })); asg[id] = pool[i % MISIONES.length]; });
  s.data.mis = asg;
  s.data.mview = asg[s.teams[0].id];
}
function misInPlay(s){ var u = {}; Object.keys(s.data.mis).forEach(function(k){ u[s.data.mis[k]] = true; }); return Object.keys(u).map(Number).sort(function(a, b){ return a - b; }); }
function teamsOf(s, mi){ return s.teams.filter(function(t){ return s.data.mis[t.id] === mi; }); }

  return h('span', { style: 'display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:800;font-family:var(--f-display);background:' + k.bg + ';color:' + k.fg + ';padding:' + (big ? '8px 18px;font-size:24px' : '3px 12px;font-size:15px') },

}
function colorPicker(cur, onPick, name){
  return h('span', { role: 'group', 'aria-label': 'Tarjeta de ' + name, style: 'display:inline-flex;gap:6px' }, ORDER.map(function(c){

}


function wrapT(ctx, text, maxW){ var words = String(text).split(/\s+/), out = [], line = ''; words.forEach(function(w){ var t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; }); if (line) out.push(line); return out; }

function boardCanvas(rows, ref){
  var W = 1800, pad = 60, DF = 'Manrope, "Segoe UI", Arial, sans-serif', BF = '"Source Sans 3", "Segoe UI", Arial, sans-serif';
  var c = document.createElement('canvas'), ctx = c.getContext('2d');
  var colRank = pad + 20, colName = pad + 110, colMem = pad + 520, colPts = W - pad - 300, colNota = W - pad - 120, memW = colPts - colMem - 40;
  ctx.font = '22px ' + BF;
  var items = rows.map(function(r){ var ml = wrapT(ctx, r.members.length ? r.members.join(' · ') : 'Sin integrantes registrados', memW); var nl = wrapT(ctx, r.name, colMem - colName - 30); return { r: r, ml: ml, nl: nl, h: Math.max(84, 36 + Math.max(ml.length, nl.length) * 30) }; });

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 170);
  ctx.strokeStyle = 'rgba(0,169,214,.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W, 30); ctx.lineTo(W - 220, 70); ctx.lineTo(W - 360, 40); ctx.lineTo(W - 470, 110); ctx.lineTo(W - 300, 140); ctx.stroke();
  ctx.fillStyle = '#7FD8F0'; ctx.font = '600 22px ' + BF; ctx.fillText(A.course.toUpperCase(), pad, 62);
  ctx.fillStyle = '#FFFFFF'; ctx.font = '800 48px ' + DF; ctx.fillText(A.title + ' · Tabla de posiciones', pad, 120);
  ctx.fillStyle = '#334155'; ctx.font = '22px ' + BF;
  ctx.fillText(new Date().toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' }) + ' · Nota sobre ' + fmt(S.settings.notaMax, 1) + ' · Referencia: ' + (S.settings.ref === 'fixed' ? fmt(ref) + ' puntos' : 'primer lugar'), pad, headH - 4);
  var y = headH + 40;
  ctx.fillStyle = '#64748B'; ctx.font = '700 18px ' + BF;
  ctx.fillText('POSICIÓN', colRank - 20, y); ctx.fillText(A.unit.toUpperCase(), colName, y); ctx.fillText('INTEGRANTES', colMem, y); ctx.fillText('PUNTOS', colPts, y); ctx.fillText('NOTA', colNota, y);
  y += 16;
  items.forEach(function(it){
    var r = it.r, top = r.rank === 1, col = r.rank === 1 ? '#4330BC' : r.rank === 2 ? '#2456A6' : r.rank === 3 ? '#00A9D6' : '#94A3B8';
    ctx.fillStyle = top ? '#ECE9FB' : '#F5F7FB'; rrect(ctx, pad, y, W - pad * 2, it.h, 14); ctx.fill();
    ctx.fillStyle = col; rrect(ctx, pad, y, 8, it.h, 4); ctx.fill();
    var mid = y + it.h / 2;
    ctx.fillStyle = col; ctx.font = '800 38px ' + DF; ctx.fillText(String(r.rank), colRank, mid + 13);
    ctx.fillStyle = '#172B5B'; ctx.font = '800 26px ' + DF; it.nl.forEach(function(l, k){ ctx.fillText(l, colName, y + 46 + k * 30); });
    ctx.fillStyle = '#334155'; ctx.font = '22px ' + BF; it.ml.forEach(function(l, k){ ctx.fillText(l, colMem, y + 44 + k * 30); });
    ctx.fillStyle = '#2456A6'; ctx.font = '800 32px ' + DF; ctx.fillText(fmt(r.total), colPts, mid + 11);
    ctx.fillStyle = '#4330BC'; ctx.font = '800 32px ' + DF; ctx.fillText(fmt(nota(r.total, ref), 1), colNota, mid + 11);

}
function downloadBoard(rows, ref){

    var c = boardCanvas(rows, ref);

      var fname = 'tabla-' + A.key.replace(/^id-/, '').replace(/-v\d+$/, '') + '-' + new Date().toISOString().slice(0, 10) + '.png';
      var p = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);
      Promise.resolve(p).then(function(dl){
        if (!dl){ imgMsg = 'La descarga directa no está disponible en esta vista. Guarda la imagen desde la vista previa.'; render(); return; }
        return dl.save({ filename: fname, data: blob }).then(function(){ imgMsg = 'Imagen descargada.'; render(); toast('Imagen descargada'); }, function(err){ imgMsg = err && err.code === 'declined' ? 'Cancelaste la descarga. Puedes intentarlo de nuevo.' : 'No se pudo descargar aquí. Guarda la imagen desde la vista previa.'; render(); });
      }).catch(function(){ imgMsg = 'No se pudo descargar aquí. Guarda la imagen desde la vista previa.'; render(); });
