/* Tablero de competencia proyectado: barra superior navy con fases, área de trabajo amplia y riel derecho con la clasificación en vivo. */
:root{

  --r:14px;

}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45}

p{margin:0}
.app{min-height:100%;display:flex;flex-direction:column}
.top{background:linear-gradient(120deg,var(--navy) 0%,#1F3F86 60%,var(--violet) 100%);color:#fff;position:relative;overflow:hidden}
.top-in{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top svg.net{position:absolute;right:0;top:0;height:100%;width:420px;opacity:.55;pointer-events:none}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#7FD8F0;font-weight:600}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.phases{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.phase{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.phase i{font-style:normal;font-variant-numeric:tabular-nums;color:#7FD8F0;font-size:13px}
.phase[aria-current="step"]{background:#fff;color:var(--navy);border-color:#fff}
.phase[aria-current="step"] i{color:var(--blue)}
.timer{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.18);border-radius:12px;padding:6px 8px}
.timer .t{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.timer.low .t{color:#FFB3C4}
.timer.done .t{color:#FFB3C4;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:5px 9px;font-size:14px;font-weight:600}
.tbtn:hover{background:rgba(255,255,255,.26)}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding-block:24px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:start}
@media (max-width:1100px){.body{grid-template-columns:minmax(0,1fr)}}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.rail h2{font-size:18px}
.rail .mini{display:flex;flex-direction:column;gap:6px}
.mini-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:16px}

.mini-row:nth-child(1) .pos{color:var(--violet)}

.lead{font-size:20px;color:var(--ink);max-width:70ch}

table.score td.num{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.tablewrap{overflow-x:auto}
/* Clasificación */
.board{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:56px minmax(0,1.2fr) minmax(0,2fr) 90px 80px;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}

.brow .bd{font-size:14px;color:var(--muted);margin-top:2px}
.bar{height:14px;border-radius:999px;background:var(--surface);overflow:hidden}
.bar b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .5s ease}

textarea.copy{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:14px}

details.panel summary{list-style-position:inside}
