<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: escenario de concurso — columna principal (comodines, cronómetro, pregunta en barra hexagonal, opciones) y escalera de 5 niveles a la derecha */
:root {
  color-scheme: dark;
  --bg-0: #071331;
  --bg-1: #0b1b3f;
  --panel: #122150;
  --panel-2: #18306e;
  --indigo: #2f5bea;
  --violet: #6c4ad8;
  --deep: #1c3a8c;
  --petrol: #155e75;
  --cyan: #14b8c9;
  --cyan-soft: #5fd3e6;
  --lilac: #b9a4ff;
  --fg: #f5f7ff;
  --fg-soft: #c9d3ee;
  --fg-muted: #9faac8;
  --line: rgba(95, 211, 230, 0.5);
  --hair: rgba(199, 208, 238, 0.16);
  --ok: #5ee0a0;
  --half: #ffcf70;
  --bad: #ff8f8f;
  --ink-on-cyan: #061433;
  --font-display: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
  --font-body: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg-0);
  background-image:
    radial-gradient(1100px 620px at 50% -12%, rgba(108, 74, 216, 0.55), transparent 62%),
    radial-gradient(900px 500px at 50% 115%, rgba(20, 184, 201, 0.16), transparent 60%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 40px); padding-block: 22px 48px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--cyan-soft); outline-offset: 3px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan-soft); margin: 0 0 18px; }
.brand::before { content: ""; width: 40px; height: 3px; border-radius: 2px; background: var(--cyan); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Botones ---------- */
.btn { border-radius: 12px; padding: 12px 20px; border: 1px solid var(--hair); background: rgba(255,255,255,0.06); cursor: pointer; font-weight: 600; font-size: 15px; }
.btn:hover { background: rgba(255,255,255,0.12); }
.btn.primary { background: linear-gradient(180deg, var(--cyan-soft), var(--cyan)); color: var(--ink-on-cyan); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.warn { color: var(--half); border-color: rgba(255, 207, 112, 0.5); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; filter: none; }
.btn.lg { padding: 16px 28px; font-size: 17px; border-radius: 14px; }

/* ---------- Hexágonos estilo concurso ---------- */
.hexrow { position: relative; display: block; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
.hexrow::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); opacity: 0.55; }
.hex { display: block; position: relative; margin-inline: clamp(8px, 2.6vw, 30px); padding: 2px; background: linear-gradient(90deg, var(--cyan-soft), var(--lilac) 50%, var(--cyan-soft));
  clip-path: polygon(22px 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 22px 100%, 0 50%); }
.hex-in { clip-path: polygon(21px 0, calc(100% - 21px) 0, 100% 50%, calc(100% - 21px) 100%, 21px 100%, 0 50%);
  background: linear-gradient(180deg, #1a2f6e 0%, #0b1b3f 100%); padding: 14px 40px; display: flex; align-items: center; gap: 14px; min-height: 58px; }
.opt { cursor: pointer; }
.opt .letter { font-family: var(--font-display); font-weight: 800; color: var(--cyan-soft); min-width: 1.6em; }
.opt .txt { font-size: 16.5px; line-height: 1.35; }
.opt:hover .hex-in { background: linear-gradient(180deg, #23408f 0%, #12275a 100%); }
.opt[aria-pressed="true"] .hex { background: linear-gradient(90deg, #fff, var(--cyan-soft), #fff); }
.opt[aria-pressed="true"] .hex-in { background: linear-gradient(180deg, var(--cyan-soft) 0%, var(--cyan) 100%); color: var(--ink-on-cyan); }
.opt[aria-pressed="true"] .letter { color: var(--ink-on-cyan); }
.opt.gone { cursor: default; opacity: 0.22; }
.opt.gone .txt { visibility: hidden; }
.opt:focus-visible { outline: none; }
.opt:focus-visible .hex { background: linear-gradient(90deg, #fff, #fff); }

.qbar .hex-in { padding: 20px 46px; min-height: 96px; flex-direction: column; align-items: flex-start; gap: 6px; }
.qbar .tag { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--cyan-soft); }
.qbar .q { font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 2vw, 23px); line-height: 1.3; text-wrap: balance; margin: 0; }

/* ---------- Inicio ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(20px, 3vw, 40px); align-items: start; }
@media (max-width: 920px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.title { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 5vw, 62px); line-height: 1.02; letter-spacing: -0.02em; margin: 6px 0 12px; text-wrap: balance; }
.title em { font-style: normal; background: linear-gradient(90deg, var(--cyan-soft), var(--lilac)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { color: var(--fg-soft); font-size: 17px; max-width: 58ch; margin: 0 0 22px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.rule { background: rgba(18, 33, 80, 0.72); border: 1px solid var(--hair); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.rule h3 { margin: 0; font-family: var(--font-display); font-size: 17px; }
.rule p { margin: 0; color: var(--fg-soft); font-size: 14.5px; }
.rule .k { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan-soft); font-weight: 700; }
.timechips { display: flex; flex-direction: column; gap: 6px; }
.timechips span { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; color: var(--fg-soft); border-bottom: 1px dashed var(--hair); padding-bottom: 4px; }
.timechips b { color: var(--fg); font-variant-numeric: tabular-nums; }
.lifelist { display: flex; flex-direction: column; gap: 10px; }
.lifelist div { display: flex; gap: 12px; align-items: flex-start; }
.lifelist .mini { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--cyan-soft); display: grid; place-items: center; font: 800 11px var(--font-display); color: var(--cyan-soft); }
.lifelist .mini svg { width: 18px; height: 18px; }
.lifelist p { margin: 0; font-size: 14px; color: var(--fg-soft); }
.lifelist b { color: var(--fg); }

.card { background: rgba(18, 33, 80, 0.82); border: 1px solid var(--hair); border-radius: 20px; padding: clamp(18px, 2.4vw, 28px); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 50px rgba(3, 7, 30, 0.45); }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 22px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--fg-soft); font-weight: 500; }
input[type="text"], input[type="password"], select { font: 500 16px var(--font-body); color: var(--fg); background: rgba(255,255,255,0.07); border: 1px solid var(--hair); border-radius: 12px; padding: 13px 14px; width: 100%; }
select option { background: #122150; color: var(--fg); }
input::placeholder { color: var(--fg-muted); }
.err { color: var(--bad); font-size: 14px; margin: 0; }
.note { font-size: 13.5px; color: var(--fg-muted); margin: 0; }
.cap { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(20, 184, 201, 0.1); border: 1px solid rgba(95, 211, 230, 0.3); font-size: 14.5px; }
.cap b { font-variant-numeric: tabular-nums; }
.cap.empty { background: rgba(255, 207, 112, 0.1); border-color: rgba(255, 207, 112, 0.4); color: var(--half); }
.resume { border: 1px solid rgba(255, 207, 112, 0.45); background: rgba(255, 207, 112, 0.08); border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.resume p { margin: 0; }
.foot { display: flex; justify-content: flex-end; margin-top: 24px; }
.emblem { width: 100%; max-width: 120px; height: auto; margin-bottom: 4px; }

/* ---------- Juego ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; align-items: start; }
@media (max-width: 1000px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.player { display: flex; flex-direction: column; }
.player small { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); font-weight: 600; }
.player b { font-family: var(--font-display); font-size: 20px; }
.lifelines { display: flex; gap: 14px; }
.life { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; cursor: pointer; padding: 0; }
.life .orb { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--cyan-soft); background: radial-gradient(circle at 50% 35%, #23408f, #0b1b3f); color: var(--fg); position: relative; box-shadow: 0 0 18px rgba(95, 211, 230, 0.25); }
.life .orb svg { width: 28px; height: 28px; }
.life .orb .ff { font: 800 16px var(--font-display); letter-spacing: -0.02em; }
.life .lab { font-size: 12px; color: var(--fg-soft); font-weight: 600; }
.life:hover:not([disabled]) .orb { box-shadow: 0 0 26px rgba(95, 211, 230, 0.55); }
.life[disabled] { cursor: not-allowed; }
.life[disabled] .orb { opacity: 0.35; box-shadow: none; }
.life.used .orb::after { content: ""; position: absolute; width: 74px; height: 3px; background: var(--bad); transform: rotate(-40deg); border-radius: 2px; }
.life.used .lab::after { content: " · usado"; color: var(--bad); }

.timer { position: relative; width: 92px; height: 92px; flex: none; }
.timer svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.timer .track { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
.timer .bar { fill: none; stroke: var(--cyan-soft); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear, stroke 0.3s; }
.timer.low .bar { stroke: var(--half); }
.timer .num { position: absolute; inset: 0; display: grid; place-items: center; font: 800 28px var(--font-display); font-variant-numeric: tabular-nums; }
.timer.low .num { color: var(--half); }

.casebox { border: 1px solid rgba(185, 164, 255, 0.4); background: linear-gradient(180deg, rgba(108, 74, 216, 0.28), rgba(18, 33, 80, 0.6)); border-radius: 16px; padding: 16px 20px; }
.casebox .k { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lilac); font-weight: 700; }
.casebox h3 { margin: 2px 0 6px; font-family: var(--font-display); font-size: 19px; }
.casebox p { margin: 0; color: var(--fg-soft); font-size: 15.5px; max-width: 95ch; }
.notice { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--hair); background: rgba(255,255,255,0.05); }
.pill.cyan { border-color: rgba(95, 211, 230, 0.5); color: var(--cyan-soft); }
.pill.gold { border-color: rgba(255, 207, 112, 0.5); color: var(--half); }
.audience { display: flex; gap: 14px; align-items: center; border-radius: 14px; padding: 12px 16px; background: rgba(20, 184, 201, 0.12); border: 1px solid rgba(95, 211, 230, 0.4); }
.audience svg { width: 30px; height: 30px; flex: none; color: var(--cyan-soft); }
.audience p { margin: 0; }
.opts { display: grid; gap: 12px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 640px) { .opts.two { grid-template-columns: minmax(0, 1fr); } }
.opts.two .hex-in { justify-content: center; min-height: 72px; }
.opts.two .txt { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 4px; }
.flash { font-size: 14px; color: var(--half); min-height: 1.4em; margin: 0; }

/* Ordenar */
.order { display: flex; flex-direction: column; gap: 10px; }
.oitem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.oitem .slot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--cyan-soft); font: 800 17px var(--font-display); color: var(--cyan-soft); }
.oitem .hexrow { cursor: grab; }
.oitem .hexrow:active { cursor: grabbing; }
.oitem .hex-in { padding: 12px 38px; min-height: 54px; }
.oitem .grip { color: var(--fg-muted); flex: none; }
.oitem.drag .hex { opacity: 0.4; }
.oitem.over .hex { background: linear-gradient(90deg, #fff, var(--cyan-soft), #fff); }
.arrows { display: flex; flex-direction: column; gap: 4px; }
.arrows button { width: 38px; height: 26px; border-radius: 8px; border: 1px solid var(--hair); background: rgba(255,255,255,0.06); cursor: pointer; display: grid; place-items: center; padding: 0; }
.arrows button:hover:not([disabled]) { background: rgba(255,255,255,0.14); }
.arrows button[disabled] { opacity: 0.25; cursor: default; }
.arrows svg { width: 14px; height: 14px; }

/* Escalera */
.ladder { background: rgba(11, 27, 63, 0.85); border: 1px solid var(--hair); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.ladder h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-muted); font-weight: 700; }
.rung { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; font-size: 14px; color: var(--fg-soft); }
.rung .n { font: 800 14px var(--font-display); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.rung .pt { font-size: 12.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.rung.now { background: linear-gradient(90deg, var(--cyan-soft), var(--cyan)); color: var(--ink-on-cyan); font-weight: 700; }
.rung.now .n, .rung.now .pt { color: var(--ink-on-cyan); }
.rung.done { color: var(--fg); }
.rung.done .n::after { content: "✓"; color: var(--cyan-soft); margin-left: 2px; font-size: 11px; }
.ladder .tot { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--fg-muted); }
@media (max-width: 1000px) {
  .ladder { position: static; order: -1; flex-direction: row; flex-wrap: wrap; padding: 10px; }
  .ladder h3, .ladder .tot { display: none; }
  .rung { grid-template-columns: auto auto; padding: 6px 10px; }
  .rung .pt { display: none; }
}

/* Transición */
.veil { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 12, 32, 0.72); backdrop-filter: blur(4px); z-index: 20; padding: 16px; }
.veil .box { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.veil .big { font: 800 clamp(30px, 5vw, 52px)/1.1 var(--font-display); }
.veil .sub { color: var(--fg-soft); font-size: 17px; }
.veil .big.time { color: var(--half); }

/* ---------- Resumen ---------- */
.sumhead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 24px; }
@media (max-width: 640px) { .sumhead { grid-template-columns: minmax(0, 1fr); } }
.grade { width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 30%, #2f5bea, #0b1b3f 70%); border: 3px solid var(--cyan-soft); box-shadow: 0 0 40px rgba(95, 211, 230, 0.35); }
.grade b { display: block; font: 800 64px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.grade span { font-size: 14px; color: var(--fg-soft); }
.sumhead h2 { font-family: var(--font-display); font-size: clamp(26px, 3.4vw, 40px); margin: 4px 0 8px; line-height: 1.1; }
.sumhead p { margin: 0; color: var(--fg-soft); max-width: 62ch; }
.reviews { display: flex; flex-direction: column; gap: 14px; }
.rev { background: rgba(18, 33, 80, 0.78); border: 1px solid var(--hair); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.rev header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.rev .k { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan-soft); font-weight: 700; }
.rev h3 { margin: 0; font-family: var(--font-display); font-size: 17.5px; line-height: 1.35; }
.rev .ctx { margin: 0; font-size: 14px; color: var(--fg-muted); }
.score { font: 800 14px var(--font-display); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.score.s1 { background: rgba(94, 224, 160, 0.16); color: var(--ok); border: 1px solid rgba(94, 224, 160, 0.45); }
.score.s05 { background: rgba(255, 207, 112, 0.14); color: var(--half); border: 1px solid rgba(255, 207, 112, 0.45); }
.score.s0 { background: rgba(255, 143, 143, 0.12); color: var(--bad); border: 1px solid rgba(255, 143, 143, 0.4); }
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .cmp { grid-template-columns: minmax(0, 1fr); } }
.cmp div { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px 14px; }
.cmp small { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); font-weight: 700; margin-bottom: 4px; }
.cmp ul, .cmp ol { margin: 0; padding-left: 20px; }
.cmp li { margin: 2px 0; }
.cmp p { margin: 0; }
.why { margin: 0; padding: 12px 14px; border-radius: 12px; background: rgba(20, 184, 201, 0.09); border-left: 3px solid var(--cyan); color: var(--fg); }
.why b { color: var(--cyan-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Panel docente ---------- */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(5, 12, 32, 0.78); backdrop-filter: blur(4px); display: grid; place-items: start center; overflow-y: auto; padding: 40px 16px; }
.modal .card { width: min(820px, 100%); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 14px; }
.stat small { display: block; font-size: 12px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.stat b { font: 800 24px var(--font-display); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; border: 1px solid var(--hair); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-muted); background: rgba(255,255,255,0.03); }
td.num { font-variant-numeric: tabular-nums; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14.5px; color: var(--fg-soft); }
.check input { width: 18px; height: 18px; accent-color: var(--cyan); }
.danger { border: 1px solid rgba(255, 207, 112, 0.35); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.danger h3 { margin: 0; font-size: 16px; font-family: var(--font-display); }

@media (prefers-reduced-motion: reduce) { .timer .bar { transition: none; } .veil { backdrop-filter: none; } }
</style>

<script>
(function () {
'use strict';

/* =================== CONFIGURACIÓN =================== */
var TIME = { tf: 30, mc: 90, ord: 90 };   // segundos por tipo de pregunta
var AUDIENCE_BONUS = 30;                    // segundos extra del comodín "Pregunta al público"
var KEY_FP = 'fd0d6456-d74ecf53';           // huella de la clave de reinicio
var STORE = 'quien-quiere-mejorar-su-nota-mpd-s10-v1';


/* =================== BANCO 1: VERDADERO O FALSO (20) =================== */
var TF = [
  { id: 'tf01', q: 'El networking es el proceso de construir, mantener y fortalecer relaciones profesionales basadas en confianza, intercambio de valor y colaboración.', a: true, why: 'Es la definición de trabajo de la clase: tres verbos que implican tiempo y tres bases que implican reciprocidad.' },
  { id: 'tf02', q: 'Un contacto y una relación profesional son equivalentes cuando la otra persona ya aceptó tu solicitud en LinkedIn.', a: false, why: 'Un contacto sabe tu nombre; una relación conoce tu trabajo, tiene historia de interacción y confianza construida con evidencia.' },
  { id: 'tf03', q: 'Según Granovetter (1973), la información sobre nuevas oportunidades suele llegar por los amigos más cercanos, porque son quienes más confían en nosotros.', a: false, why: 'Granovetter mostró la fuerza de los lazos débiles: los conocidos conectan con círculos donde circula información que aún no tienes.' },
  { id: 'tf04', q: 'Rajkumar et al. (2022) encontraron, con experimentos en LinkedIn, que los vínculos moderadamente débiles fueron los que más favorecieron la movilidad laboral.', a: true, why: 'El matiz es clave: no los más débiles, sino los moderadamente débiles, con algo de interacción previa.' },
  { id: 'tf05', q: 'Para Putnam (2000), el capital social que tiende puentes conecta grupos distintos y facilita el acceso a información nueva.', a: true, why: 'Putnam distingue el capital que une (apoyo entre semejantes) del que tiende puentes (acceso a lo nuevo entre grupos distintos).' },
  { id: 'tf06', q: 'Para Burt (1992), quien conecta dos grupos que no se comunican entre sí pierde acceso a las ideas de ambos.', a: false, why: 'Es al revés: quien ocupa ese agujero estructural accede antes a ideas y oportunidades de los dos grupos.' },
  { id: 'tf07', q: 'Casciaro, Gino y Kouchaki (2014) encontraron que el networking puramente instrumental genera incomodidad moral en quienes lo practican.', a: true, why: 'Ese malestar disminuye cuando la relación se plantea desde el aprendizaje y el aporte.' },
  { id: 'tf08', q: 'La marca relacional depende principalmente de lo que la persona escribe sobre sí misma en su perfil de LinkedIn.', a: false, why: 'La marca relacional es la percepción que otros construyen a partir de sus experiencias de interacción contigo, no de tu autodescripción.' },
  { id: 'tf09', q: 'Responder y entregar en los tiempos acordados es evidencia observable de la confiabilidad dentro de la marca relacional.', a: true, why: 'La pregunta de la confiabilidad es «¿cumples lo que prometes?», y su evidencia digital es responder y entregar a tiempo.' },
  { id: 'tf10', q: 'Reaccionar con «me gusta» a las publicaciones de otros es la evidencia más fuerte de la dimensión de comunicación de la marca relacional.', a: false, why: 'La evidencia de comunicación son los comentarios que aportan, no solo las reacciones.' },
  { id: 'tf11', q: 'Grant (2013) distingue entre quienes dan, quienes toman y quienes equilibran en sus relaciones profesionales.', a: true, why: 'Es la base de la reciprocidad vista en clase: dar primero, con criterio, construye relaciones más duraderas.' },
  { id: 'tf12', q: 'Pedir una recomendación laboral en el primer mensaje a un desconocido muestra iniciativa y es una práctica recomendada de netiqueta.', a: false, why: 'Pedir trabajo o una recomendación en el primer contacto pone al otro en una posición incómoda: no puede respaldar a quien no conoce.' },
  { id: 'tf13', q: 'Compartir el número personal de un profesor sin su autorización puede vulnerar la protección de datos personales de la Ley 1581 de 2012.', a: true, why: 'El principio de privacidad de la netiqueta pide no compartir datos de terceros sin permiso; en Colombia los protege la Ley 1581 de 2012.' },
  { id: 'tf14', q: 'Si alguien no responde tu mensaje de conexión, la netiqueta sugiere volver a escribirle cada dos o tres días hasta obtener respuesta.', a: false, why: 'El principio de seguimiento recomienda agradecer y enviar un solo recordatorio después de una semana.' },
  { id: 'tf15', q: 'En un mensaje de conexión, la parte de contexto explica cómo llegaste a esa persona.', a: true, why: 'La estructura es saludo con nombre, contexto, conexión específica, motivo, petición pequeña (o ninguna) y agradecimiento.' },
  { id: 'tf16', q: 'Los semilleros de investigación hacen parte de la red de colaboración, junto con los emprendimientos y los proyectos.', a: false, why: 'Los semilleros, junto con profesores e investigadores, forman la red académica.' },
  { id: 'tf17', q: 'Los egresados, los líderes del sector y los reclutadores forman parte de la red profesional.', a: true, why: 'Son las tres figuras de la red profesional en el mapa de las cuatro redes visto en clase.' },
  { id: 'tf18', q: 'Un buen pitch relacional se concentra en los logros propios y evita hacer preguntas a la otra persona para aprovechar mejor el tiempo.', a: false, why: 'El pitch relacional termina con una pregunta genuina: las conexiones surgen de intereses compartidos y valor mutuo.' },
  { id: 'tf19', q: 'En el mapa de red, para cada persona se registra el tipo de vínculo y qué se le puede aportar, no solo qué se puede recibir.', a: true, why: 'El mapa pide el tipo de vínculo (fuerte o débil) y el aporte posible, coherente con la idea de intercambio de valor.' },
  { id: 'tf20', q: 'La cifra de que el 80 % de los empleos se consigue por networking proviene de un estudio con metodología ampliamente verificada.', a: false, why: 'Es una cifra muy difundida sin una fuente metodológica clara; en clase se usó como ejemplo de pensamiento crítico.' }
];

/* =================== BANCO 2: CASOS DE SELECCIÓN MÚLTIPLE (10 × 5) =================== */
var CASES = [
  { id: 'c01', title: 'Laura y sus 900 contactos', text: 'Laura Gómez cursa último semestre de Ingeniería Industrial. Tiene 900 contactos en LinkedIn porque acepta todas las solicitudes, pero no publica ni comenta. En dos meses envió 30 hojas de vida a empresas de logística y no recibió respuesta. Le interesa la logística sostenible y sabe que dos egresados de su programa trabajan en ese campo, aunque nunca les ha escrito.',
    qs: [
      { id: 'c01q1', q: '¿Qué conceptos de la clase explican mejor la falta de resultados de Laura?', o: [['Tiene contactos, pero casi ninguna relación de confianza.', 1], ['Nadie en su red asocia su nombre con la logística sostenible.', 1], ['Su red todavía es pequeña para el sector en el que busca trabajo.', 0], ['Envía hojas de vida a empresas sin vacantes publicadas en el momento.', 0], ['LinkedIn no es una red adecuada para buscar empleo en logística.', 0]], why: 'El problema no es el tamaño de la red ni la plataforma: tiene contactos sin relación y sin posicionamiento, así que nadie la recuerda ni la recomienda.' },
      { id: 'c01q2', q: '¿Qué tipo de vínculo tiene con los dos egresados y por qué pueden ser valiosos?', o: [['Son vínculos débiles que pueden darle información de otros círculos.', 1], ['Comparten programa y campo, lo que da un punto de conexión concreto.', 1], ['Son vínculos fuertes porque estudiaron en la misma universidad.', 0], ['No cuentan como vínculos, porque nunca han conversado con ella.', 0], ['Serán útiles solo cuando alguno de ellos le ofrezca un empleo.', 0]], why: 'Son lazos débiles con un contexto compartido. Su valor está en el acceso a información y oportunidades de otro círculo (Granovetter).' },
      { id: 'c01q3', q: 'Laura decide escribir a uno de los egresados. ¿Qué debe incluir su primer mensaje?', o: [['Cómo llegó a él: el programa que ambos estudiaron.', 1], ['Qué le interesa de su trabajo en logística sostenible.', 1], ['Un agradecimiento breve por su tiempo al cerrar el mensaje.', 1], ['Su hoja de vida adjunta para que la reenvíe a recursos humanos.', 0], ['Una solicitud de reunión de una hora durante esa misma semana.', 0]], why: 'Contexto, conexión específica y agradecimiento son partes del mensaje de conexión; pedir que reenvíe la hoja de vida o una reunión larga es un favor alto para un primer contacto.' },
      { id: 'c01q4', q: '¿Qué acciones le ayudarían a construir marca relacional en las próximas semanas?', o: [['Comentar con aportes en publicaciones del sector.', 1], ['Compartir el resumen de un evento del sector al que asistió.', 1], ['Aceptar más solicitudes hasta llegar a 1.500 contactos.', 0], ['Reaccionar con «me gusta» a todas las publicaciones de su red.', 0], ['Cambiar su titular cada semana para ver cuál atrae más visitas.', 0]], why: 'La marca relacional se construye con evidencia visible de comunicación y generosidad: comentarios que aportan y conocimiento compartido.' },
      { id: 'c01q5', q: '¿Cuáles serían metas SMART adecuadas para Laura en los próximos 30 días?', o: [['Escribir a los dos egresados con un mensaje personalizado antes del día 10.', 1], ['Comentar con aportes en ocho publicaciones del sector durante el mes.', 1], ['Mejorar su presencia en LinkedIn y hacerse más visible ante las empresas del sector.', 0], ['Conseguir trabajo en una empresa de logística lo antes posible.', 0], ['Conocer a muchas personas importantes del sector logístico.', 0]], why: 'Una meta SMART es específica, medible, alcanzable, relevante y con fecha. Las otras no tienen acción concreta, indicador ni plazo.' }
    ] },
  { id: 'c02', title: 'El mapa de Andrés', text: 'Andrés Pinilla estudia cuarto semestre de Economía y quiere trabajar en análisis de datos para políticas públicas. En su mapa de red escribió a 12 compañeros de carrera, 3 profesores y su primo. No conoce egresados, no pertenece a ninguna comunidad y nunca ha ido a un evento del sector. Le cuesta escribir a personas que no conoce porque siente que «las está usando».',
    qs: [
      { id: 'c02q1', q: '¿Qué brechas muestra su mapa de red frente a su posicionamiento?', o: [['Le faltan vínculos en su red profesional, como egresados.', 1], ['No participa en redes de aprendizaje: comunidades, grupos o eventos.', 1], ['Incluyó más profesores de los que necesita en la etapa en que está.', 0], ['Su red académica ya está completa, así que no le hace falta crecer.', 0], ['Incluyó a un familiar, lo que hace que el mapa pierda validez.', 0]], why: 'Su red es casi toda académica y de colaboración. Le faltan la red profesional y la de aprendizaje ligadas a datos y políticas públicas.' },
      { id: 'c02q2', q: 'Su red es casi toda de compañeros de la misma carrera. Según Putnam (2000), ¿qué la describe mejor?', o: [['Predomina el capital social que une, que da apoyo entre semejantes.', 1], ['Le falta capital social que tienda puentes hacia otros grupos.', 1], ['Predomina el capital que tiende puentes, por la cantidad de compañeros.', 0], ['Es una red ideal, porque entre semejantes circula toda la información.', 0], ['El tipo de capital social no depende de quiénes forman la red.', 0]], why: 'Una red de semejantes da mucho apoyo y poca información nueva; tender puentes exige vínculos con grupos distintos.' },
      { id: 'c02q3', q: 'Andrés siente que escribir a desconocidos es «usarlos». ¿Qué le dirías con base en la clase?', o: [['Esa incomodidad aparece sobre todo en el networking puramente instrumental.', 1], ['Plantear el contacto desde aprender y aportar reduce ese malestar.', 1], ['Es señal de que el networking no es para personas introvertidas.', 0], ['Puede superarla enviando el mismo mensaje a muchas personas.', 0], ['Le conviene esperar a graduarse para empezar a construir su red profesional.', 0]], why: 'Casciaro, Gino y Kouchaki (2014) asocian la incomodidad al uso instrumental; el reencuadre es «qué puedo aprender y aportar».' },
      { id: 'c02q4', q: '¿Qué espacios de la red de aprendizaje encajan con su posicionamiento?', o: [['Un grupo de LinkedIn sobre análisis de datos para el sector público.', 1], ['Un evento abierto sobre datos y políticas públicas en la ciudad.', 1], ['Una comunidad en línea de analistas que trabajan con datos abiertos.', 1], ['Un grupo de LinkedIn con ofertas de empleo de cualquier sector y ciudad del país.', 0], ['El grupo de WhatsApp de su curso de primer semestre de Economía.', 0]], why: 'La red de aprendizaje incluye comunidades, grupos temáticos y eventos, elegidos según el posicionamiento: aquí, datos para políticas públicas.' },
      { id: 'c02q5', q: '¿Qué formas de aportar valor tiene Andrés, aun siendo estudiante?', o: [['Resumir un informe de datos que leyó para clase.', 1], ['Presentar a dos compañeros que trabajan en temas complementarios.', 1], ['Ninguna todavía: aportar exige tener experiencia laboral previa.', 0], ['Pedir a cada persona de su red que lo recomiende en su empresa.', 0], ['Enviar su hoja de vida a cada contacto para que la tengan en cuenta más adelante.', 0]], why: 'En el ejercicio «¿Qué puedo dar hoy?» aparecen compartir recursos, resumir eventos y conectar personas: aportes posibles desde la universidad.' }
    ] },
  { id: 'c03', title: 'La bandeja de Mónica', text: 'Mónica Ardila dirige las comunicaciones de una fundación cultural en Bucaramanga y tiene poco tiempo. Esta semana recibió tres mensajes en LinkedIn. Felipe escribió: «Hola, ¿tienes trabajo?». Daniela envió doce párrafos sobre su vida sin decir qué buscaba. Sergio mencionó una charla de Mónica sobre gestión cultural, contó que estudia Artes Audiovisuales y le agradeció lo que compartió.',
    qs: [
      { id: 'c03q1', q: '¿Qué falla en el mensaje de Felipe?', o: [['Pide empleo en el primer contacto, sin una relación previa.', 1], ['No da contexto sobre quién es ni sobre cómo llegó a ella.', 1], ['Usa un saludo demasiado formal para escribir en una red social.', 0], ['Es demasiado largo para caber en una nota de invitación.', 0], ['Debió enviarlo por WhatsApp para que fuera más directo.', 0]], why: 'Pedir trabajo en el primer mensaje y escribir sin contexto están en la lista de lo que no se hace en netiqueta profesional.' },
      { id: 'c03q2', q: '¿Qué principios de netiqueta descuida principalmente Daniela?', o: [['Respeto: no cuida el tiempo de quien recibe el mensaje.', 1], ['Claridad: el motivo no se entiende en la primera lectura.', 1], ['Privacidad: comparte datos personales de otras personas.', 0], ['Seguimiento: no indica cuándo volverá a escribir a Mónica.', 0], ['Pertinencia: escribe a alguien que no es del sector cultural.', 0]], why: 'Respeto es valorar el tiempo del otro con mensajes breves; claridad es que el motivo se entienda al primer vistazo.' },
      { id: 'c03q3', q: '¿Qué partes de un buen mensaje de conexión incluye Sergio?', o: [['Contexto: cómo llegó a Mónica.', 1], ['Conexión específica con el trabajo de ella.', 1], ['Cierre con agradecimiento por lo compartido.', 1], ['Una petición de empleo en la fundación cultural.', 0], ['Un enlace a su portafolio con todos sus trabajos.', 0]], why: 'Sergio usa contexto (la charla), conexión específica (gestión cultural) y agradecimiento, sin pedir nada a cambio.' },
      { id: 'c03q4', q: 'Si Sergio no recibe respuesta, ¿qué es adecuado según la netiqueta?', o: [['Enviar un solo recordatorio breve después de una semana.', 1], ['Seguir interactuando con aportes en las publicaciones de ella.', 1], ['Escribirle cada dos días hasta que responda su mensaje.', 0], ['Buscar su número personal y escribirle por WhatsApp.', 0], ['Etiquetarla en varias publicaciones para que lo note.', 0]], why: 'El seguimiento es un solo recordatorio tras una semana, sin insistir ni cambiar a canales personales.' },
      { id: 'c03q5', q: 'Mónica le responde a Sergio. ¿Qué acciones de seguimiento construyen la relación?', o: [['Agradecer y comentar algo concreto de su respuesta.', 1], ['Compartirle más adelante un recurso útil sobre gestión cultural.', 1], ['Pedirle de inmediato que lo recomiende dentro de la fundación cultural.', 0], ['Agregar a todos en la fundación, sin nota.', 0], ['Publicar la conversación privada como testimonio en su perfil.', 0]], why: 'Agradecer y aportar valor fortalecen la relación; pedir favores altos o exponer la conversación la debilitan.' }
    ] },
  { id: 'c04', title: 'Huerta Urbana', text: 'Valeria, Juan y Tomás crearon Huerta Urbana, una app para compartir excedentes de cosecha entre vecinos de Floridablanca, y ganaron el segundo puesto en una feria de emprendimiento. Juan diseñó la interfaz, Tomás la programó y Valeria hizo la investigación con los vecinos. Valeria quiere publicar el logro en LinkedIn y mantener el contacto con dos jurados, ambos empresarios del sector agrícola.',
    qs: [
      { id: 'c04q1', q: '¿Cómo debería Valeria publicar el logro para fortalecer su marca relacional?', o: [['Etiquetar a Juan y a Tomás y describir el aporte de cada uno.', 1], ['Agradecer a los jurados y a los vecinos que participaron.', 1], ['Presentarlo como logro propio para destacar su liderazgo.', 0], ['Publicar solo la foto del premio con el nombre de la app.', 0], ['Esperar a ganar un primer lugar para publicar algo.', 0]], why: 'Reconocer y etiquetar el trabajo del equipo es la evidencia digital de la colaboración; agradecer refuerza la relación con quienes ayudaron.' },
      { id: 'c04q2', q: '¿Qué dimensiones de la marca relacional se evidencian al reconocer el trabajo del equipo?', o: [['Colaboración', 1], ['Generosidad', 1], ['Confiabilidad', 0], ['Privacidad', 0], ['Pertinencia', 0]], why: 'Reconocer aportes ajenos muestra cómo trabajas con otros (colaboración) y que compartes el mérito (generosidad). Privacidad y pertinencia son principios de netiqueta.' },
      { id: 'c04q3', q: '¿A qué red pertenecen los jurados y qué conviene hacer para conectar con ellos?', o: [['A su red profesional, como líderes del sector agrícola.', 1], ['Escribirles mencionando la feria y algo de su retroalimentación.', 1], ['A su red académica, porque la feria fue en la universidad.', 0], ['Pedirles financiación para la app en el primer mensaje.', 0], ['Esperar a que ellos la contacten primero después de la feria.', 0]], why: 'Los líderes del sector forman la red profesional; el mensaje funciona con contexto compartido (la feria) y conexión específica.' },
      { id: 'c04q4', q: 'Un mes después, uno de los jurados publica una pregunta sobre agricultura urbana. ¿Qué respuesta construye la relación?', o: [['Un comentario con datos de su investigación con los vecinos.', 1], ['Un comentario que recomiende un recurso útil y explique por qué.', 1], ['Un «me gusta» para mostrar que sigue pendiente de su perfil.', 0], ['Un mensaje privado pidiéndole que pruebe la app y la recomiende.', 0], ['Un comentario con el enlace de descarga de la app, sin más texto.', 0]], why: 'Los comentarios que aportan son la evidencia de comunicación y generosidad; promocionar o pedir favores no construye relación.' },
      { id: 'c04q5', q: 'Valeria prometió a un jurado enviarle el informe de la investigación y ya pasaron dos semanas. ¿Qué es lo más adecuado?', o: [['Enviarlo, reconocer la demora en una línea y agradecer de nuevo.', 1], ['Cumplir aunque sea tarde, porque eso sostiene la confianza.', 1], ['No enviarlo, porque ya pasó demasiado tiempo para retomar.', 0], ['Enviar una disculpa extensa que explique cada motivo del retraso.', 0], ['Esperar a tener una versión perfecta, aunque tarde otro mes.', 0]], why: 'La confiabilidad es cumplir lo prometido. Reconocer la demora con naturalidad conserva la confianza sin cargar al otro.' }
    ] },
  { id: 'c05', title: 'El pitch de Daniel', text: 'Daniel Cárdenas estudia Diseño Gráfico y le interesa el diseño de marcas para emprendimientos locales. En el speed networking de la clase, durante su primer encuentro, habló dos minutos sobre los cursos que ha tomado, sus premios del colegio y sus series favoritas. No le preguntó nada a su compañera. Al terminar la sala no recordaba el nombre de ella ni a qué se dedica.',
    qs: [
      { id: 'c05q1', q: '¿Qué le faltó al pitch relacional de Daniel?', o: [['Decir qué problema quiere ayudar a resolver y qué puede aportar.', 1], ['Cerrar con una pregunta genuina sobre los intereses de ella.', 1], ['Mencionar más premios para causar una mejor impresión.', 0], ['Hablar más rápido para incluir toda su experiencia.', 0], ['Compartir en pantalla su portafolio completo de diseño.', 0]], why: 'El pitch tiene tres partes (quién soy, qué aporto, con quién busco conectar) y termina con una pregunta genuina para la otra persona.' },
      { id: 'c05q2', q: '¿Qué enunciados de «con quién busco conectar» son coherentes con su posicionamiento?', o: [['Diseñadores que trabajan con emprendimientos de la región.', 1], ['Emprendedores locales que necesitan construir su marca.', 1], ['Cualquier persona que quiera agregarme en LinkedIn.', 0], ['Reclutadores de multinacionales de cualquier sector.', 0], ['Personas con muchos seguidores en sus redes sociales.', 0]], why: '«Con quién busco conectar» se apoya en el posicionamiento: aquí, el diseño de marcas para emprendimientos locales.' },
      { id: 'c05q3', q: '¿Qué debía registrar Daniel después de cada encuentro?', o: [['El nombre de la persona con quien conversó.', 1], ['El interés profesional que ella compartió.', 1], ['Un posible punto de colaboración entre los dos.', 1], ['Cuántos seguidores tiene ella en sus redes.', 0], ['Si la familia de ella tiene empresa propia.', 0]], why: 'El registro de observación pide nombre, interés y posible punto de colaboración: alimenta después el mapa de red.' },
      { id: 'c05q4', q: 'Después del encuentro, ¿qué notas de invitación en LinkedIn son adecuadas?', o: [['«Hola, Sara. Hablamos en el speed networking; me interesó tu proyecto de fotografía. ¡Gracias!»', 1], ['«Hola, Sara. Gracias por la conversación de hoy en clase; quiero seguir tu trabajo en fotografía.»', 1], ['«Hola. ¿Me aceptas? Estoy ampliando mi red de contactos este semestre para conseguir práctica.»', 0], ['Ninguna nota: una invitación sin texto es suficiente después de haber hablado en clase.', 0], ['«Hola, Sara. ¿Me recomiendas con tus clientes de fotografía para hacerles el logo?»', 0]], why: 'La nota personalizada recuerda el contexto, menciona algo específico y agradece, sin pedir favores en el primer contacto.' },
      { id: 'c05q5', q: '¿En qué conceptos de semanas anteriores se apoya cada parte del pitch?', o: [['«Quién soy» se apoya en la identidad profesional.', 1], ['«Qué aporto» se apoya en la propuesta de valor.', 1], ['«Qué aporto» se apoya en la huella digital.', 0], ['«Con quién busco conectar» se apoya en el storytelling.', 0], ['«Quién soy» se apoya en el número de contactos.', 0]], why: 'Quién soy es identidad profesional, qué aporto es propuesta de valor y con quién busco conectar es posicionamiento.' }
    ] },
  { id: 'c06', title: 'El número del profesor', text: 'En el grupo de WhatsApp de Publicidad, Natalia pide el número personal del profesor Ruiz para preguntarle por una práctica. Esteban lo tiene porque fue monitor y duda en compartirlo. Natalia también quiere escribirle al director de una agencia que conoció en un evento, y planea hacerlo por Instagram a las once de la noche porque, según ella, «es más cercano».',
    qs: [
      { id: 'c06q1', q: '¿Qué debería hacer Esteban?', o: [['No compartir el número sin autorización del profesor Ruiz.', 1], ['Sugerir el correo institucional o pedir permiso al profesor.', 1], ['Compartirlo, porque la consulta es académica y urgente.', 0], ['Compartirlo solo con Natalia, por mensaje privado.', 0], ['Publicar en el grupo el número y el horario de atención.', 0]], why: 'Los datos de contacto de otra persona no son nuestros para compartir; la alternativa es el canal institucional o pedir autorización.' },
      { id: 'c06q2', q: '¿Qué respalda la decisión de no compartir el número?', o: [['La Ley 1581 de 2012 sobre protección de datos personales.', 1], ['El principio de privacidad de la netiqueta profesional.', 1], ['El principio de seguimiento, que limita los recordatorios.', 0], ['La regla de no enviar mensajes masivos en redes sociales.', 0], ['El principio de claridad, que pide una sola idea por mensaje.', 0]], why: 'La privacidad pide proteger los datos propios y de terceros; en Colombia la Ley 1581 de 2012 protege los datos personales.' },
      { id: 'c06q3', q: 'Sobre escribirle al director por Instagram a las once de la noche, ¿qué principios están en juego?', o: [['Pertinencia: para lo profesional conviene LinkedIn o el correo.', 1], ['Respeto: un horario razonable cuida los límites del otro.', 1], ['Privacidad: solo se puede escribir a personas del círculo cercano.', 0], ['Claridad: los mensajes nocturnos se entienden peor.', 0], ['Ninguno: un canal cercano genera más confianza.', 0]], why: 'Pertinencia es escribir por el canal adecuado; respeto incluye horarios razonables. La cercanía del canal no reemplaza la netiqueta.' },
      { id: 'c06q4', q: '¿Qué contexto conviene usar en su mensaje al director?', o: [['El evento en el que se conocieron y el tema que conversaron.', 1], ['Algo concreto del trabajo de la agencia que le llamó la atención.', 1], ['Que un profesor le pasó el número del director en clase.', 0], ['Que busca práctica y necesita una respuesta esta semana.', 0], ['La lista de las demás agencias a las que también escribió.', 0]], why: 'El contexto dice cómo llegaste a la persona y la conexión específica muestra interés genuino en su trabajo.' },
      { id: 'c06q5', q: 'Natalia escribe al director por LinkedIn y él no responde en cinco días. ¿Qué es lo más adecuado?', o: [['Esperar a que pase una semana y enviar un solo recordatorio breve.', 1], ['Mientras tanto, comentar con aportes alguna publicación de la agencia.', 1], ['Escribirle por Instagram, ya que por LinkedIn no respondió.', 0], ['Pedirle a Esteban que le consiga el número del director.', 0], ['Reenviar el mismo mensaje cada día para mostrar interés.', 0]], why: 'El seguimiento es un solo recordatorio tras una semana; mientras tanto, la interacción con aportes mantiene viva la relación.' }
    ] },
  { id: 'c07', title: 'Tejido Social', text: 'Paula Méndez estudia Trabajo Social y participa en dos grupos que no se conocen entre sí: un colectivo de fotografía y una red de líderes comunitarios del norte de Bucaramanga. Una fundación busca a alguien que documente en fotos sus proyectos barriales. Un integrante del colectivo, a quien Paula solo ha visto en dos talleres, le cuenta de la convocatoria antes de que se publique.',
    qs: [
      { id: 'c07q1', q: '¿Cómo se explica que Paula se enterara antes de la convocatoria?', o: [['Un vínculo débil le dio acceso a información de otro círculo.', 1], ['Es un ejemplo de la fuerza de los lazos débiles (Granovetter, 1973).', 1], ['Fue suerte: las redes no influyen en el acceso a la información.', 0], ['La información valiosa solo la comparten los vínculos fuertes.', 0], ['El colectivo publicó la convocatoria antes que la fundación.', 0]], why: 'Los conocidos circulan en otros círculos y traen información que tu entorno cercano no tiene.' },
      { id: 'c07q2', q: 'Paula conecta dos grupos que no se comunican entre sí. Según Burt (1992), ¿qué implica esa posición?', o: [['Puede acceder antes a ideas y oportunidades de ambos grupos.', 1], ['Ocupa un agujero estructural entre dos redes distintas.', 1], ['Corre el riesgo de quedar aislada de los dos grupos.', 0], ['Pierde credibilidad por no pertenecer de lleno a ninguno de los dos grupos.', 0], ['Debe elegir uno de los grupos para no dispersarse.', 0]], why: 'Quien conecta grupos que no se hablan ocupa un agujero estructural y accede antes a ideas y oportunidades.' },
      { id: 'c07q3', q: 'Sobre su vínculo con el integrante del colectivo, ¿qué es correcto según Rajkumar et al. (2022)?', o: [['Es un vínculo moderadamente débil.', 1], ['Ese tipo de vínculo fue el que más favoreció la movilidad laboral.', 1], ['Los vínculos sin ninguna interacción fueron los más útiles.', 0], ['En el estudio, solo los vínculos fuertes resultaron útiles para cambiar de empleo.', 0], ['El estudio se hizo con encuestas a estudiantes universitarios.', 0]], why: 'Con experimentos en LinkedIn, los vínculos moderadamente débiles fueron los que más favorecieron la movilidad laboral.' },
      { id: 'c07q4', q: '¿Qué tipos de capital social le aporta participar en ambos grupos?', o: [['Capital que tiende puentes, por conectar grupos distintos.', 1], ['Capital que une, por el apoyo dentro de cada grupo.', 1], ['Capital económico, porque la fundación le pagará el trabajo.', 0], ['Ninguno, porque aún no tiene relación con la fundación.', 0], ['Solo capital que une, porque son grupos pequeños.', 0]], why: 'Putnam: dentro de cada grupo hay capital que une; entre grupos distintos, capital que tiende puentes.' },
      { id: 'c07q5', q: '¿Qué debería hacer Paula después de enterarse?', o: [['Agradecerle por compartirle la información.', 1], ['Postularse y contarle luego cómo le fue en la convocatoria.', 1], ['Pedirle que la recomiende directamente ante la fundación.', 0], ['No decirle nada para evitar compromisos.', 0], ['Publicar la convocatoria en sus redes aunque aún no sea pública.', 0]], why: 'Agradecer y cerrar el ciclo contando el resultado fortalece el vínculo; difundir información no pública rompe la confianza.' }
    ] },
  { id: 'c08', title: 'Santiago e Isabel', text: 'Santiago Peña estudia Negocios Internacionales y cree que la clave es tener muchos contactos: en un mes pasó de 200 a 1.200 conexiones agregando a desconocidos. Su compañera Isabel tiene 150 contactos, pero conversa con frecuencia con un profesor, dos egresadas y un grupo temático de comercio exterior. A Isabel ya la invitaron a participar en un proyecto; a Santiago, nadie.',
    qs: [
      { id: 'c08q1', q: '¿Qué explica mejor la diferencia de resultados entre los dos?', o: [['Isabel tiene relaciones de confianza.', 1], ['Los contactos de Santiago no tienen historia de interacción con él.', 1], ['Una red pequeña resulta más útil que una grande en cualquier caso.', 0], ['Santiago agregó personas de otros países que hablan un idioma distinto al suyo.', 0], ['Isabel usa otra red social.', 0]], why: 'La diferencia está en la relación (conocimiento, interacción y confianza), no en el tamaño de la red ni en la plataforma.' },
      { id: 'c08q2', q: '¿Qué conclusión de la clase matiza la idea de que «menos contactos es mejor»?', o: [['Un núcleo de confianza y una periferia diversa.', 1], ['Los vínculos débiles activos también generan oportunidades nuevas.', 1], ['Lo mejor es tener pocos contactos y todos de la misma carrera.', 0], ['La cantidad de contactos es irrelevante para las oportunidades.', 0], ['Solo importan los vínculos fuertes, porque son los que recomiendan.', 0]], why: 'Ni 500 contactos ni 10 por sí solos: un núcleo de confianza más una periferia diversa de vínculos débiles activos.' },
      { id: 'c08q3', q: '¿Qué prácticas de Santiago contradicen lo que es networking?', o: [['Acumular contactos como una meta en sí misma.', 1], ['Agregar personas al azar, sin motivo ni contexto.', 1], ['Usar LinkedIn como plataforma principal de su red.', 0], ['Tener contactos en otros países y otros sectores.', 0], ['Elegir una carrera con muchas oportunidades de red.', 0]], why: 'Acumular contactos y agregar personas al azar están en la lista de lo que no es networking.' },
      { id: 'c08q4', q: '¿Qué podría hacer Santiago para convertir algunos contactos en relaciones?', o: [['Escribir con contexto a quienes se relacionan con su posicionamiento.', 1], ['Comentar con aportes propios las publicaciones de esas personas.', 1], ['Compartir recursos útiles con ellas sin pedir nada a cambio.', 1], ['Enviar un mismo mensaje de presentación a todas sus conexiones.', 0], ['Eliminar a quienes no le respondan en el plazo de una semana.', 0]], why: 'Una relación se construye con mensajes personalizados, interacción que aporta y generosidad; los mensajes masivos van contra la netiqueta.' },
      { id: 'c08q5', q: '¿Qué tipos de red tiene Isabel según lo descrito en el caso?', o: [['Académica, por su relación con el profesor.', 1], ['Profesional, por su relación con las egresadas.', 1], ['De aprendizaje, por el grupo temático de comercio exterior.', 1], ['De colaboración, por su relación con las egresadas.', 0], ['Académica, por su participación en el grupo temático.', 0]], why: 'Profesores: red académica. Egresados: red profesional. Grupos temáticos y comunidades: red de aprendizaje.' }
    ] },
  { id: 'c09', title: 'El semillero de Biotecnología', text: 'En el semillero de Biotecnología, Catalina siempre entrega a tiempo, pero nunca comparte lo que aprende y en las reuniones interrumpe a los demás. Mateo comparte artículos útiles con el grupo y reconoce en LinkedIn los aportes de sus compañeros, aunque suele responder los correos una semana tarde. La directora del semillero debe recomendar a una de estas dos personas para una pasantía.',
    qs: [
      { id: 'c09q1', q: '¿Qué fortaleza y qué debilidad de marca relacional muestra Catalina?', o: [['Fortaleza en confiabilidad, porque entrega en los tiempos acordados.', 1], ['Debilidad en generosidad, porque no comparte lo que aprende.', 1], ['Fortaleza en comunicación, porque participa mucho en las reuniones.', 0], ['Debilidad en confiabilidad, porque interrumpe a sus compañeros.', 0], ['Fortaleza en colaboración, porque trabaja rápido y por su cuenta.', 0]], why: 'Entregar a tiempo es confiabilidad; no compartir conocimiento es una debilidad en generosidad. Interrumpir afecta la comunicación, no la confiabilidad.' },
      { id: 'c09q2', q: '¿Qué dimensiones evidencia Mateo de forma positiva?', o: [['Generosidad, al compartir artículos útiles con el grupo.', 1], ['Colaboración, al reconocer los aportes de sus compañeros.', 1], ['Confiabilidad, al responder los correos cuando puede.', 0], ['Profesionalismo, por publicar a menudo en LinkedIn.', 0], ['Privacidad, al no compartir datos del semillero.', 0]], why: 'Compartir conocimiento es generosidad y reconocer el trabajo ajeno es colaboración. Responder tarde debilita la confiabilidad.' },
      { id: 'c09q3', q: '¿Qué debería mejorar cada uno?', o: [['Mateo, responder en los tiempos acordados para ganar confiabilidad.', 1], ['Catalina, escuchar y aportar en las conversaciones del grupo.', 1], ['Mateo, dejar de compartir artículos para no saturar al grupo.', 0], ['Catalina, entregar antes de tiempo para compensar lo demás.', 0], ['Ninguno: la marca relacional importa solo fuera del semillero.', 0]], why: 'Cada uno debe trabajar su dimensión débil: Mateo la confiabilidad y Catalina la comunicación y la generosidad.' },
      { id: 'c09q4', q: '¿Qué ideas de la clase explican que la directora no decida solo por las notas?', o: [['La marca relacional es la percepción que otros construyen al interactuar contigo.', 1], ['Muchas personas consiguen oportunidades porque a otros les gusta trabajar con ellas.', 1], ['Las notas académicas no tienen relación con las oportunidades profesionales.', 0], ['Las pasantías se asignan sobre todo según el número de contactos en LinkedIn.', 0], ['La directora debe recomendar a quien tenga más seguidores en sus redes.', 0]], why: 'La marca relacional nace de la experiencia de interacción, y muchas oportunidades llegan porque los demás disfrutan trabajar contigo.' },
      { id: 'c09q5', q: 'Según Grant (2013), ¿cómo se describe el hábito de Mateo de compartir artículos?', o: [['Se acerca a quienes dan, porque aporta sin pedir nada a cambio.', 1], ['Da primero con criterio, lo que construye relaciones duraderas.', 1], ['Se acerca a quienes toman, porque busca visibilidad para sí mismo.', 0], ['Equilibra, porque solo comparte cuando recibe algo a cambio.', 0], ['No aplica: compartir artículos no hace parte de una relación.', 0]], why: 'Grant distingue a quienes dan, toman y equilibran; dar primero, con criterio, construye relaciones más duraderas.' }
    ] },
  { id: 'c10', title: 'El plan de Juliana', text: 'Juliana Torres estudia Comunicación Social y quiere trabajar en comunicación para el sector salud. Ya conoce a dos profesoras y a una egresada que trabaja en una clínica, quiere conocer a periodistas especializados en salud y pertenece a un grupo de LinkedIn sobre comunicación en salud. En la sección de próximos pasos de su mapa escribió: «Mejorar mi red», «Ser más activa» y «Conocer gente».',
    qs: [
      { id: 'c10q1', q: '¿Por qué sus próximos pasos no son metas SMART?', o: [['No indican una acción concreta que se pueda observar.', 1], ['No tienen un indicador medible ni una fecha límite.', 1], ['Son demasiado específicos para un plan de 30 días.', 0], ['Las metas de networking no se pueden medir con datos.', 0], ['Deberían centrarse en conseguir empleo, no en la red.', 0]], why: 'Una meta SMART es específica, medible, alcanzable, relevante y con fecha. «Mejorar mi red» no cumple ninguno de esos criterios.' },
      { id: 'c10q2', q: '¿Cuáles serían metas SMART coherentes con su posicionamiento?', o: [['Comentar con aportes cuatro publicaciones del grupo de salud antes del 15 de noviembre.', 1], ['Escribir esta semana a la egresada de la clínica con un mensaje personalizado.', 1], ['Ser mucho más visible en LinkedIn para el sector salud y sus organizaciones durante el semestre.', 0], ['Agregar a 100 periodistas de cualquier sector antes de que termine el mes.', 0], ['Mejorar bastante mi red de contactos profesionales a lo largo de este mes.', 0]], why: 'Las metas correctas tienen acción concreta, indicador y fecha, y se relacionan con su sector. Agregar periodistas de cualquier sector no es relevante para su posicionamiento.' },
      { id: 'c10q3', q: '¿Cómo se clasifican los vínculos de su mapa?', o: [['Las profesoras pertenecen a su red académica.', 1], ['La egresada de la clínica pertenece a su red profesional.', 1], ['El grupo de LinkedIn pertenece a su red de colaboración.', 0], ['Los periodistas de salud ya hacen parte de su red profesional.', 0], ['La egresada es de su red académica por venir de la universidad.', 0]], why: 'Profesores: red académica; egresados: red profesional. El grupo de LinkedIn es red de aprendizaje y los periodistas aún no están en su red.' },
      { id: 'c10q4', q: '¿Qué brechas muestra su mapa frente a su posicionamiento?', o: [['Le faltan vínculos con periodistas de salud.', 1], ['Tiene pocos vínculos en el sector salud fuera de la universidad.', 1], ['Tiene demasiadas profesoras en comparación con los egresados.', 0], ['Estar en un grupo de LinkedIn basta para cerrar sus brechas.', 0], ['No tiene brechas, porque ya conoce a una egresada que trabaja en el sector salud.', 0]], why: 'El análisis de brechas compara la red actual con el posicionamiento: le faltan vínculos en el sector salud y con periodistas especializados.' },
      { id: 'c10q5', q: 'Para cada persona de su mapa, ¿qué debe registrar además del nombre o rol?', o: [['El tipo de vínculo que tiene: fuerte o débil.', 1], ['Qué puede aportarle ella a esa persona.', 1], ['Cuántos seguidores tiene en LinkedIn.', 0], ['Qué favor puede pedirle en primer lugar.', 0], ['En qué empresa trabajan sus familiares.', 0]], why: 'El mapa registra el tipo de vínculo y qué puede aportarle el estudiante, no solo qué puede recibir.' }
    ] }
];

var ORD = [
  { id: 'o01', sit: 'Ordena las frases para formar un mensaje de conexión con su estructura completa.', steps: ['«Hola, Carlos.»', '«Vi tu publicación sobre analítica de datos aplicada a la educación.»', '«Me interesó cómo usaron los datos de deserción.»', '«Estoy en un proyecto universitario sobre ese tema y me gustaría seguir tu trabajo.»', '«Gracias por compartir lo que aprendes.»'], why: 'Saludo con nombre, contexto, conexión específica, motivo y cierre con agradecimiento: es la estructura del mensaje de conexión.' },
  { id: 'o02', sit: 'Ordena las partes del pitch relacional que se usa en el speed networking.', steps: ['Quién soy: nombre, carrera e interés profesional', 'Qué aporto: el problema que quiero ayudar a resolver', 'Con quién busco conectar: tipo de profesionales o comunidades', 'Una pregunta genuina sobre el trabajo o los intereses del otro'], why: 'Identidad, propuesta de valor y posicionamiento, y siempre un cierre con una pregunta genuina para la otra persona.' },
  { id: 'o03', sit: 'Ordena el bloque de speed networking de la teleclase, desde la preparación hasta la plenaria.', steps: ['Escribir el pitch en la Misión 5 mientras el docente modela el suyo', 'Conversar en tres salas de dos personas, de 3 minutos cada una', 'Volver a la sala principal y registrar a quién conociste', 'Enviar la invitación de LinkedIn con nota personalizada', 'Compartir en plenaria quién te generó interés y por qué'], why: 'Primero se prepara el pitch, luego los encuentros; el registro da el nombre para la invitación, y la plenaria cierra la reflexión.' },
  { id: 'o04', sit: 'Ordena cómo un contacto se convierte en una relación profesional.', steps: ['Se conocen en un evento y ella solo sabe tu nombre', 'Le escribes un mensaje de conexión con contexto y agradecimiento', 'Interactúan varias veces: comentas sus publicaciones y le compartes recursos', 'Ella conoce tu trabajo y confía en él', 'Te recomienda para un proyecto de su organización'], why: 'Del contacto a la relación: conocimiento mutuo, interacción recurrente, confianza construida con evidencia y, al final, la recomendación.' },
  { id: 'o05', sit: 'Ordena los pasos para construir tu mapa de red profesional inicial.', steps: ['Listar a quiénes ya conoces y clasificar cada vínculo como fuerte o débil', 'Comparar tu red actual con tu posicionamiento para detectar brechas', 'Definir a quiénes quieres conocer y qué comunidades cierran esas brechas', 'Escribir tres metas SMART para los próximos 30 días', 'Revisar el avance de tus metas al terminar el mes'], why: 'Sin conocer la red actual no se ven las brechas; las brechas definen a quién buscar, y las metas convierten eso en acciones medibles.' },
  { id: 'o06', sit: 'Enviaste un mensaje de conexión y no hubo respuesta. Ordena lo que recomienda la netiqueta.', steps: ['Enviar un mensaje personalizado con contexto', 'Esperar una semana sin insistir', 'Enviar un solo recordatorio breve', 'Si responde, agradecer y comentar algo concreto de su respuesta'], why: 'El principio de seguimiento: agradecer siempre y un solo recordatorio después de una semana, sin presionar.' },
  { id: 'o07', sit: 'Ordena cómo Paula aprovechó un vínculo débil y cerró el ciclo con respeto.', steps: ['Asiste a dos talleres del colectivo y conoce a uno de sus integrantes', 'El integrante le cuenta de una convocatoria que aún no se ha publicado', 'Paula le agradece y se postula a la convocatoria', 'La fundación le comunica el resultado de su postulación', 'Paula le cuenta el resultado al integrante y le agradece de nuevo'], why: 'El vínculo débil trae la información; agradecer y contar el resultado cierra el ciclo y fortalece la relación.' },
  { id: 'o08', sit: 'Ordena estos temas según la ruta del curso Marca Personal Digital hasta la semana 10.', steps: ['Identidad profesional', 'Propuesta de valor', 'Storytelling', 'Posicionamiento estratégico', 'Networking digital'], why: 'El curso va de quién soy (identidad) y qué aporto (propuesta de valor) a cómo lo cuento, cómo me posiciono y, en la semana 10, a quién debe conocerlo.' },
  { id: 'o09', sit: 'Ordena la historia de Valeria con el jurado de la feria, de modo que muestre confiabilidad.', steps: ['Conoce al jurado durante la feria de emprendimiento', 'Le escribe mencionando la feria y algo de su retroalimentación', 'Le promete enviarle el informe de la investigación', 'Le envía el informe y le agradece su tiempo', 'Meses después, él la recomienda para un proyecto agrícola'], why: 'Contexto, mensaje de conexión, compromiso cumplido y, como resultado de la confianza, una recomendación.' },
  { id: 'o10', sit: 'Ordena el taller de reescritura de mensajes de la clase de netiqueta.', steps: ['Leer el mensaje deficiente que recibió la pareja', 'Identificar qué principio de netiqueta falla', 'Reescribirlo con la estructura de seis partes', 'Revisar con la lista cuáles partes se incluyeron', 'Leerlo ante el grupo y recibir retroalimentación'], why: 'Primero se diagnostica el error, luego se reescribe con la estructura, se verifica y se socializa.' }
];

function rnd(n) {
  try { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); }
}
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fp(s) { var a = 0x811c9dc5, b = 0x9e3779b1; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); a ^= c; a = Math.imul(a, 16777619) >>> 0; b = Math.imul(b ^ c, 0x5bd1e995) >>> 0; b = (b ^ (b >>> 15)) >>> 0; } return a.toString(16) + '-' + b.toString(16); }
function fmtPts(p) { return (Math.round(p * 10) / 10).toFixed(1).replace('.', ','); }

function capacity() {

  return Math.min(tf, ord, mc);
}

function render() {

/* ---------- Inicio ---------- */

/* ---------- Juego ---------- */
function cur() { var g = S.current; return g ? g.qs[g.idx] : null; }
function qOf(a) { return a.type === 'tf' ? TFMAP[a.id] : a.type === 'mc' ? MCMAP[a.id].q : ORDMAP[a.id]; }
function needOf(q) { return q.o.filter(function (o) { return o[1]; }).length; }

function renderGame() {
  var g = S.current, a = cur(), q = qOf(a);
  var life = g.life;
  var swapAvail = swapPool(a).length > 0;
  var fiftyOk = a.type === 'mc' && !life.fifty;
  var lifeBtn = function (key, inner, label, enabled, title) {
    var used = life[key];
    return '<button class="life' + (used ? ' used' : '') + '" data-act="life" data-k="' + key + '"' + (!used && enabled ? '' : ' disabled') + ' title="' + esc(title) + '"><span class="orb">' + inner + '</span><span class="lab">' + label + '</span></button>';
  };
  var lifelines = '<div class="lifelines" role="group" aria-label="Comodines">' +
    lifeBtn('audience', ICON.people, 'Público', true, 'Pregunta al público: +' + AUDIENCE_BONUS + ' segundos para que tus compañeros te ayuden') +
    lifeBtn('fifty', '<span class="ff">50:50</span>', '50:50', fiftyOk, a.type === 'mc' ? 'Elimina la mitad de las opciones incorrectas; la pregunta vale 0,5' : 'Solo disponible en preguntas de caso') +
    lifeBtn('swap', ICON.swap, 'Cambiar', swapAvail, swapAvail ? 'Cambia por otra pregunta del mismo tipo' : 'No quedan preguntas disponibles de este tipo') +
    '</div>';
  var total = a.total;
  var timer = '<div class="timer" id="timer" role="timer" aria-label="Tiempo restante"><svg viewBox="0 0 92 92"><circle class="track" cx="46" cy="46" r="40"/><circle class="bar" id="ring" cx="46" cy="46" r="40" stroke-dasharray="251.33" stroke-dashoffset="0"/></svg><span class="num" id="secs">' + total + '</span></div>';
  var head = '<div class="topbar"><div class="player"><small>Jugador</small><b>' + esc(g.name) + '</b></div>' + lifelines + timer + '</div>';

  var caseBox = '';
  if (a.type === 'mc') { var c = MCMAP[a.id].c; caseBox = '<section class="casebox" aria-label="Caso"><span class="k">Caso</span><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p></section>'; }

  var qText = a.type === 'ord' ? q.sit : q.q;
  var tag = 'Pregunta ' + (g.idx + 1) + ' de 5 · ' + TYPE_LABEL[a.type] + (a.type === 'mc' ? ' · selecciona ' + needOf(q) : '') + (a.type === 'ord' ? ' · del primero al último' : '');
  var qbar = '<div class="hexrow qbar"><div class="hex"><div class="hex-in"><span class="tag">' + tag + '</span><p class="q">' + esc(qText) + '</p></div></div></div>';

  var notes = [];
  if (a.audience) notes.push('<div class="audience" role="status">' + ICON.people + '<p><b>El público tiene la palabra.</b> Tus compañeros pueden ayudarte: sumaste ' + AUDIENCE_BONUS + ' segundos.</p></div>');
  var pills = [];
  if (a.fifty) pills.push('<span class="pill gold">50:50 usado · esta pregunta vale 0,5</span>');
  if (a.swapped) pills.push('<span class="pill cyan">Pregunta cambiada</span>');
  if (a.type === 'mc') pills.push('<span class="pill">Debes marcar ' + needOf(q) + ' respuestas</span>');
  if (a.type === 'ord') pills.push('<span class="pill">Arrastra las tarjetas o usa las flechas</span>');
  var noteHtml = notes.join('') + (pills.length ? '<div class="notice">' + pills.join('') + '</div>' : '');

  var body = '';
  if (a.type === 'tf') {
    body = '<div class="opts two" role="group" aria-label="Respuestas">' + [['true', 'Verdadero', 'A'], ['false', 'Falso', 'B']].map(function (o) {
      var pressed = a.resp !== null && String(a.resp) === o[0];
      return '<button class="opt hexrow" data-act="tf" data-v="' + o[0] + '" aria-pressed="' + pressed + '"><span class="hex"><span class="hex-in"><span class="letter">' + o[2] + ':</span><span class="txt">' + o[1] + '</span></span></span></button>';
    }).join('') + '</div>';
  } else if (a.type === 'mc') {
    var sel = a.resp || [];
    body = '<div class="opts" role="group" aria-label="Respuestas">' + a.perm.map(function (oi, pos) {
      var gone = a.removed.indexOf(oi) > -1, pressed = sel.indexOf(oi) > -1;
      return '<button class="opt hexrow' + (gone ? ' gone' : '') + '" data-act="mc" data-i="' + oi + '" aria-pressed="' + pressed + '"' + (gone ? ' disabled aria-label="Opción eliminada"' : '') + '><span class="hex"><span class="hex-in"><span class="letter">' + LETTERS[pos] + ':</span><span class="txt">' + esc(q.o[oi][0]) + '</span></span></span></button>';
    }).join('') + '</div>';
  } else {
    var n = a.cur.length;
    body = '<ol class="order" aria-label="Pasos para ordenar">' + a.cur.map(function (si, pos) {
      return '<li class="oitem" data-pos="' + pos + '"><span class="slot" aria-hidden="true">' + (pos + 1) + '</span>' +
        '<div class="hexrow" draggable="true" data-pos="' + pos + '"><span class="hex"><span class="hex-in"><span class="grip">' + ICON.grip + '</span><span class="txt">' + esc(q.steps[si]) + '</span></span></span></div>' +
        '<span class="arrows"><button data-act="up" data-pos="' + pos + '" aria-label="Subir paso"' + (pos === 0 ? ' disabled' : '') + '>' + ICON.up + '</button><button data-act="down" data-pos="' + pos + '" aria-label="Bajar paso"' + (pos === n - 1 ? ' disabled' : '') + '>' + ICON.down + '</button></span></li>';
    }).join('') + '</ol>';
  }

  var canSubmit = a.type === 'ord' || (a.type === 'tf' ? a.resp !== null : (a.resp && a.resp.length > 0));
  var actions = '<div class="actions"><p class="flash" id="flash" aria-live="polite">' + esc(flashMsg) + '</p><button class="btn primary lg" data-act="submit"' + (canSubmit ? '' : ' disabled') + '>Responder</button></div>';

  var rungs = [];
  var labels = ['Verdadero o falso', 'Verdadero o falso', 'Caso · pregunta 1', 'Caso · pregunta 2', 'Ordenar'];
  for (var i = 4; i >= 0; i--) {
    var cls = i === g.idx ? 'now' : (i < g.idx ? 'done' : '');
    rungs.push('<div class="rung ' + cls + '"' + (i === g.idx ? ' aria-current="step"' : '') + '><span class="n">' + (i + 1) + '</span><span>' + labels[i] + '</span><span class="pt">1 pt</span></div>');
  }
  var ladder = '<aside class="ladder" aria-label="Progreso"><h3>Escalera</h3>' + rungs.join('') + '<p class="tot">Los resultados se revelan al final de la partida.</p></aside>';

  app.innerHTML = '<p class="brand">Marca Personal Digital - Quiz de recuperación</p><div class="stage"><div class="main">' + head + caseBox + qbar + noteHtml + body + actions + '</div>' + ladder + '</div>';
  tick();
}

function swapPool(a) {
  if (a.type === 'tf') return availTF();
  if (a.type === 'ord') return availORD();
  return availCase(CASEMAP[a.caseId]);
}

function mk(type, q, caseId) {
  var o = { type: type, id: q.id, caseId: caseId || null, resp: null, touched: false, fifty: false, audience: false, swapped: false, removed: [], points: 0, done: false, timeout: false, total: TIME[type], deadline: 0 };
  if (type === 'mc') { o.perm = shuffle(q.o.map(function (_, i) { return i; })); o.resp = []; }
  if (type === 'ord') {
    var idx = q.steps.map(function (_, i) { return i; }), p;
    do { p = shuffle(idx); } while (p.every(function (v, i) { return v === i; }));
    o.cur = p;
  }
  return o;
}

function startGame() {
  var name = (document.getElementById('pname').value || '').trim();
  formName = name;
  if (!name) { formErr = 'Escribe el nombre del estudiante para comenzar.'; render(); document.getElementById('pname').focus(); return; }
  if (capacity() < 1) { formErr = 'No quedan preguntas suficientes. Reinicia el juego desde el panel docente.'; render(); return; }
  var c;
  if (formCase === 'random') {
    var ok = CASES.filter(function (x) { return availCase(x).length >= 2; });
    var max = Math.max.apply(null, ok.map(function (x) { return availCase(x).length; }));
    var top = ok.filter(function (x) { return availCase(x).length === max; });
    c = top[rnd(top.length)];
  } else c = CASEMAP[formCase];
  if (!c || availCase(c).length < 2) { formErr = 'Ese caso ya no tiene preguntas suficientes. Elige otro.'; render(); return; }
  var tfs = shuffle(availTF()).slice(0, 2);
  var mcs = shuffle(availCase(c)).slice(0, 2);
  var ord = shuffle(availORD())[0];
  var qs = tfs.map(function (q) { return mk('tf', q); }).concat(mcs.map(function (q) { return mk('mc', q, c.id); }), [mk('ord', ord)]);
  qs.forEach(function (a) { S.used[a.id] = true; });
  S.current = { name: name, caseId: c.id, qs: qs, idx: 0, life: { audience: false, fifty: false, swap: false }, started: Date.now() };
  formName = ''; formErr = ''; formCase = 'random'; flashMsg = '';
  beginQuestion();
}

function beginQuestion() {
  var a = cur();
  a.total = TIME[a.type];
  a.deadline = Date.now() + a.total * 1000;
  save();
  view = 'game';
  flashMsg = '';
  render();
  window.scrollTo({ top: 0 });
}

function tick() {
  if (view !== 'game' || !S.current || busy) return;
  var a = cur(); if (!a || a.done) return;
  var left = Math.max(0, a.deadline - Date.now());
  var secs = Math.ceil(left / 1000);
  var ring = document.getElementById('ring'), num = document.getElementById('secs'), box = document.getElementById('timer');
  if (ring) ring.setAttribute('stroke-dashoffset', String(251.33 * (1 - left / (a.total * 1000))));
  if (num) num.textContent = secs;
  if (box) box.classList.toggle('low', secs <= 5);
  if (left <= 0) finalize(true);
}
setInterval(tick, 200);

function grade(a) {
  var q = qOf(a);
  if (a.type === 'tf') a.points = a.resp === null ? 0 : (a.resp === q.a ? 1 : 0);
  else if (a.type === 'mc') {
    var correct = q.o.map(function (o, i) { return o[1] ? i : -1; }).filter(function (i) { return i > -1; }).sort().join(',');
    var mine = (a.resp || []).slice().sort().join(',');
    a.points = mine && mine === correct ? (a.fifty ? 0.5 : 1) : 0;
  } else {
    a.points = a.resp && a.resp.every(function (v, i) { return v === i; }) ? 1 : 0;
  }
}

function finalize(timeout) {
  var g = S.current, a = cur();
  if (!a || a.done || busy) return;
  busy = true;
  if (a.type === 'ord') a.resp = (a.touched || !timeout) ? a.cur.slice() : null;
  if (a.type === 'mc' && a.resp && !a.resp.length) a.resp = null;
  a.timeout = timeout;
  grade(a);
  a.done = true;
  save();
  var last = g.idx >= g.qs.length - 1;
  var nextLabel = last ? 'Preparando tu resultado…' : 'Siguiente: pregunta ' + (g.idx + 2) + ' · ' + TYPE_LABEL[g.qs[g.idx + 1].type];
  layer.innerHTML = '<div class="veil" role="status"><div class="box"><span class="big' + (timeout ? ' time' : '') + '">' + (timeout ? '¡Se acabó el tiempo!' : 'Respuesta registrada') + '</span><span class="sub">' + nextLabel + '</span></div></div>';
  setTimeout(function () {
    layer.innerHTML = '';
    busy = false;
    if (last) endGame();
    else { g.idx++; beginQuestion(); }
  }, 1500);
}

function endGame() {
  var g = S.current;
  var total = g.qs.reduce(function (s, a) { return s + a.points; }, 0);
  g.total = total; g.ended = Date.now();
  S.results.push({ name: g.name, caso: CASEMAP[g.caseId].title, nota: total, fecha: g.ended, det: g.qs.map(function (a) { return a.points; }) });
  lastGame = g;
  S.current = null;
  save();
  view = 'summary';
  render();
  window.scrollTo({ top: 0 });
}

function useLife(k) {
  var g = S.current, a = cur();
  if (!a || a.done || g.life[k]) return;
  if (k === 'audience') {
    g.life.audience = true; a.audience = true; a.deadline += AUDIENCE_BONUS * 1000; a.total += AUDIENCE_BONUS;
  } else if (k === 'fifty') {
    if (a.type !== 'mc') return;
    var q = qOf(a);
    var wrong = q.o.map(function (o, i) { return o[1] ? -1 : i; }).filter(function (i) { return i > -1; });
    var remove = shuffle(wrong).slice(0, Math.ceil(wrong.length / 2));
    g.life.fifty = true; a.fifty = true; a.removed = remove;
    a.resp = (a.resp || []).filter(function (i) { return remove.indexOf(i) < 0; });
  } else if (k === 'swap') {
    var pool = swapPool(a);
    if (!pool.length) return;
    var nq = pool[rnd(pool.length)];
    S.used[nq.id] = true;
    var na = mk(a.type, nq, a.caseId);
    na.swapped = true; na.replaced = a.id;
    g.life.swap = true;
    g.qs[g.idx] = na;
    flashMsg = '';
    beginQuestion();
    return;
  }
  save();
  render();
}

function moveStep(from, to) {
  var a = cur();
  if (!a || a.type !== 'ord' || to < 0 || to >= a.cur.length || from === to) return;
  var item = a.cur.splice(from, 1)[0];
  a.cur.splice(to, 0, item);
  a.touched = true;
  save();
  render();
}

/* ---------- Resumen ---------- */
function feedback(n) {
  if (n >= 4.5) return 'Excelente. Entiendes el networking como construcción de relaciones: confianza, intercambio de valor y netiqueta.';
  if (n >= 3.5) return 'Muy bien. Dominas la mayoría de los conceptos; revisa la retroalimentación de las preguntas que fallaste.';
  if (n >= 3) return 'Aprobaste. Repasa en la presentación los temas de las preguntas que no acertaste antes de actualizar tu mapa de red.';
  return 'Aún hay conceptos por reforzar. Repasa la presentación y tu Pasaporte de Red, sobre todo los temas de las preguntas que fallaste.';
}
function lifeChips(a) {
  var c = [];
  if (a.audience) c.push('<span class="pill cyan">Pregunta al público</span>');
  if (a.fifty) c.push('<span class="pill gold">50:50 · valía 0,5</span>');
  if (a.swapped) c.push('<span class="pill cyan">Pregunta cambiada</span>');
  if (a.timeout) c.push('<span class="pill gold">Tiempo agotado</span>');
  return c.length ? '<div class="chips">' + c.join('') + '</div>' : '';
}
function renderSummary() {
  var g = lastGame;
  var cards = g.qs.map(function (a, i) {
    var q = qOf(a);
