    var title, ctx = '', mine, right;
    if (a.type === 'tf') {
      title = q.q;
      mine = '<p>' + (a.resp === null ? 'Sin respuesta' : a.resp ? 'Verdadero' : 'Falso') + '</p>';
      right = '<p>' + (q.a ? 'Verdadero' : 'Falso') + '</p>';
    } else if (a.type === 'mc') {
      title = q.q; ctx = '<p class="ctx">Caso: ' + esc(MCMAP[a.id].c.title) + '</p>';
      mine = a.resp && a.resp.length ? '<ul>' + a.resp.map(function (oi) { return '<li>' + esc(q.o[oi][0]) + '</li>'; }).join('') + '</ul>' : '<p>Sin respuesta</p>';
      right = '<ul>' + q.o.filter(function (o) { return o[1]; }).map(function (o) { return '<li>' + esc(o[0]) + '</li>'; }).join('') + '</ul>';
    } else {
      title = q.sit;
      mine = a.resp ? '<ol>' + a.resp.map(function (si) { return '<li>' + esc(q.steps[si]) + '</li>'; }).join('') + '</ol>' : '<p>Sin respuesta (no se movió ningún paso)</p>';
      right = '<ol>' + q.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>';
    }
    return '<article class="rev"><header><span class="k">Pregunta ' + (i + 1) + ' · ' + TYPE_LABEL[a.type] + '</span><span class="score ' + sc + '">' + scTxt + '</span></header>' + ctx +
      '<h3>' + esc(title) + '</h3>' + lifeChips(a) +
      '<div class="cmp"><div><small>Tu respuesta</small>' + mine + '</div><div><small>Respuesta correcta</small>' + right + '</div></div>' +
      '<p class="why"><b>Por qué:</b> ' + esc(q.why) + '</p></article>';
  }).join('');
  app.innerHTML = '<p class="brand">Marca Personal Digital - Quiz de recuperación · Resultado</p>' +
    '<div class="sumhead"><div class="grade" role="img" aria-label="Nota ' + fmtPts(g.total) + ' de 5,0"><div><b>' + fmtPts(g.total) + '</b><span>de 5,0</span></div></div>' +
    '<div><span class="pill cyan">Caso ' + esc(CASEMAP[g.caseId].title) + '</span><h2>' + esc(g.name) + ', tu nota definitiva es ' + fmtPts(g.total) + '</h2><p>' + feedback(g.total) + '</p></div></div>' +
    '<div class="reviews">' + cards + '</div>' +
    '<div class="foot"><button class="btn primary lg" data-act="next">Siguiente jugador</button></div>';
}

/* ---------- Panel docente ---------- */
function renderLayer() {
  if (!admin.open) { if (!busy) layer.innerHTML = ''; return; }
  var html;
  if (!admin.unlocked) {
    html = '<div class="card" id="keyform"><h2>Panel docente</h2><p class="note">Escribe la clave para ver los resultados o reiniciar el juego.</p>' +
      '<label class="f" for="key">Clave<input type="password" id="key" autocomplete="off" autocapitalize="off" spellcheck="false"></label>' +
      (admin.err ? '<p class="err" role="alert">' + esc(admin.err) + '</p>' : '') +
      '<div class="row"><button class="btn primary" type="button" data-act="unlock">Entrar</button><button class="btn" type="button" data-act="close">Cancelar</button></div></div>';
  } else {
    var usedTF = TF.length - availTF().length, usedORD = ORD.length - availORD().length;
    var mcTotal = CASES.length * 5, mcAvail = CASES.reduce(function (s, c) { return s + availCase(c).length; }, 0);
    var rows = S.results.slice().reverse().map(function (r) {
      var d = new Date(r.fecha);
      return '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.caso) + '</td><td class="num">' + fmtPts(r.nota) + '</td><td>' + d.toLocaleDateString('es-CO') + ' ' + d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }) + '</td></tr>';
    }).join('');
    var caseRows = CASES.map(function (c, i) { return '<tr><td>Caso ' + (i + 1) + '</td><td>' + esc(c.title) + '</td><td class="num">' + availCase(c).length + ' de 5</td></tr>'; }).join('');
    html = '<div class="card"><div class="row" style="justify-content:space-between"><h2>Panel docente</h2><button class="btn" data-act="close">Cerrar</button></div>' +
      '<div class="stats"><div class="stat"><small>Verdadero o falso</small><b>' + (TF.length - usedTF) + '</b> de ' + TF.length + '</div><div class="stat"><small>Casos</small><b>' + mcAvail + '</b> de ' + mcTotal + '</div><div class="stat"><small>Ordenar</small><b>' + (ORD.length - usedORD) + '</b> de ' + ORD.length + '</div><div class="stat"><small>Alcanza para</small><b>' + capacity() + '</b> jugadores</div></div>' +
      '<h3 style="margin:4px 0 0;font-family:var(--font-display)">Resultados de la ronda</h3>' +
      (rows ? '<div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Caso</th><th>Nota</th><th>Fecha</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="note">Aún no hay resultados. Aparecerán aquí cuando cada estudiante termine su partida.</p>') +
      '<h3 style="margin:4px 0 0;font-family:var(--font-display)">Preguntas disponibles por caso</h3>' +
      '<div class="tablewrap"><table><thead><tr><th>Caso</th><th>Nombre</th><th>Disponibles</th></tr></thead><tbody>' + caseRows + '</tbody></table></div>' +
      '<section class="danger"><h3>Reiniciar el juego</h3><p class="note">Todas las preguntas vuelven a estar disponibles y se cancela cualquier partida en curso.</p>' +
      '<label class="check" for="wipe"><input type="checkbox" id="wipe"' + (admin.wipe ? ' checked' : '') + '> Borrar también los resultados registrados</label>' +
      (admin.confirm ? '<div class="row"><span>¿Confirmas el reinicio?</span><button class="btn warn" data-act="resetYes">Sí, reiniciar</button><button class="btn" data-act="resetNo">Cancelar</button></div>' : '<div class="row"><button class="btn warn" data-act="reset">Reiniciar juego</button></div>') +
      (admin.done ? '<p class="note" role="status">' + esc(admin.done) + '</p>' : '') +
      '</section></div>';
  }
  layer.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="Panel docente">' + html + '</div>';
  var k = document.getElementById('key'); if (k) k.focus();
}

/* =================== EVENTOS =================== */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  var act = t.dataset.act;
  if (act === 'start') { formCase = document.getElementById('pcase').value; startGame(); }
  else if (act === 'resume') {
    var a = cur();
    if (a && a.done) {
      if (S.current.idx >= S.current.qs.length - 1) { endGame(); return; }
      S.current.idx++; beginQuestion(); return;
    }
    view = 'game'; render();
    if (a && Date.now() >= a.deadline) finalize(true);
  }
  else if (act === 'tf') { var a1 = cur(); if (a1.done || busy) return; a1.resp = t.dataset.v === 'true'; save(); render(); }
  else if (act === 'mc') {
    var a2 = cur(); if (a2.done || busy) return;
    var i = +t.dataset.i, need = needOf(qOf(a2));
    var sel = a2.resp || [];
    var at = sel.indexOf(i);
    if (at > -1) { sel.splice(at, 1); flashMsg = ''; }
    else if (sel.length >= need) { flashMsg = 'Ya marcaste ' + need + '. Quita una para elegir otra.'; render(); return; }
    else { sel.push(i); flashMsg = ''; }
    a2.resp = sel; save(); render();
  }
  else if (act === 'up') moveStep(+t.dataset.pos, +t.dataset.pos - 1);
  else if (act === 'down') moveStep(+t.dataset.pos, +t.dataset.pos + 1);
  else if (act === 'submit') finalize(false);
  else if (act === 'unlock') tryUnlock();
  else if (act === 'life') useLife(t.dataset.k);
  else if (act === 'next') { lastGame = null; view = 'home'; render(); window.scrollTo({ top: 0 }); }
  else if (act === 'admin') { admin = { open: true, unlocked: false, err: '', confirm: false, wipe: false, done: '' }; renderLayer(); }
  else if (act === 'close') { admin.open = false; renderLayer(); if (view === 'home') render(); }
  else if (act === 'reset') { admin.wipe = document.getElementById('wipe').checked; admin.confirm = true; admin.done = ''; renderLayer(); }
  else if (act === 'resetNo') { admin.confirm = false; renderLayer(); }
  else if (act === 'resetYes') {
    var keep = admin.wipe ? [] : S.results;
    S = blank(); S.results = keep; save();
    lastGame = null; view = 'home';
    admin.confirm = false; admin.done = 'Juego reiniciado. Todas las preguntas están disponibles de nuevo.';
    render();
  }
});
function tryUnlock() {
  var k = document.getElementById('key');
  var v = k ? k.value.trim() : '';
  if (fp(v) === KEY_FP) { admin.unlocked = true; admin.err = ''; }
  else admin.err = 'Clave incorrecta. Revisa mayúsculas y minúsculas.';
  renderLayer();
}
document.addEventListener('input', function (e) {
  if (e.target.id === 'pname') formName = e.target.value;
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'pcase') { formCase = e.target.value; formName = document.getElementById('pname').value; formErr = ''; render(); }
  if (e.target.id === 'wipe') admin.wipe = e.target.checked;
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && admin.open) { admin.open = false; renderLayer(); }
  if (e.key === 'Enter' && e.target.id === 'key') { e.preventDefault(); tryUnlock(); return; }
  if (e.key === 'Enter' && e.target.id === 'pname') { formCase = document.getElementById('pcase').value; startGame(); }
});

/* Arrastrar y soltar (ordenar) */
document.addEventListener('dragstart', function (e) {
  var h = e.target.closest && e.target.closest('.oitem .hexrow'); if (!h) return;
  dragFrom = +h.dataset.pos;
  h.closest('.oitem').classList.add('drag');
  try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragFrom)); } catch (err) {}
});
document.addEventListener('dragover', function (e) {
  var li = e.target.closest && e.target.closest('.oitem'); if (!li || dragFrom === null) return;
  e.preventDefault();
  document.querySelectorAll('.oitem.over').forEach(function (x) { if (x !== li) x.classList.remove('over'); });
  li.classList.add('over');
});
document.addEventListener('drop', function (e) {
  var li = e.target.closest && e.target.closest('.oitem'); if (!li || dragFrom === null) return;
  e.preventDefault();
  var to = +li.dataset.pos, from = dragFrom; dragFrom = null;
  moveStep(from, to);
});
document.addEventListener('dragend', function () {
  dragFrom = null;
  document.querySelectorAll('.oitem.drag, .oitem.over').forEach(function (x) { x.classList.remove('drag', 'over'); });
});

render();
})();
</script>

</body></html>
